<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#065f46" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coco Campo" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<title>Controle de Campo — Coco</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#f5f5f4; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#292524; }
  #app { min-height:100vh; padding-bottom: 0; }

  .header { background:linear-gradient(135deg, #065f46, #047857); color:#fff; padding:10px 14px 8px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.12); overflow:hidden; }
  .header-palmeira { position:absolute; right:6px; top:-18px; width:74px; height:auto; pointer-events:none; z-index:0; opacity:.55; }
  .header > *:not(.header-palmeira) { position:relative; z-index:1; }
  .header-linha1 { display:flex; align-items:center; gap:10px; }
  .header-linha2 { display:flex; align-items:center; gap:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.14); }
  .header .icon-badge { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
  .header .title { font-weight:800; font-size:14.5px; line-height:1.2; }
  .header .status { font-size:10.5px; line-height:1.3; display:flex; align-items:center; gap:5px; margin-top:2px; }
  .status.online { color:#a7f3d0; }
  .status.offline { color:#fcd34d; font-weight:600; }
  .header .spacer { flex:1; }
  .clima-pill { background:rgba(255,255,255,.16); border-radius:99px; padding:6px 10px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:4px; margin-right:2px; }
  .btn-export { background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:10px; padding:6px 10px; font-size:10.5px; font-weight:700; display:flex; align-items:center; gap:5px; cursor:pointer; }
  .btn-export:active { background:rgba(255,255,255,.3); }
  .backup-pill { font-size:9.5px; color:#d1fae5; }
  .backup-pill.enviando { color:#fcd34d; }
  .backup-pill.ok { color:#a7f3d0; font-weight:700; }
  .backup-pill.erro { color:#fca5a5; font-weight:700; }

  /* Navegação fica só embaixo agora (jeito mais fácil de alcançar com o polegar no celular),
     numa barra fixa flutuando por cima do conteúdo — por isso o .content tem padding-bottom
     grande, senão a última parte da tela ficaria escondida atrás da barra. */
  .bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:30; box-shadow:0 -2px 10px rgba(0,0,0,.10); }
  .tabs { display:flex; background:#fff; border-top:1px solid #e7e5e4; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab-btn { flex: 0 0 auto; min-width:68px; text-align:center; padding:8px 5px; font-size:10px; font-weight:700; color:#a8a29e; background:none; border:none; border-top:3px solid transparent; cursor:pointer; line-height:1.1; white-space:nowrap; }
  .tab-btn.active { color:#065f46; border-top-color:#065f46; }
  .tab-btn .ic { display:block; font-size:17px; margin-bottom:2px; }

  .tabs.subtabs { background:#f0fdf4; border-top:1px solid #e7e5e4; }
  .tabs.subtabs .tab-btn { min-width:0; padding:6px 12px; font-size:10px; border-top:none; }
  .tabs.subtabs .tab-btn.active { background:#dcfce7; border-radius:99px; margin:3px 3px; padding:5px 12px; }
  .tabs.subtabs .tab-btn .ic { font-size:13px; margin-bottom:0; display:inline; margin-right:3px; }
  body[data-tema="escuro"] .tabs.subtabs { background:#122019; }

  .content { max-width: 720px; margin: 0 auto; padding: 10px; }
  .card { background:#fff; border:1px solid #e7e5e4; border-radius:16px; padding:13px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .card h3 { margin:0 0 10px; font-size:13px; font-weight:700; color:#44403c; display:flex; align-items:center; gap:6px; }
  .saving-pill { font-size:11px; color:#78716c; margin-left:auto; }
  .saving-pill.offline { color:#d97706; font-weight:700; }
  .saving-pill.saved { color:#047857; }

  .grid { display:grid; gap:8px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width:640px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }

  label.field { display:flex; flex-direction:column; gap:3px; }
  label.field span { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#78716c; }
  input, select { font-size:15px; padding:8px 9px; border:1px solid #d6d3d1; border-radius:7px; background:#fff; color:#292524; width:100%; }
  input:focus, select:focus { outline:2px solid #059669; border-color:#059669; }
  input.amarelo { background:#fff2cc; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:#065f46; color:#fff; border:none; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; width:100%; }
  .btn:active { background:#064e3b; }
  .btn.danger { background:transparent; color:#dc2626; }
  .btn.ghost { background:transparent; color:#065f46; }

  .carga-card { border:1px solid #e7e5e4; border-radius:12px; margin-bottom:10px; overflow:hidden; background:#fff; }
  .carga-head { width:100%; text-align:left; padding:12px 14px; background:none; border:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; cursor:pointer; }
  .carga-head .left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; flex:1 1 100%; }
  .carga-head .num { font-weight:700; color:#292524; }
  .carga-head .badge { background:#f5f5f4; color:#57534e; border-radius:99px; padding:2px 8px; font-size:11px; }
  .carga-body { border-top:1px solid #f0efee; padding:12px 14px; }
  .carga-resumo { display:flex; gap:6px; flex:1 1 100%; }
  .resumo-item { flex:1; background:#f5f5f4; border-radius:8px; padding:6px 4px; text-align:center; }
  .resumo-lbl { display:block; font-size:10px; font-weight:700; text-transform:uppercase; color:#a8a29e; letter-spacing:.02em; }
  .resumo-val { display:block; font-size:17px; font-weight:800; color:#292524; margin-top:1px; }
  .resumo-val.neg { color:#dc2626; }
  .resumo-val.pos { color:#047857; }

  table.tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.tbl th { text-align:right; color:#78716c; font-weight:600; padding:5px 6px; border-bottom:1px solid #e7e5e4; white-space:nowrap;}
  table.tbl th:first-child, table.tbl td:first-child { text-align:left; }
  table.tbl td { padding:5px 6px; border-bottom:1px solid #f5f5f4; text-align:right; }
  .tbl-wrap { overflow-x:auto; margin: 0 -14px; padding: 0 14px; }
  .neg { color:#dc2626; font-weight:700; }
  .pos { color:#047857; font-weight:700; }
  .x-btn { background:none; border:none; color:#a8a29e; cursor:pointer; padding:8px; font-size:17px; line-height:1; }
  .x-btn:active { color:#065f46; }
  .bag-pendente-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:14px; }
  @media (min-width:420px) { .bag-pendente-grid { grid-template-columns: repeat(4, 1fr); } }
  .bag-pendente-btn { background:#fffbeb; border:2px solid #fde68a; color:#92400e; font-weight:800; font-size:14px; padding:14px 4px; border-radius:10px; cursor:pointer; }
  .bag-pendente-btn:active { background:#fde68a; }
  .x-btn:active { color:#dc2626; }

  .stat-box { background:#f0fdf4; border-radius:14px; padding:10px 8px; text-align:center; }
  .stat-box.ico { display:flex; align-items:center; gap:9px; text-align:left; padding:9px 10px; }
  .stat-ic { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; background:#dcfce7; }
  .stat-ic.laranja { background:#FFEDD5; }
  .stat-ic.vermelho { background:#FFC7CE; }
  .stat-ic.azul { background:#D9E1F2; }
  .stat-ic.branco { background:rgba(255,255,255,.7); }

  .list-row { display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid #f0efee; }
  .list-row:last-child { border-bottom:none; }
  .list-row .chev { color:#c4c1bf; font-size:15px; margin-left:auto; }
  .card.acento { border-left:4px solid #065f46; }
  .card.acento.vermelho { border-left-color:#dc2626; }
  .card.acento.laranja { border-left-color:#f97316; }
  .card.acento.verde { border-left-color:#16a34a; }
  .stat-box .lbl { font-size:10px; text-transform:uppercase; color:#a8a29e; }
  .stat-box .val { font-size:17px; font-weight:700; color:#292524; }
  .stat-box.green { background:#ecfdf5; }
  .stat-box.green .lbl { color:#059669; }
  .stat-box.green .val { color:#065f46; }

  .status-pill { display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; }
  .status-pill.verde { background:#C6EFCE; color:#065f46; }
  .status-pill.amarelo { background:#FED7AA; color:#9a3412; }
  .status-pill.vermelho { background:#FFC7CE; color:#9c0006; }
  .status-pill.azul { background:#D9E1F2; color:#1e3a6e; }
  .status-pill.cinza { background:#e7e5e4; color:#57534e; }

  .aplic-section { margin-bottom:14px; }
  .aplic-section-hdr { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; color:#292524; padding:10px 4px 8px; }
  .aplic-row { display:grid; grid-template-columns: 56px 1fr; gap:8px; padding:10px; border-bottom:1px solid #f0efee; align-items:start; }
  .aplic-row:last-child { border-bottom:none; }
  .aplic-setor { font-weight:800; font-size:13px; color:#292524; padding-top:6px; }
  .aplic-fields { display:grid; grid-template-columns: repeat(2, 1fr); gap:6px; }
  .aplic-fields .field span { font-size:9.5px; }
  .aplic-fields input { padding:6px 7px; font-size:13px; }
  .aplic-meta { grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between; margin-top:4px; font-size:11.5px; color:#78716c; }

  .plantas-grid { display:grid; grid-template-columns: repeat(6, 1fr); gap:5px; max-height:230px; overflow-y:auto; padding:2px; margin-bottom:10px; }
  @media (min-width:520px) { .plantas-grid { grid-template-columns: repeat(8, 1fr); } }
  .planta-cell { text-align:center; }
  .planta-cell.atual-voz input { border-color:#dc2626; border-width:2px; background:#fef2f2; box-shadow:0 0 0 3px rgba(220,38,38,.15); }
  .btn-voz { background:#f5f5f4; color:#44403c; border:1px solid #d6d3d1; border-radius:99px; padding:5px 11px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn-voz.ativo { background:#dc2626; color:#fff; border-color:#dc2626; animation: pulsa-voz 1.4s infinite; }
  @keyframes pulsa-voz { 0%,100% { opacity:1; } 50% { opacity:.72; } }
  .planta-cell .n { font-size:9px; color:#a8a29e; display:block; }
  .planta-cell input { text-align:center; padding:6px 2px; font-size:13px; }

  .empty { text-align:center; padding:26px 10px; color:#a8a29e; font-size:13px; }
  .row-flex { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted { color:#a8a29e; font-size:12px; }

  .fotos-carga-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .fotos-carga-btns button { width:auto; padding:7px 11px; font-size:12px; border-radius:8px; border:1px solid #d6d3d1; background:#f5f5f4; color:#44403c; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .fotos-carga-btns button.seco { border-color:#fde68a; background:#fffbeb; color:#92400e; }
  .fotos-carga-btns button.verde { border-color:#a7f3d0; background:#ecfdf5; color:#065f46; }
  .fotos-carga-btns button.balanca { border-color:#bfdbfe; background:#eff6ff; color:#1d4ed8; }
  .fotos-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
  @media (min-width:520px) { .fotos-grid { grid-template-columns: repeat(5, 1fr); } }
  .foto-item { position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:#f0efee; border:1px solid #e7e5e4; }
  .foto-item img { width:100%; height:100%; object-fit:cover; cursor:pointer; display:block; }
  .foto-tipo-badge { position:absolute; left:3px; bottom:3px; font-size:8.5px; font-weight:700; padding:2px 5px; border-radius:99px; background:rgba(0,0,0,.55); color:#fff; white-space:nowrap; }
  .foto-tipo-badge.seco { background:rgba(180,83,9,.85); }
  .foto-tipo-badge.verde { background:rgba(6,95,70,.85); }
  .foto-tipo-badge.balanca { background:rgba(29,78,216,.85); }
  .foto-del { position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:99px; width:20px; height:20px; font-size:12px; line-height:1; cursor:pointer; }
  .foto-uploading { display:flex; align-items:center; justify-content:center; font-size:9px; color:#78716c; text-align:center; padding:4px; }

  .install-banner { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; display:none; align-items:center; gap:8px; }
  .install-banner.show { display:flex; }
  .install-banner button { background:#d97706; color:#fff; border:none; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }

  .btn-tema { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:99px; width:34px; height:34px; font-size:16px; cursor:pointer; margin-right:6px; flex-shrink:0; }
  .btn-tema:active { background:rgba(255,255,255,.3); }

  /* ===================== TEMA ESCURO ===================== */
  body[data-tema="escuro"] { background:#121815; color:#e7e5e4; }
  body[data-tema="escuro"] .tabs { background:#1a2320; border-top-color:#2d3733; }
  body[data-tema="escuro"] .tab-btn { color:#7d8a83; }
  body[data-tema="escuro"] .tab-btn.active { color:#4ade80; border-top-color:#4ade80; }
  body[data-tema="escuro"] .card, body[data-tema="escuro"] .carga-card { background:#1a2320; border-color:#2d3733; }
  body[data-tema="escuro"] .card h3 { color:#e7e5e4; }
  body[data-tema="escuro"] .carga-head .num, body[data-tema="escuro"] .resumo-val,
  body[data-tema="escuro"] .stat-box .val, body[data-tema="escuro"] .aplic-setor { color:#f5f5f4; }
  body[data-tema="escuro"] .muted, body[data-tema="escuro"] .resumo-lbl, body[data-tema="escuro"] .stat-box .lbl,
  body[data-tema="escuro"] .saving-pill, body[data-tema="escuro"] .aplic-section-hdr .muted { color:#8a938d; }
  body[data-tema="escuro"] .carga-body { border-top-color:#2d3733; }
  body[data-tema="escuro"] .carga-head .badge { background:#2d3733; color:#c7ccc9; }
  body[data-tema="escuro"] .resumo-item, body[data-tema="escuro"] .stat-box { background:#232b27; }
  body[data-tema="escuro"] .stat-box.green { background:#0f3324; }
  body[data-tema="escuro"] input, body[data-tema="escuro"] select {
    background:#1f2723; border-color:#3a453f; color:#f5f5f4;
  }
  body[data-tema="escuro"] input.amarelo { background:#3a3018; }
  body[data-tema="escuro"] .tbl th { color:#8a938d; border-bottom-color:#2d3733; }
  body[data-tema="escuro"] .tbl td { border-bottom-color:#232b27; color:#e7e5e4; }
  body[data-tema="escuro"] .empty { color:#6b746e; }
  body[data-tema="escuro"] .field span { color:#8a938d; }
  body[data-tema="escuro"] .install-banner { background:#3a3018; border-color:#5a4a1f; color:#fcd34d; }
  body[data-tema="escuro"] .aplic-fields input { background:#1f2723; }
  body[data-tema="escuro"] .planta-cell.atual-voz input { background:#3a1414; }
  body[data-tema="escuro"] .btn-voz { background:#232b27; color:#c7ccc9; border-color:#3a453f; }
  body[data-tema="escuro"] .fotos-carga-btns button { background:#232b27; color:#c7ccc9; border-color:#3a453f; }
  body[data-tema="escuro"] .fotos-carga-btns button.seco { background:#3a3018; border-color:#5a4a1f; color:#fcd34d; }
  body[data-tema="escuro"] .fotos-carga-btns button.verde { background:#0f3324; border-color:#1e5a42; color:#6ee7b7; }
  body[data-tema="escuro"] .fotos-carga-btns button.balanca { background:#1e2a4a; border-color:#2d3f6b; color:#93c5fd; }
  body[data-tema="escuro"] .foto-item { background:#1f2723; border-color:#2d3733; }

  /* ===================== ALTO CONTRASTE ===================== */
  body[data-tema="contraste"] { background:#ffffff; color:#000000; }
  body[data-tema="contraste"] .card, body[data-tema="contraste"] .carga-card {
    border:2px solid #000; box-shadow:none;
  }
  body[data-tema="contraste"] .card h3 { color:#000; font-weight:800; }
  body[data-tema="contraste"] .tabs { border-top:2px solid #000; }
  body[data-tema="contraste"] .tab-btn { color:#000; }
  body[data-tema="contraste"] .tab-btn.active { color:#000; border-top:4px solid #000; font-weight:900; }
  body[data-tema="contraste"] .muted, body[data-tema="contraste"] .resumo-lbl, body[data-tema="contraste"] .stat-box .lbl,
  body[data-tema="contraste"] .saving-pill { color:#333; font-weight:700; }
  body[data-tema="contraste"] .carga-head .num, body[data-tema="contraste"] .resumo-val,
  body[data-tema="contraste"] .stat-box .val, body[data-tema="contraste"] .aplic-setor { color:#000; font-weight:900; }
  body[data-tema="contraste"] .resumo-item, body[data-tema="contraste"] .stat-box { background:#f0f0f0; border:1px solid #000; }
  body[data-tema="contraste"] input, body[data-tema="contraste"] select {
    border:2px solid #000; color:#000; font-weight:700;
  }
  body[data-tema="contraste"] input.amarelo { background:#fff3b0; }
  body[data-tema="contraste"] .tbl th { color:#000; font-weight:900; border-bottom:2px solid #000; }
  body[data-tema="contraste"] .tbl td { border-bottom:1px solid #000; color:#000; font-weight:600; }
  body[data-tema="contraste"] .btn { font-weight:900; border:2px solid #000; }
  body[data-tema="contraste"] .neg { color:#b91c1c; font-weight:900; }
  body[data-tema="contraste"] .pos { color:#166534; font-weight:900; }
  body[data-tema="contraste"] .carga-head .badge { border:1px solid #000; font-weight:700; }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <img class="header-palmeira" src="coqueiro.png" alt="" aria-hidden="true"/>
    <div class="header-linha1">
      <span class="icon-badge">🌴</span>
      <div>
        <div class="title">Controle de Campo — Coco</div>
        <div id="statusLine" class="status offline">verificando conexão…</div>
      </div>
      <div class="spacer"></div>
      <div id="climaPill" class="clima-pill" style="display:none;">
        <span id="climaIcone">☀️</span><span id="climaTemp"></span>
      </div>
      <button class="btn-tema" id="btnTema" onclick="alternarTema()" title="Trocar tema">☀️</button>
    </div>
    <div class="header-linha2">
      <span style="font-size:9px; color:#a7f3d0; opacity:.8;">v62</span>
      <div class="spacer"></div>
      <span id="backupPill" class="backup-pill"></span>
      <button class="btn-export" onclick="exportarExcel()">⬇️ Excel</button>
      <button class="btn-export" onclick="enviarBackupSheets()">📊 Sheets</button>
    </div>
  </div>

  <div class="content" style="padding-bottom:112px;">
    <div id="installBanner" class="install-banner">
      <span>📲 Instale este app na tela inicial pra abrir rapidinho, igual um app normal.</span>
      <button onclick="instalarApp()">Instalar</button>
    </div>
    <div id="tabContent"></div>
    <input type="file" id="inputFotoCarga" accept="image/*" capture="environment" multiple style="display:none" onchange="onFotosCargaSelecionadas(this)"/>
    <input type="file" id="inputFotoOcorrencia" accept="image/*" capture="environment" style="display:none" onchange="onFotoOcorrenciaSelecionada(this)"/>
  </div>

function iconeClima(codigo) {
  if (codigo === 0) return "☀️";
  if ([1, 2, 3].includes(codigo)) return "⛅";
  if ([45, 48].includes(codigo)) return "🌫️";
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(codigo)) return "🌧️";
  if ([71, 73, 75, 77, 85, 86].includes(codigo)) return "🌨️";
  if ([95, 96, 99].includes(codigo)) return "⛈️";
  return "☁️";
}

function calcLinhaRomaneio(l) {
  const estocado1 = Number(l.estocado1) || 0;
  const temCarregado = l.carregado1 !== undefined && l.carregado1 !== null && l.carregado1 !== "";
  const carregado1 = Number(l.carregado1) || 0;
  const diferenca = temCarregado ? carregado1 - estocado1 : null;
  const frutos1 = Number(l.coco1) || 0;
  const desvio = (temCarregado && estocado1) ? carregado1 / estocado1 : null;
  const mediaCarregado = (temCarregado && frutos1) ? carregado1 / frutos1 : null;
  const mediaAmostrada = Number(l.cincoCocosG) ? Number(l.cincoCocosG) / 5 / 1000 : null;
  const comparacao = (mediaAmostrada && mediaCarregado) ? mediaCarregado / mediaAmostrada : null;
  return { estocado1, carregado1, temCarregado, diferenca, desvio, mediaCarregado, mediaAmostrada, comparacao };
}

function calcDescarte(d) {
  const num = (v) => Number(v) || 0;
  const totalKg = CATS_DESCARTES.reduce((s, c) => s + num(d.cats[c.key].kg), 0);
  const totalUnid = num(d.descartesUnid) + CATS_DESCARTES.reduce((s, c) => s + num(d.cats[c.key].unid), 0);
  const pctKg = {}, pctUnid = {};
  CATS_DESCARTES.forEach((c) => {
    pctKg[c.key] = totalKg ? num(d.cats[c.key].kg) / totalKg : null;
    pctUnid[c.key] = totalUnid ? num(d.cats[c.key].unid) / totalUnid : null;
  });
  const brotoPct = pctKg.brotos;
  const perda350 = pctKg.refugos;
  const aprov350 = (brotoPct !== null && perda350 !== null) ? 1 - (brotoPct||0) - (perda350||0) : null;
  const perda400 = (pctKg.refugos||0) + (pctKg.g350_400||0);
  const aprov400 = 1 - (brotoPct||0) - perda400;
  // Descarte "de verdade" (o que realmente se perde) é só Brotos + Refugos + 350-400g. As faixas
  // 400-500g e Acima de 500g NÃO são descarte — são coco bom, só separado por tamanho. Por isso
  // esse total NÃO soma as 5 categorias como o "totalKg" acima faz (que é o processado inteiro).
  const totalKgDescarteReal = num(d.cats.brotos.kg) + num(d.cats.refugos.kg) + num(d.cats.g350_400.kg);
  return { totalKg, totalUnid, pctKg, pctUnid, brotoPct, perda350, aprov350, perda400, aprov400, totalKgDescarteReal };
}

function calcAplicacao(reg, tipo) {
  reg = reg || {};
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const parseD = (s) => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
  const addDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + Number(n)); return r; };
  const diffDias = (d) => Math.round((d - hoje) / 86400000);
  const fmtD = (d) => d ? d.toLocaleDateString("pt-BR") : "—";

  const dataProgramada = parseD(reg.dataProgramada);
  const dataAplicada = parseD(reg.dataAplicada);
  const intervalo = reg.intervalo !== undefined && reg.intervalo !== "" ? Number(reg.intervalo) : null;
  const proxima = (dataAplicada && intervalo) ? addDias(dataAplicada, intervalo) : null;

  let status, cor;
  if (tipo === "Foliar") {
    if (dataAplicada) { status = "Aplicado"; cor = "verde"; }
    else { status = "Monitorar campo"; cor = "cinza"; }
  } else if (dataAplicada) {
    if (!proxima) { status = "Concluído"; cor = "verde"; }
    else if (diffDias(proxima) < 0) { status = "Atrasado"; cor = "vermelho"; }
    else if (diffDias(proxima) <= 7) { status = "Em breve"; cor = "amarelo"; }
    else { status = "Concluído"; cor = "verde"; }
  } else if (dataProgramada) {
    if (diffDias(dataProgramada) < 0) { status = "Atrasado"; cor = "vermelho"; }
    else if (diffDias(dataProgramada) <= 7) { status = "Em breve"; cor = "amarelo"; }
    else { status = "Programado"; cor = "azul"; }
  } else {
    status = "-"; cor = "cinza";
  }
  return { status, cor, proxima, proximaFmt: fmtD(proxima), diasProxima: proxima ? diffDias(proxima) : null };
}

/* =========================================================================
   NAVEGAÇÃO ENTRE ABAS
   Organizada em categorias — cada categoria vira um botão na fileira de cima;

const SENHA_PADRAO = "2778";
function senhaAtual() { return (S.configSeguranca && S.configSeguranca.senha) || SENHA_PADRAO; }

function pedirSenha(aoConfirmar) {
  const digitada = prompt("Essa área é protegida — digite a senha do supervisor:");
  if (digitada === null) return; // cancelou, não faz nada
  if (digitada === senhaAtual()) {
    aoConfirmar();
  } else {
    alert("Senha incorreta.");
  }
}

window.trocarSenhaSupervisor = function () {
  const input = document.getElementById("novaSenhaInput");
  const nova = input ? input.value.trim() : "";
  if (!nova) { alert("Digita a nova senha primeiro."); return; }
  setDoc(doc(db, "configuracoes", "seguranca"), { senha: nova })
    .then(() => { alert("Senha atualizada!"); if (input) input.value = ""; })
    .catch((e) => { console.error(e); alert("Não consegui salvar a senha nova. Tenta de novo."); });
};

const CATEGORIAS_NAV = [
  { id: "dashboard", label: "Painel", icon: "🏠", senha: true, tabs: [{ id: "dashboard", label: "Painel", icon: "🏠" }] },
  { id: "producao", label: "Produção", icon: "🌴", tabs: [
    { id: "colheita", label: "Colheita", icon: "🌾" },
    { id: "contagem", label: "Contagem", icon: "🌱" },
    { id: "romaneio", label: "Romaneio", icon: "🚛" },
    { id: "romaneioVerde", label: "Rom. Verde", icon: "🥥" },
  ] },
  { id: "manejo", label: "Manejo", icon: "🌱", senha: true, tabs: [
    { id: "aplicacoes", label: "Aplic./Adub.", icon: "🧴" },
    { id: "ocorrencias", label: "Ocorrências", icon: "⚠️" },
  ] },
  { id: "estoque", label: "Estoque", icon: "📦", senha: true, tabs: [{ id: "estoque", label: "Estoque", icon: "📦" }] },

    { id: "programacao", label: "Programação", icon: "🗓️" },
    { id: "rendimento", label: "Rendimento", icon: "📐" },
  ] },
  { id: "fazenda", label: "Fazenda", icon: "🗺️", senha: true, tabs: [{ id: "setores", label: "Setores", icon: "🗺️" }] },
  { id: "relatorios", label: "Relatórios", icon: "📊", senha: true, tabs: [{ id: "indicadores", label: "Indicadores", icon: "📈" }] },
];

function categoriaDaAba(tab) {
  return CATEGORIAS_NAV.find((c) => c.tabs.some((t) => t.id === tab)) || CATEGORIAS_NAV[0];
}

window.mudarCategoria = function (categoriaId) {
  const cat = CATEGORIAS_NAV.find((c) => c.id === categoriaId);
  if (!cat) return;
  mudarAba(cat.tabs[0].id); // entra direto na primeira aba daquela categoria
};

// Categorias que já pediram senha uma vez nessa sessão não pedem de novo — fica desbloqueada
// até a página ser fechada/recarregada. Isso evita ficar digitando senha toda vez que troca de
// sub-aba dentro da mesma categoria protegida (ex: Aplic./Adub. <-> Ocorrências, dentro de Manejo).
S._categoriasDesbloqueadas = new Set();

window.mudarAba = function (tab) {
  const cat = categoriaDaAba(tab);
  if (cat.senha && !S._categoriasDesbloqueadas.has(cat.id)) {
    pedirSenha(() => {
      S._categoriasDesbloqueadas.add(cat.id);
      S.currentTab = tab;
      renderNav();
      renderTab();
    });
    return;
  }
  S.currentTab = tab;
  renderNav();
  renderTab();
};

function renderNav() {
  const catAtiva = categoriaDaAba(S.currentTab);

  const catHtml = CATEGORIAS_NAV.map((c) => `
    <button class="tab-btn ${c.id === catAtiva.id ? "active" : ""}" onclick="mudarCategoria('${c.id}')">
      <span class="ic">${c.icon}</span>${c.label}
    </button>`).join("");
  document.getElementById("tabsCategoria").innerHTML = catHtml;

  const subEl = document.getElementById("tabsSub");
  if (catAtiva.tabs.length > 1) {
    subEl.style.display = "flex";
    subEl.innerHTML = catAtiva.tabs.map((t) => `
      <button class="tab-btn ${t.id === S.currentTab ? "active" : ""}" onclick="mudarAba('${t.id}')">
        <span class="ic">${t.icon}</span>${t.label}
      </button>`).join("");
  } else {
    subEl.style.display = "none";
    subEl.innerHTML = "";
  }
}

function renderTab() {
  try {
    if (S.currentTab === "dashboard") renderDashboard();
    else if (S.currentTab === "colheita") renderColheita();
    else if (S.currentTab === "romaneio") renderRomaneio();
    else if (S.currentTab === "romaneioVerde") renderRomaneioVerde();
    else if (S.currentTab === "contagem") renderContagem();
    else if (S.currentTab === "aplicacoes") renderAplicacoes();
    else if (S.currentTab === "indicadores") renderIndicadores();
    else if (S.currentTab === "programacao") renderProgramacao();
    else if (S.currentTab === "rendimento") renderRendimento();
    else if (S.currentTab === "setores") renderSetores();
    else if (S.currentTab === "ocorrencias") renderOcorrencias();
    else renderEstoque();
  } catch (e) {
    // Antes, um erro aqui deixava a tela travada na versão anterior, sem avisar nada — parecia
    // que o botão "não funcionava". Agora aparece o erro de verdade na tela, pra dar pra saber
    // exatamente o que quebrou (e mandar pra gente corrigir) em vez de ficar tentando adivinhar.
    console.error("Erro ao renderizar aba " + S.currentTab + ":", e);
    document.getElementById("tabContent").innerHTML = `<div class="card" style="border-color:#dc2626;">
      <b style="color:#dc2626;">⚠️ Deu erro ao abrir essa tela.</b>
      <div class="muted" style="font-size:11px; margin-top:6px; word-break:break-word;">${esc(String(e && e.message || e))}</div>
      <div class="muted" style="font-size:11px; margin-top:6px;">Tira um print dessa mensagem e manda pra quem cuida do app.</div>
    </div>`;
  }
}

function renderCargaCard(carga, linhasCalc, totalEstocado, totalCarregado, totalDiferenca) {

  const arquivada = carga.status === "arquivada";

          <span class="num">Carga Nº ${esc(carga.numero)}</span>
          <span class="muted">${brDate(carga.data)}</span>
          ${carga.encarregado ? `<span class="muted">• ${esc(carga.encarregado)}</span>` : ""}

          ${arquivada ? `<span class="badge" style="background:#e7e5e4;">📦 arquivada</span>` : `<span class="badge" style="background:#d1fae5; color:#065f46;">em andamento</span>`}
        </div>
        <div class="carga-resumo">
          <div class="resumo-item"><span class="resumo-lbl">Quantidade</span><span class="resumo-val">${fmt(totalCoco,0)}</span></div>
          <div class="resumo-item"><span class="resumo-lbl">Estocado</span><span class="resumo-val">${fmt(totalEstocado,0)}kg</span></div>
          <div class="resumo-item"><span class="resumo-lbl">Carregado</span><span class="resumo-val">${fmt(totalCarregado,0)}kg</span></div>
          <div class="resumo-item"><span class="resumo-lbl">Diferença</span><span class="resumo-val ${totalDiferenca<0?'neg':'pos'}">${fmt(totalDiferenca,0)}kg</span></div>
        </div>

  if (aberto) {
    html += `<div class="carga-body">`;

    html += `<div class="row-flex" style="margin-bottom:10px; background:#fef3c7; border-radius:8px; padding:8px 10px;">
      <span style="font-size:12px;">Nº da carga: <b>${esc(carga.numero)}</b></span>
      <button class="btn ghost" style="width:auto; padding:4px 9px; font-size:10.5px;" onclick="editarNumeroCarga('${carga.id}')">✏️ Editar (senha)</button>
    </div>`;

    html += `<div style="font-size:11px; font-weight:700; text-transform:uppercase; color:#78716c; margin-bottom:6px;">🚛 Transporte</div>
      <div class="grid grid-4" style="margin-bottom:14px;">
        <label class="field"><span>Motorista</span><input type="text" value="${esc(carga.motorista)}" oninput="atualizarCarga('${carga.id}','motorista',this.value)"/></label>
        <label class="field"><span>Telefone do motorista</span><input type="tel" value="${esc(carga.telefoneMotorista)}" oninput="atualizarCarga('${carga.id}','telefoneMotorista',this.value)"/></label>
        <label class="field"><span>Placa do caminhão</span><input type="text" style="text-transform:uppercase;" value="${esc(carga.placa)}" oninput="atualizarCarga('${carga.id}','placa',this.value.toUpperCase())"/></label>
        <label class="field"><span>Destino da carga</span><input type="text" value="${esc(carga.destino)}" oninput="atualizarCarga('${carga.id}','destino',this.value)"/></label>
        <label class="field"><span>Horário de saída</span><input type="time" value="${esc(carga.horarioSaida)}" oninput="atualizarCarga('${carga.id}','horarioSaida',this.value)"/></label>
        <label class="field"><span>NF / CT-e (opcional)</span><input type="text" value="${esc(carga.nfCte)}" oninput="atualizarCarga('${carga.id}','nfCte',this.value)"/></label>

    // Descasca manual — quando não usa a máquina, chama descascadores pra descascar na mão,

    const listaDescasca = carga.descascaManual || [];
    const totalUnidDescasca = listaDescasca.reduce((s, d) => s + (Number(d.quantidade) || 0), 0);
    const totalPagoDescasca = listaDescasca.reduce((s, d) => s + (Number(d.quantidade) || 0) * (Number(d.valorUnidade) || 0), 0);
    html += `<div style="font-size:11px; font-weight:700; text-transform:uppercase; color:#78716c; margin-bottom:6px;">🙌 Descasca manual (descascadores)</div>
      <div class="card" style="padding:10px; margin-bottom:14px;">
        <div class="row-flex" style="margin-bottom:8px;">
          <span class="muted" style="font-size:11.5px;">Valor por unidade: <b style="color:#292524;">R$ ${valorDescascaAtual().toFixed(2)}</b></span>

        </div>

        </div>
        <button class="btn ghost" style="width:auto;" onclick="adicionarDescascaManual('${carga.id}')">➕ Adicionar</button>
        ${listaDescasca.length > 0 ? `<div style="margin-top:10px;">` +
          listaDescasca.map((d, i) => `<div class="list-row" style="padding:6px 0;">
            <span style="font-size:12.5px;"><b>${esc(d.colaborador)}</b> — ${fmt(d.quantidade,0)} un. × R$ ${Number(d.valorUnidade||0).toFixed(2)} = <b>R$ ${(Number(d.quantidade)*Number(d.valorUnidade||0)).toFixed(2)}</b></span>
            <button class="x-btn" onclick="removerDescascaManual('${carga.id}',${i})">✕</button>
          </div>`).join("") +
          `<div style="margin-top:6px; font-weight:800; font-size:13px; color:#166534;">Total: ${fmt(totalUnidDescasca,0)} unidades — R$ ${totalPagoDescasca.toFixed(2)}</div>
        </div>` : `<div class="muted" style="font-size:11px; margin-top:8px;">Nenhum lançamento ainda.</div>`}
      </div>`;

    if (!arquivada) {
      const bagsUsados = new Set(bagsDaCarga(carga.id).map((l) => String(l.idBag)));
      html += `<div style="font-size:11px; font-weight:700; text-transform:uppercase; color:#78716c; margin-bottom:6px;">🌴 Descasca do dia — adicionar bag novo</div>
        <div class="grid grid-4" style="background:#fafaf9; border-radius:9px; padding:10px; margin-bottom:14px;">
          <label class="field"><span>Identificação do bag</span>
            <select onchange="S._novaLinha.idBag=this.value">
              <option value="" ${!nl.idBag?"selected":""}>Selecione…</option>
              ${BAGS.map(n=>{
                const usado = bagsUsados.has(String(n));
                const sel = String(nl.idBag)===String(n);
                return `<option value="${n}" ${sel?"selected":""} ${usado?"disabled":""} style="${usado?"color:#a8a29e; background:#f0efee;":""}">BAG ${n}${usado?" — já usado nesta carga":""}</option>`;

            </select>
          </label>
          <label class="field"><span>Data descasca</span><input type="date" value="${esc(nl.dataDescasca)}" oninput="S._novaLinha.dataDescasca=this.value"/></label>
          <label class="field"><span>Talhão</span>
            <select onchange="S._novaLinha.talhao=this.value">
              ${TALHOES.map(t=>`<option value="${t}" ${nl.talhao===t?"selected":""}>${t}</option>`).join("")}
            </select>
          </label>
          <label class="field"><span>Coco 1ª (frutos)</span><input type="number" value="${esc(nl.coco1)}" oninput="S._novaLinha.coco1=this.value"/></label>
          <label class="field"><span>Estocado 1ª (kg)</span><input class="amarelo" type="number" value="${esc(nl.estocado1)}" oninput="S._novaLinha.estocado1=this.value"/></label>
          <div class="field" style="justify-content:flex-end;"><button class="btn" onclick="addLinha('${carga.id}')">➕ Add bag</button></div>

    }

    if (editando) {
      html += `<div style="font-size:11px; font-weight:700; text-transform:uppercase; color:#92400e; margin-bottom:6px;">🚛 Carregamento — completando o BAG ${esc(el.idBagLabel||"")}</div>
        <div class="grid grid-4" style="background:#fffbeb; border:1px solid #fde68a; border-radius:9px; padding:10px; margin-bottom:14px;">
          <label class="field"><span>Data do carregamento</span><input type="date" value="${esc(el.dataCarregamento)}" oninput="S._editLinha.dataCarregamento=this.value"/></label>
          <label class="field"><span>Carregado 1ª (kg)</span><input class="amarelo" type="number" value="${esc(el.carregado1)}" oninput="S._editLinha.carregado1=this.value; if(this.value && !S._editLinha.dataCarregamento){ S._editLinha.dataCarregamento=todayISO(); renderRomaneio(); }"/></label>
          <label class="field"><span>5 cocos carreg. (g)</span><input class="amarelo" type="number" value="${esc(el.cincoCocosG)}" oninput="S._editLinha.cincoCocosG=this.value"/></label>
          <div class="field" style="justify-content:flex-end; flex-direction:row; gap:6px;">
            <button class="btn" style="width:auto; background:#0f766e;" onclick="salvarEdicaoLinha()">💾 Salvar</button>

      const pendentes = linhasCalc.filter((l) => !l.temCarregado);

          <img src="${esc(f.url)}" loading="lazy" onclick="window.open('${esc(f.url)}','_blank')"/>

      for (let i = 0; i < enviando; i++) {
        html += `<div class="foto-item foto-uploading">⏳<br/>enviando…</div>`;

      // Fotos guardadas no celular esperando internet — usa a própria foto (base64) como prévia,

        const classeTipo = classeTipoFoto(p.tipo);
        html += `<div class="foto-item">
          <img src="data:image/jpeg;base64,${p.base64}" loading="lazy"/>
          <span class="foto-tipo-badge ${classeTipo}">⏳ ${esc(p.tipo || "Geral")}</span>

      html += `</div>`;
      if (pendentes.length > 0) {
        html += `<div class="muted" style="font-size:10.5px; margin:-6px 0 10px;">⏳ ${pendentes.length} foto${pendentes.length > 1 ? "s" : ""} guardada${pendentes.length > 1 ? "s" : ""} no celular, esperando internet pra enviar — não vai perder, pode continuar usando.</div>`;
      }
    } else {
      html += `<div class="muted" style="font-size:11.5px; margin-bottom:10px;">Nenhuma foto ainda.</div>`;
    }

    // Descarte dessa carga — ligado direto pelo ID da carga (não precisa mais digitar o número
    // de romaneio de novo; é a mesma carga, então o descarte já nasce vinculado a ela).
    html += renderDescarteDaCargaHTML(carga);

    html += `<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px; flex-wrap:wrap;">`;
    html += `<button class="btn ghost" style="width:auto; color:#128C7E; border:1px solid #128C7E;" onclick="compartilharCargaWhatsapp('${carga.id}')">📲 Compartilhar (texto)</button>`;
    html += `<button class="btn ghost" style="width:auto; color:#128C7E; border:1px solid #128C7E;" onclick="gerarImagemPesoUnidades('${carga.id}')">🖼️ Gerar imagem (com fotos)</button>`;
    if (!arquivada) {
      html += `<button class="btn danger" onclick="removeCarga('${carga.id}')">🗑️ Excluir carga</button>`;
      html += `<button class="btn" style="width:auto; background:#0f766e;" onclick="arquivarCarga('${carga.id}')">📦 Finalizar e arquivar carga</button>`;
    } else {
      html += `<button class="btn ghost" style="width:auto;" onclick="reabrirCarga('${carga.id}')">↩️ Reabrir carga</button>`;
    }
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

function bagsDaCarga(cargaId) {
  return S.bags
    .filter((b) => b.cargaId === cargaId)
    .sort((a, b) => (Number(a.idBag) || 0) - (Number(b.idBag) || 0));
}

/* =========================================================================
   FOTOS DO CARREGAMENTO
   Fotos tiradas pelo responsável na hora do carregamento, pra depois dar pra
   ver como saiu a carga (coco seco / coco verde). Os bytes da imagem vão pro
   Google Drive através do Apps Script (mesmo endpoint do backup da planilha,
   diferenciado pelo campo "action") — sem tela de login pro pessoal do campo,
   porque o script roda com a conta Google de quem publicou ele. Só a
   referência (url do Drive) e o tipo ficam guardados no Firestore, então a
   sincronização entre celulares continua em tempo real, do jeito que já era.
   ========================================================================= */
function fotosDaCarga(cargaId) {
  return S.cargaFotos
    .filter((f) => f.cargaId === cargaId)
    .sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""));
}
function classeTipoFoto(tipo) {
  if (tipo === "Coco seco") return "seco";
  if (tipo === "Coco verde") return "verde";
  if (tipo === "Aferição da balança") return "balanca";
  return "";
}

// Reduz a foto antes de enviar (câmeras de celular tiram fotos enormes e o sinal no
// campo costuma ser fraco) — redimensiona pro máximo de 1600px no lado maior e
// comprime em JPEG. Se por algum motivo não conseguir processar, manda o arquivo original.
async function comprimirImagem(file, maxDim = 1600, qualidade = 0.72) {
  try {
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if (width > maxDim || height > maxDim) {
      const escala = maxDim / Math.max(width, height);
      width = Math.round(width * escala);
      height = Math.round(height * escala);
    }
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, width, height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", qualidade));
    return blob || file;
  } catch (e) {
    console.warn("Não consegui comprimir a foto, enviando original:", e);
    return file;
  }
}

// O Apps Script recebe a imagem em base64 dentro de um JSON (não dá pra mandar o
// arquivo binário direto como o Storage aceitava) — essa função faz essa conversão.
function blobParaBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      // reader.result vem como "data:image/jpeg;base64,AAAA..." — só queremos a parte depois da vírgula
      const base64 = String(reader.result).split(",")[1] || "";
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Antes o envio da foto podia ficar "pendurado" pra sempre (ampulheta girando sem parar) se o
// sinal caísse no meio do envio ou o servidor não respondesse. Com isso, depois de X segundos sem
// resposta a gente desiste e avisa, em vez de deixar a pessoa esperando pra sempre sem saber o que houve.
function comTimeout(promise, ms, mensagem) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(mensagem || "tempo esgotado")), ms)),
  ]);
}

/* ---------- Fila de fotos pendentes: funciona sem internet -------------
   Se não tem sinal na hora de enviar, a foto não se perde: fica guardada
   aqui no próprio celular (IndexedDB) e o app tenta enviar sozinho assim
   que a internet voltar — seja porque o navegador avisou que reconectou,
   seja porque a pessoa só abriu o app de novo depois, já com sinal. */
const FOTOS_PENDENTES_DB = "coco-campo-fotos-pendentes";
const FOTOS_PENDENTES_STORE = "pendentes";

function abrirDBFotosPendentes() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FOTOS_PENDENTES_DB, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(FOTOS_PENDENTES_STORE, { keyPath: "id", autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function salvarFotoPendente(registro) {
  const db = await abrirDBFotosPendentes();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOTOS_PENDENTES_STORE, "readwrite");
    const req = tx.objectStore(FOTOS_PENDENTES_STORE).add(registro);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function listarFotosPendentes() {
  const db = await abrirDBFotosPendentes();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOTOS_PENDENTES_STORE, "readonly");
    const req = tx.objectStore(FOTOS_PENDENTES_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function removerFotoPendente(id) {
  const db = await abrirDBFotosPendentes();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOTOS_PENDENTES_STORE, "readwrite");
    tx.objectStore(FOTOS_PENDENTES_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function atualizarListaPendentesEmMemoria() {
  try {
    S._fotosPendentes = await listarFotosPendentes();
  } catch (e) {
    console.warn("Não consegui ler a fila de fotos pendentes:", e);
  }
  renderRomaneioSeAtivo();
}

// O envio de verdade — separado numa função própria porque é usado tanto na hora
// de tirar a foto quanto depois, ao tentar reenviar o que ficou na fila.
async function enviarFotoAgora({ cargaId, tipo, base64, nomeArquivo }) {
  const res = await comTimeout(fetch(BACKUP_SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita pré-checagem CORS que o Apps Script não trata bem
    body: JSON.stringify({ action: "uploadFoto", cargaId, tipo, base64, nomeArquivo, mimeType: "image/jpeg" }),
  }), 30000, "envio-demorou");
  const data = await res.json();
  if (!data || !data.ok) throw new Error((data && data.erro) || "falha desconhecida no envio");

  await addDoc(collection(db, "cargaFotos"), {
    cargaId, url: data.url, fileId: data.fileId, tipo, criadoEm: new Date().toISOString(),
  });
}

let _sincronizandoFotosPendentes = false;
async function sincronizarFotosPendentes() {
  if (_sincronizandoFotosPendentes || !navigator.onLine) return;
  _sincronizandoFotosPendentes = true;
  try {
    const pendentes = await listarFotosPendentes();
    for (const p of pendentes) {
      try {
        await enviarFotoAgora({ cargaId: p.cargaId, tipo: p.tipo, base64: p.base64, nomeArquivo: p.nomeArquivo });
        await removerFotoPendente(p.id);
        await atualizarListaPendentesEmMemoria();
      } catch (e) {
        console.warn("Ainda não consegui enviar uma foto da fila, tento de novo mais tarde:", e);
        break; // se essa falhou (sinal deve continuar ruim), não adianta insistir nas próximas agora
      }
    }
  } finally {
    _sincronizandoFotosPendentes = false;
  }
}
window.addEventListener("online", sincronizarFotosPendentes);
setInterval(sincronizarFotosPendentes, 25000); // tenta de novo periodicamente enquanto o app estiver aberto
atualizarListaPendentesEmMemoria().then(sincronizarFotosPendentes); // carrega o que sobrou de sessões anteriores e já tenta enviar

window.selecionarFotosCarga = function (cargaId, tipo) {
  S._uploadCargaId = cargaId;
  S._uploadTipoFoto = tipo;
  const input = document.getElementById("inputFotoCarga");
  if (input) input.click();
};

window.onFotosCargaSelecionadas = async function (input) {
  const cargaId = S._uploadCargaId;
  const tipo = S._uploadTipoFoto || "Carga geral";
  const files = Array.from(input.files || []);
  input.value = ""; // permite escolher o mesmo arquivo de novo depois, se precisar
  const area = S.currentTab === "romaneioVerde" ? "romaneioVerde" : "romaneio"; // pra atualizar a pilulazinha certa

  if (!cargaId || files.length === 0) return;

  S._fotosEnviando += files.length;
  marcarSalvando(area);
  renderRomaneioSeAtivo();

  for (const file of files) {
    let base64, nomeArquivo;
    try {
      const blob = await comprimirImagem(file);
      base64 = await blobParaBase64(blob);
      nomeArquivo = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`;
    } catch (e) {
      console.error("Não consegui processar essa foto:", e);
      alert("Não consegui processar uma das fotos. Tenta tirar de novo.");
      S._fotosEnviando = Math.max(0, S._fotosEnviando - 1);
      renderRomaneioSeAtivo();
      continue;
    }

    try {
      if (!navigator.onLine) throw new Error("sem-internet");
      await enviarFotoAgora({ cargaId, tipo, base64, nomeArquivo });
    } catch (e) {
      // Sem sucesso no envio (sem sinal, ou o servidor não respondeu a tempo) — em vez de perder a
      // foto, guarda no celular pra tentar de novo sozinho depois.
      console.warn("Sem sucesso no envio agora, guardando no celular pra tentar depois:", e);
      try {
        await salvarFotoPendente({ cargaId, tipo, base64, nomeArquivo, mimeType: "image/jpeg", criadoEm: new Date().toISOString() });
        await atualizarListaPendentesEmMemoria();
      } catch (e2) {
        console.error("Falha ao guardar a foto localmente:", e2);
        alert("Não consegui enviar nem guardar essa foto agora. Tenta de novo.");
      }
    } finally {
      S._fotosEnviando = Math.max(0, S._fotosEnviando - 1);
      renderRomaneioSeAtivo(); // atualiza a cada foto, não só no final — some a ampulheta assim que aquela terminar
    }
  }

  if (S._fotosEnviando === 0) setSaveStatus(area, "saved");
};

// Manda os totais da carga (e as fotos, quando o celular permite) direto pro compartilhamento
// nativo — o WhatsApp aparece como uma das opções pra escolher o contato/grupo. Não tem como
// pular esse último toque: por segurança, nenhum site consegue mandar mensagem sozinho pelo
// WhatsApp de alguém sem a pessoa escolher o destino na hora.
window.compartilharCargaWhatsapp = async function (cargaId) {
  const carga = S.cargas.find((c) => c.id === cargaId);
  if (!carga) return;

  const linhasCalc = bagsDaCarga(cargaId).map((l) => ({ ...l, ...calcLinhaRomaneio(l) }));
  const totalCoco = linhasCalc.reduce((s, l) => s + (Number(l.coco1) || 0), 0);
  const totalEstocado = linhasCalc.reduce((s, l) => s + l.estocado1, 0);
  const totalCarregado = linhasCalc.reduce((s, l) => s + l.carregado1, 0);
  const totalDiferenca = totalCarregado - totalEstocado;

  const texto = `🌴 *Carga Nº ${carga.numero}* — ${brDate(carga.data)}\n` +
    (carga.encarregado ? `Encarregado: ${carga.encarregado}\n` : "") +
    (carga.motorista ? `Motorista: ${carga.motorista}${carga.telefoneMotorista ? " (" + carga.telefoneMotorista + ")" : ""}\n` : "") +
    (carga.placa ? `Placa: ${carga.placa}\n` : "") +
    (carga.destino ? `Destino: ${carga.destino}\n` : "") +
    (carga.horarioSaida ? `Saída: ${carga.horarioSaida}\n` : "") +
    (carga.nfCte ? `NF/CT-e: ${carga.nfCte}\n` : "") +
    `Bags: ${linhasCalc.length}\n` +
    `Quantidade: ${fmt(totalCoco, 0)} cocos\n` +
    `Estocado: ${fmt(totalEstocado, 0)} kg\n` +
    `Carregado: ${fmt(totalCarregado, 0)} kg\n` +
    `Diferença: ${fmt(totalDiferenca, 0)} kg`;

  const fotos = fotosDaCarga(cargaId);
  let arquivos = [];
  if (fotos.length > 0 && navigator.canShare) {
    try {
      const blobs = await Promise.all(fotos.map((f) => fetch(f.url).then((r) => r.blob())));
      arquivos = blobs.map((b, i) => new File([b], `carga-${carga.numero}-${i + 1}.jpg`, { type: b.type || "image/jpeg" }));
      if (!navigator.canShare({ files: arquivos })) arquivos = []; // esse navegador não aceita compartilhar arquivo, só texto
    } catch (e) {
      console.warn("Não consegui baixar as fotos pra compartilhar, mandando só o texto:", e);
      arquivos = [];
    }
  }

  if (navigator.share) {
    try {
      await navigator.share(arquivos.length > 0
        ? { title: `Carga ${carga.numero}`, text: texto, files: arquivos }
        : { title: `Carga ${carga.numero}`, text: texto });
      return;
    } catch (e) {
      if (e.name === "AbortError") return; // a pessoa cancelou o compartilhamento, tudo bem
      console.warn("Falha ao abrir o compartilhamento nativo, caindo pro link do WhatsApp:", e);
    }
  }

  // Fallback pra quando o celular/navegador não tem compartilhamento nativo (ex: computador):
  // abre o WhatsApp Web já com o texto pronto. As fotos, nesse caso, precisam ser anexadas na mão.
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, "_blank");
};

// Tabelinha "Total de Peso e Unidades" — só 1ª qualidade (o app não separa 2ª). Desenhada em
// escala 3x (depois compactada de volta no tamanho normal) pra sair nítida mesmo em telas de
// alta densidade — sem isso, a imagem saía borrada quando ampliada no celular.
// Imagem-resumo da carga — mesmas informações que já vão no "Compartilhar (texto)", só que em
// forma de tabela desenhada (mais fácil de bater o olho), com o Peso Médio (carregado ÷
// quantidade em unidades) e, junto no mesmo compartilhamento, as fotos da carga já lançadas.
window.gerarImagemPesoUnidades = async function (cargaId) {
  const carga = S.cargas.find((c) => c.id === cargaId);
  if (!carga) return;
  const bags = bagsDaCarga(cargaId);
  const linhasCalc = bags.map((l) => ({ ...l, ...calcLinhaRomaneio(l) }));
  const totalCoco = linhasCalc.reduce((s, l) => s + (Number(l.coco1) || 0), 0);
  const totalEstocado = linhasCalc.reduce((s, l) => s + l.estocado1, 0);
  const totalCarregado = linhasCalc.reduce((s, l) => s + l.carregado1, 0);
  const totalDiferenca = totalCarregado - totalEstocado;
  const pesoMedio = totalCoco > 0 ? totalCarregado / totalCoco : 0;

  const linhas = [];
  if (carga.encarregado) linhas.push(["Encarregado", carga.encarregado]);
  if (carga.motorista) linhas.push(["Motorista", carga.motorista + (carga.telefoneMotorista ? ` (${carga.telefoneMotorista})` : "")]);
  if (carga.placa) linhas.push(["Placa", carga.placa]);
  if (carga.destino) linhas.push(["Destino", carga.destino]);
  if (carga.horarioSaida) linhas.push(["Horário de saída", carga.horarioSaida]);
  if (carga.nfCte) linhas.push(["NF/CT-e", carga.nfCte]);
  linhas.push(["Bags", String(linhasCalc.length)]);
  linhas.push(["Quantidade", `${fmt(totalCoco, 0)} cocos`]);
  linhas.push(["Estocado", `${fmt(totalEstocado, 0)} kg`]);
  linhas.push(["Carregado", `${fmt(totalCarregado, 0)} kg`]);
  linhas.push(["Diferença", `${fmt(totalDiferenca, 0)} kg`]);
  linhas.push(["Peso Médio", `${pesoMedio.toFixed(3)} kg/unid`]);

  const escala = 3; // resolução mais alta — sem isso a imagem sai borrada ao ampliar/dar zoom
  const larguraBase = 320, alturaLinhaBase = 28, alturaTituloBase = 40;
  const alturaBase = alturaTituloBase + alturaLinhaBase * linhas.length;

  const canvas = document.createElement("canvas");
  canvas.width = larguraBase * escala;
  canvas.height = alturaBase * escala;
  const ctx = canvas.getContext("2d");
  ctx.scale(escala, escala);
  ctx.textBaseline = "middle";

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, larguraBase, alturaBase);

  ctx.fillStyle = "#065f46";
  ctx.fillRect(0, 0, larguraBase, alturaTituloBase);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 15px Arial";
  ctx.textAlign = "center";
  ctx.fillText(`🌴 Carga Nº ${carga.numero}`, larguraBase / 2, alturaTituloBase / 2 - 8);
  ctx.font = "11.5px Arial";
  ctx.fillText(brDate(carga.data), larguraBase / 2, alturaTituloBase / 2 + 10);

  let y = alturaTituloBase;
  linhas.forEach(([label, valor], i) => {
    const destaque = label === "Peso Médio";
    ctx.fillStyle = destaque ? "#dcfce7" : (i % 2 === 0 ? "#f3f4f6" : "#ffffff");
    ctx.fillRect(0, y, larguraBase, alturaLinhaBase);
    ctx.fillStyle = "#111827";
    ctx.font = "bold 12.5px Arial";
    ctx.textAlign = "left";
    ctx.fillText(label, 12, y + alturaLinhaBase / 2);
    ctx.font = destaque ? "bold 12.5px Arial" : "12.5px Arial";
    ctx.fillStyle = destaque ? "#166534" : "#111827";
    ctx.textAlign = "right";
    ctx.fillText(valor, larguraBase - 12, y + alturaLinhaBase / 2);
    y += alturaLinhaBase;
  });

  ctx.strokeStyle = "#9ca3af";
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, larguraBase - 1, alturaBase - 1);
  y = alturaTituloBase;
  linhas.forEach(() => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(larguraBase, y); ctx.stroke(); y += alturaLinhaBase; });

  const blobResumo = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  if (!blobResumo) { alert("Não consegui gerar a imagem. Tenta de novo."); return; }
  const nomeResumo = `carga-${carga.numero}-resumo.png`;
  const arquivoResumo = new File([blobResumo], nomeResumo, { type: "image/png" });

  // Junta as fotos que já foram tiradas dessa carga, pra ir tudo junto no mesmo compartilhamento
  const fotos = fotosDaCarga(cargaId);
  let arquivosFotos = [];
  if (fotos.length > 0) {
    try {
      const blobs = await Promise.all(fotos.map((f) => fetch(f.url).then((r) => r.blob())));
      arquivosFotos = blobs.map((b, i) => new File([b], `carga-${carga.numero}-foto-${i + 1}.jpg`, { type: b.type || "image/jpeg" }));
    } catch (e) {
      console.warn("Não consegui baixar as fotos da carga pra juntar no compartilhamento:", e);
    }
  }

  const todosArquivos = [arquivoResumo, ...arquivosFotos];

  async function tentarCompartilhar(arquivos) {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: arquivos })) {
      try {
        await navigator.share({ files: arquivos, title: `Carga ${carga.numero}` });
        return true;
      } catch (e) {
        if (e.name === "AbortError") return true; // cancelou, não insiste no fallback
        console.warn("Falha ao compartilhar:", e);
        return false;
      }
    }
    return false;
  }

  // Tenta com tudo junto (resumo + fotos); se o celular recusar (ex: muita coisa de uma vez),
  // tenta só o resumo; se nem isso der, baixa o resumo direto.
  if (await tentarCompartilhar(todosArquivos)) return;
  if (arquivosFotos.length > 0 && (await tentarCompartilhar([arquivoResumo]))) return;

  const url = URL.createObjectURL(blobResumo);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeResumo;
  a.click();
  URL.revokeObjectURL(url);
};

window.compartilharCargaVerdeWhatsapp = async function (cargaId) {
  const carga = S.cargasVerde.find((c) => c.id === cargaId);
  if (!carga) return;

  const amostras = carga.amostrasAgua || [];
  const mediaAgua = amostras.length ? amostras.reduce((s, v) => s + v, 0) / amostras.length : null;

  const texto = `🥥 *Carga Verde Nº ${carga.numero}* — ${brDate(carga.data)}\n` +
    (carga.encarregado ? `Encarregado: ${carga.encarregado}\n` : "") +
    (carga.motorista ? `Motorista: ${carga.motorista}${carga.telefoneMotorista ? " (" + carga.telefoneMotorista + ")" : ""}\n` : "") +
    (carga.placa ? `Placa: ${carga.placa}\n` : "") +
    (carga.destino ? `Destino: ${carga.destino}\n` : "") +
    (carga.horarioSaida ? `Saída: ${carga.horarioSaida}\n` : "") +
    (carga.nfCte ? `NF/CT-e: ${carga.nfCte}\n` : "") +
    (mediaAgua !== null ? `Água (amostra): ${fmt(mediaAgua,1)} ml\n` : "") +
    `Quantidade: ${fmt(Number(carga.quantidadeTotal) || 0, 0)} frutos`;

  const fotos = fotosDaCarga(cargaId);
  let arquivos = [];
  if (fotos.length > 0 && navigator.canShare) {
    try {
      const blobs = await Promise.all(fotos.map((f) => fetch(f.url).then((r) => r.blob())));
      arquivos = blobs.map((b, i) => new File([b], `carga-verde-${carga.numero}-${i + 1}.jpg`, { type: b.type || "image/jpeg" }));
      if (!navigator.canShare({ files: arquivos })) arquivos = [];
    } catch (e) {
      console.warn("Não consegui baixar as fotos pra compartilhar, mandando só o texto:", e);
      arquivos = [];
    }
  }

  if (navigator.share) {
    try {
      await navigator.share(arquivos.length > 0
        ? { title: `Carga Verde ${carga.numero}`, text: texto, files: arquivos }
        : { title: `Carga Verde ${carga.numero}`, text: texto });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
      console.warn("Falha ao abrir o compartilhamento nativo, caindo pro link do WhatsApp:", e);
    }
  }

  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, "_blank");
};

function renderRomaneio() {

      <label class="field" style="grid-column:span 2;"><span>Encarregado</span><input type="text" value="${esc(c.encarregado)}" oninput="S._novaCarga.encarregado=this.value"/></label>

  const arquivadas = S.cargas.filter((c) => c.status === "arquivada");

  if (abertas.length === 0 && arquivadas.length === 0) {
    html += `<div class="empty">Nenhuma carga registrada ainda. Crie uma acima.</div>`;
  }

  abertas.forEach((carga) => {
    const linhasCalc = bagsDaCarga(carga.id).map((l) => ({ ...l, ...calcLinhaRomaneio(l) }));
    const totalEstocado = linhasCalc.reduce((s, l) => s + l.estocado1, 0);
    const totalCarregado = linhasCalc.reduce((s, l) => s + l.carregado1, 0);
    html += renderCargaCard(carga, linhasCalc, totalEstocado, totalCarregado, totalCarregado - totalEstocado);
  });

  if (arquivadas.length > 0) {
    html += `<button class="btn ghost" style="margin:6px 0;" onclick="toggleVerArquivadas()">
      ${S._verArquivadas ? "▾" : "▸"} Cargas arquivadas (${arquivadas.length})
    </button>`;
    if (S._verArquivadas) {
      arquivadas.forEach((carga) => {
        const linhasCalc = bagsDaCarga(carga.id).map((l) => ({ ...l, ...calcLinhaRomaneio(l) }));
        const totalEstocado = linhasCalc.reduce((s, l) => s + l.estocado1, 0);
        const totalCarregado = linhasCalc.reduce((s, l) => s + l.carregado1, 0);
        html += renderCargaCard(carga, linhasCalc, totalEstocado, totalCarregado, totalCarregado - totalEstocado);
      });
    }
  }

  document.getElementById("tabContent").innerHTML = html;
  setSaveStatus("romaneio", S.saveStatus.romaneio);
  setSaveStatus("descartes", S.saveStatus.descartes);
}

          <img src="${esc(f.url)}" loading="lazy" onclick="window.open('${esc(f.url)}','_blank')"/>

          <button class="foto-del" onclick="removerFotoCarga('${f.id}','${esc(f.fileId || "")}')">✕</button>
        </div>`;
      });
      for (let i = 0; i < enviando; i++) html += `<div class="foto-item foto-uploading">⏳<br/>enviando…</div>`;
      html += `</div>`;
    } else {
      html += `<div class="muted" style="font-size:11.5px; margin-bottom:10px;">Nenhuma foto ainda.</div>`;
    }

    html += `<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px; flex-wrap:wrap;">`;
    html += `<button class="btn ghost" style="width:auto; color:#128C7E; border:1px solid #128C7E;" onclick="compartilharCargaVerdeWhatsapp('${carga.id}')">📲 Compartilhar</button>`;
    if (!arquivada) {
      html += `<button class="btn danger" onclick="removeCargaVerde('${carga.id}')">🗑️ Excluir carga</button>`;
      html += `<button class="btn" style="width:auto; background:#0f766e;" onclick="arquivarCargaVerde('${carga.id}')">📦 Finalizar e arquivar carga</button>`;
    } else {
      html += `<button class="btn ghost" style="width:auto;" onclick="reabrirCargaVerde('${carga.id}')">↩️ Reabrir carga</button>`;
    }
    html += `</div></div>`;
  }

  return html;
}

/* =========================================================================
   DESCARTES — vive dentro de cada carga agora, ligado direto pelo ID dela
   (não precisa mais digitar o número de romaneio pra "achar" o descarte
   certo — é a mesma carga, então nasce vinculado automaticamente).
   ========================================================================= */
function descarteDaCarga(carga) {
  // Registros novos ficam ligados por cargaId. Registros antigos (de antes dessa mudança)
  // só tinham o número digitado à mão — continuam aparecendo certinho pelo número batendo.
  return S.registrosDescarte.find((r) => r.cargaId === carga.id)
    || S.registrosDescarte.find((r) => !r.cargaId && String(r.numeroRomaneio) === String(carga.numero));
}

function descarteVazioPara(carga) {
  const cats = {};
  CATS_DESCARTES.forEach((c) => (cats[c.key] = { kg: "", unid: "" }));
  return { cargaId: carga.id, numeroRomaneio: carga.numero, data: carga.data || todayISO(), descartesUnid: "", cats };
}

        <tr>
          <td style="text-align:left; font-weight:600;">Descartes</td>

        </tr>`;
    CATS_DESCARTES.forEach((cat) => {
      const naoEDescarte = cat.key === "g400_500" || cat.key === "acima500";
      html += `<tr>
          <td style="text-align:left; font-weight:600;">${cat.label} ${naoEDescarte ? `<span class="muted" style="font-weight:400; font-size:10px;">(não é descarte)</span>` : ""}</td>
          <td>${fmt(Number(existente.cats[cat.key].kg)||0,0)}</td>
          <td>${fmt(Number(existente.cats[cat.key].unid)||0,0)}</td>
          <td>${fmtPct(c.pctKg[cat.key])}</td>
          <td>${fmtPct(c.pctUnid[cat.key])}</td>
        </tr>`;
    });
    html += `<tr style="font-weight:700; background:#fafaf9;">
          <td style="text-align:left;">Total processado</td>
          <td>${fmt(c.totalKg,0)}</td><td>${fmt(c.totalUnid,0)}</td><td>100%</td><td>100%</td>
        </tr>
      </tbody></table></div>
      <div style="background:#FFC7CE; color:#9c0006; border-radius:8px; padding:8px 10px; margin-top:10px; font-weight:700; font-size:13px;">
        🗑️ Descarte real: ${fmt(c.totalKgDescarteReal,0)} kg <span style="font-weight:400; font-size:11px;">(só Brotos + Refugos + 350-400g — 400-500g e Acima 500g são coco bom, só separado por tamanho)</span>
      </div>
      <div class="grid grid-4" style="margin-top:10px;">
        <div class="stat-box ico"><div class="stat-ic">🌱</div><div><div class="lbl">Broto %</div><div class="val">${fmtPct(c.brotoPct)}</div></div></div>
        <div class="stat-box ico vermelho"><div class="stat-ic vermelho">📉</div><div><div class="lbl">Perda até 350g</div><div class="val" style="color:#dc2626;">${fmtPct(c.perda350)}</div></div></div>
        <div class="stat-box ico green"><div class="stat-ic">✅</div><div><div class="lbl">Aproveit. até 350g</div><div class="val">${fmtPct(c.aprov350)}</div></div></div>
        <div class="stat-box ico vermelho"><div class="stat-ic vermelho">📉</div><div><div class="lbl">Perda até 400g</div><div class="val" style="color:#dc2626;">${fmtPct(c.perda400)}</div></div></div>
        <div class="stat-box ico green" style="grid-column:span 3;"><div class="stat-ic">✅</div><div><div class="lbl">Aproveit. até 400g</div><div class="val">${fmtPct(c.aprov400)}</div></div></div>
      </div>
    </div>`;
    return html;
  }

  // Sem registro ainda pra essa carga — mostra o formulário, já com data e carga vinculados,
  // sem precisar digitar número nenhum.
  if (!S._formDescarte || S._formDescarte.cargaId !== carga.id) S._formDescarte = descarteVazioPara(carga);
  const f = S._formDescarte;

  html += `<div class="card" style="padding:10px;">
    <div class="row-flex" style="margin-bottom:10px;">
      <span class="muted" style="font-size:12px;">Nenhum descarte lançado pra essa carga ainda.</span>
      <span id="savingPill-descartes" class="saving-pill"></span>

    <div class="grid grid-2" style="margin-bottom:10px;">
      <label class="field"><span>Data</span><input type="date" value="${esc(f.data)}" oninput="S._formDescarte.data=this.value"/></label>
