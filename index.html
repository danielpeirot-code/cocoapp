function renderProgramacaoPorColaborador(itensSemana) {
  // Monta a grade "quem faz o quê cada dia" a partir do que já foi programado —
  // não precisa digitar de novo: usa o campo "Quem vai fazer" + os dias com quantidade programada.
  const colaboradores = new Set();
  itensSemana.forEach((item) => {
    (item.quemVaiFazer || "").split(",").map((n) => n.trim()).filter(Boolean).forEach((n) => colaboradores.add(n));
  });
  const nomes = Array.from(colaboradores).sort((a, b) => a.localeCompare(b, "pt-BR"));

  let html = `<div class="card">
    <h3 style="margin-bottom:10px;">👤 Quem faz o quê essa semana</h3>`;

  if (nomes.length === 0) {
    html += `<div class="empty">Nenhum colaborador informado ainda. Preenche o campo "Quem vai fazer" nas atividades da aba "Por atividade".</div></div>`;
    return html;
  }

  html += `<div class="tbl-wrap"><table class="tbl" style="min-width:640px;">
    <thead><tr><th style="text-align:left;">Colaborador</th>${DIAS_SEMANA.map(d=>`<th>${d.label}</th>`).join("")}</tr></thead>
    <tbody>`;

  nomes.forEach((nome) => {
    html += `<tr><td style="text-align:left; font-weight:700; white-space:nowrap;">${esc(nome)}</td>`;
    DIAS_SEMANA.forEach((d) => {
      const tarefas = itensSemana.filter((item) => {
        const temPessoa = (item.quemVaiFazer || "").split(",").map((n) => n.trim()).includes(nome);
        const temDia = item.prog && item.prog[d.key] !== undefined && item.prog[d.key] !== "" && Number(item.prog[d.key]) !== 0;
        return temPessoa && temDia;
      });
      if (tarefas.length === 0) {
        html += `<td style="color:#d6d3d1;">—</td>`;
      } else {
        html += `<td style="text-align:left; font-size:11.5px; line-height:1.3;">${tarefas.map((t) => { const c = corAtividade(t.atividade); return `<div style="background:${c.bg}; color:${c.fg}; border-radius:5px; padding:2px 5px; margin-bottom:3px; display:inline-block;"><b>${esc(t.setor)}</b> ${esc(t.atividade)}</div>`; }).join("")}</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>
    <div class="muted" style="font-size:11px; margin-top:8px;">Essa tabela é montada sozinha a partir das atividades cadastradas em "Por atividade" — mostra o dia se tiver quantidade programada naquele dia e o nome da pessoa estiver em "Quem vai fazer".</div>
  </div>`;
  return html;
}

window.toggleProg = function (id) {
  S._progAberta = S._progAberta === id ? null : id;
  renderProgramacao();
};
function pessoasDoItem(item) {
  return (item.quemVaiFazer || "").split(",").map((n) => n.trim()).filter(Boolean);
}

// Verifica se alguma das "pessoas" já está em OUTRA atividade nesse dia (mesma semana).
// "ignorarId" exclui a própria atividade da checagem (usado ao editar uma já existente).
function conflitosDeAgenda(pessoas, diaKey, itensDaSemana, ignorarId) {
  const conflitos = [];
  itensDaSemana.forEach((it) => {
    if (it.id === ignorarId) return;
    if (!it.prog || !it.prog[diaKey] || Number(it.prog[diaKey]) === 0) return;
    pessoasDoItem(it).forEach((nome) => {
      if (pessoas.includes(nome)) conflitos.push({ nome, atividade: it.atividade, setor: it.setor });
    });
  });
  return conflitos;
}

window.criarProgramacao = function () {
  if (!S._novaProg.atividade) { alert("Preenche o nome da atividade."); return; }

  const pessoas = pessoasDoItem(S._novaProg);
  const itensDaSemana = S.programacao.filter((p) => p.semana === S._novaProg.semana);
  let todosConflitos = [];
  DIAS_SEMANA.forEach((d) => {
    if (S._novaProg.prog[d.key] && Number(S._novaProg.prog[d.key]) !== 0) {
      conflitosDeAgenda(pessoas, d.key, itensDaSemana, null).forEach((c) => todosConflitos.push({ dia: d.label, ...c }));
    }
  });
  if (todosConflitos.length > 0) {
    const msg = todosConflitos.map((c) => `• ${c.nome} já está em "${c.atividade}" (${c.setor}) na ${c.dia}`).join("\n");
    alert("Não dá pra programar — conflito de agenda:\n\n" + msg);
    return;
  }

  const payload = { ...S._novaProg };
  setSaveStatus("programacao", "saving");
  addDoc(collection(db, "programacao"), payload)
    .then(() => { if (navigator.onLine) setSaveStatus("programacao", "saved"); })
    .catch((e) => { console.error(e); setSaveStatus("programacao", "offline"); });
  S._novaProg = progVazia();
  renderProgramacao();
};
window.removerProgramacao = function (id) {
  pedirSenha(() => {
    S._progAberta = null;
    deleteDoc(doc(db, "programacao", id)).catch((e) => tratarErroSalvamento("programacao", e));
  });
};
window.duplicarProgramacao = function (id) {
  const item = S.programacao.find((p) => p.id === id);
  if (!item) return;
  const execZerado = {};
  DIAS_SEMANA.forEach((d) => { execZerado[d.key] = ""; });
  S._novaProg = {
    ...item,
    prog: { ...item.prog },   // mantém os mesmos dias/quantidades programadas
    exec: execZerado,          // executado começa zerado (é uma atividade nova, ainda não feita)
    semana: S._progSemana,     // usa a semana que está selecionada na tela
  };
  delete S._novaProg.id;
  S._progAberta = null;
  if (typeof window.scrollTo === "function") window.scrollTo(0, 0);
  renderProgramacao();
};

// Copia TODAS as atividades da semana atual pra próxima semana de uma vez — pra quem repete
// muita coisa igual semana após semana (mesmo setor, mesma equipe), sem ter que duplicar
// atividade por atividade. O executado sempre começa zerado, é uma semana nova.
window.duplicarSemanaInteira = function () {
  const itens = S.programacao.filter((p) => p.semana === S._progSemana);
  if (itens.length === 0) return;
  const proximaSemana = new Date(S._progSemana + "T00:00:00");
  proximaSemana.setDate(proximaSemana.getDate() + 7);
  const proximaSemanaISO = proximaSemana.toISOString().slice(0, 10);

  if (!confirm(`Copiar ${itens.length} atividade${itens.length>1?"s":""} dessa semana pra semana de ${brDate(proximaSemanaISO)}? O executado começa zerado, é uma semana nova.`)) return;

  const execZerado = {};
  DIAS_SEMANA.forEach((d) => { execZerado[d.key] = ""; });

  marcarSalvando("programacao");
  itens.forEach((item) => {
    const { id, ...resto } = item;
    addDoc(collection(db, "programacao"), { ...resto, prog: { ...item.prog }, exec: execZerado, semana: proximaSemanaISO })
      .catch((e) => tratarErroSalvamento("programacao", e));
  });
  if (navigator.onLine) setSaveStatus("programacao", "saved");

  S._progSemana = proximaSemanaISO;
  renderProgramacao();
};

// Compartilhamento no WhatsApp — usa compartilhamento nativo do celular quando dá (com o
// WhatsApp aparecendo como uma das opções); no computador, cai pro link do WhatsApp Web.
async function compartilharTextoWhatsapp(titulo, texto) {
  if (navigator.share) {
    try { await navigator.share({ title: titulo, text: texto }); return; }
    catch (e) { if (e.name === "AbortError") return; console.warn("Falha no compartilhamento nativo, caindo pro link:", e); }
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, "_blank");
}

window.compartilharProgramacaoAtividadesWhatsapp = function () {
  const itens = S.programacao.filter((p) => p.semana === S._progSemana);
  if (itens.length === 0) return;
  const semanaFim = new Date(S._progSemana + "T00:00:00");
  semanaFim.setDate(semanaFim.getDate() + 6);

  let texto = `🗓️ *Programação — Semana ${numeroDaSemana(S._progSemana)}*\n${brDate(S._progSemana)} até ${brDate(semanaFim.toISOString().slice(0,10))}\n\n`;
  itens.forEach((item) => {
    texto += `🔸 *${item.atividade || "(sem nome)"}* — ${item.setor}\n`;
    if (item.quemVaiFazer) texto += `👤 ${item.quemVaiFazer}\n`;
    if (item.planejadoQtd) texto += `Planejado: ${item.planejadoQtd} ${item.planejadoUni || ""}${item.diasNec ? ` × ${item.diasNec} dias` : ""}\n`;
    texto += `\n`;
  });

  compartilharTextoWhatsapp(`Programação Semana ${numeroDaSemana(S._progSemana)}`, texto.trim());
};

window.compartilharProgramacaoColaboradorWhatsapp = function () {
  const itens = S.programacao.filter((p) => p.semana === S._progSemana);
  if (itens.length === 0) return;
  const colaboradoresSet = new Set();
  itens.forEach((item) => {
    (item.quemVaiFazer || "").split(",").map((n) => n.trim()).filter(Boolean).forEach((n) => colaboradoresSet.add(n));
  });
  const nomes = Array.from(colaboradoresSet).sort((a, b) => a.localeCompare(b, "pt-BR"));
  if (nomes.length === 0) { alert("Ninguém informado em \"Quem vai fazer\" ainda essa semana."); return; }

  const semanaFim = new Date(S._progSemana + "T00:00:00");
  semanaFim.setDate(semanaFim.getDate() + 6);

  let texto = `🗓️ *Quem faz o quê — Semana ${numeroDaSemana(S._progSemana)}*\n${brDate(S._progSemana)} até ${brDate(semanaFim.toISOString().slice(0,10))}\n\n`;

  nomes.forEach((nome) => {
    // Resumo de cada dia (junta com "+" se a pessoa tiver mais de uma tarefa no mesmo dia)
    const porDia = DIAS_SEMANA.map((d) => {
      const tarefas = itens.filter((item) => {
        const temPessoa = (item.quemVaiFazer || "").split(",").map((n) => n.trim()).includes(nome);
        const temDia = item.prog && item.prog[d.key] !== undefined && item.prog[d.key] !== "" && Number(item.prog[d.key]) !== 0;
        return temPessoa && temDia;
      });
      return tarefas.length > 0 ? tarefas.map((t) => t.atividade).join(" + ") : null;
    });

    // Agrupa dias seguidos com a MESMA tarefa numa faixa só (ex: "Ter-Sáb: Descascamento"),
    // igual as células coloridas emendadas na sua planilha — bem mais compacto que uma linha por dia.
    const linhas = [];
    let i = 0;
    while (i < DIAS_SEMANA.length) {
      if (!porDia[i]) { i++; continue; }
      let j = i;
      while (j + 1 < DIAS_SEMANA.length && porDia[j + 1] === porDia[i]) j++;
      const faixa = i === j ? DIAS_SEMANA[i].label : `${DIAS_SEMANA[i].label}-${DIAS_SEMANA[j].label}`;
      linhas.push(`${faixa}: ${porDia[i]}`);
      i = j + 1;
    }

    if (linhas.length > 0) texto += `👤 *${nome}*\n${linhas.join("\n")}\n\n`;
  });

  compartilharTextoWhatsapp(`Quem faz o quê — Semana ${numeroDaSemana(S._progSemana)}`, texto.trim());
};

// Desenha a tabela "quem faz o quê" como uma imagem de verdade (tipo a planilha) — mais fácil
// de bater o olho que texto corrido, principalmente com bastante gente na equipe.
// Quebra texto em várias linhas pra caber numa largura máxima, centralizado verticalmente
// em torno de yCentro — usado nos nomes longos de atividade/implemento na imagem do cronograma.
function desenharTextoComQuebra(ctx, texto, x, yCentro, maxWidth, lineHeight, alinhamento) {
  ctx.textAlign = alinhamento || "left";
  const palavras = String(texto || "").split(" ");
  const linhas = [];
  let linhaAtual = "";
  palavras.forEach((p) => {
    const teste = linhaAtual ? linhaAtual + " " + p : p;
    if (ctx.measureText(teste).width > maxWidth && linhaAtual) {
      linhas.push(linhaAtual);
      linhaAtual = p;
    } else {
      linhaAtual = teste;
    }
  });
  if (linhaAtual) linhas.push(linhaAtual);
  const inicioY = yCentro - ((linhas.length - 1) * lineHeight) / 2;
  linhas.forEach((linha, i) => ctx.fillText(linha, x, inicioY + i * lineHeight));
}

// Gera o "cronograma" por atividade como imagem — igual a planilha que vocês já usam: uma
// atividade pode ocupar várias linhas (uma por setor), com os dias programados em destaque,
// veículo/implemento e os produtos usados. Os dados já existem no cadastro, só reorganiza pra imagem.
window.gerarImagemProgramacaoAtividades = function () {
  const itens = S.programacao.filter((p) => p.semana === S._progSemana);
  if (itens.length === 0) return;

  // Agrupa por nome da atividade, mantendo a ordem em que já aparecem
  const grupos = [];
  const indicePorAtividade = {};
  itens.forEach((item) => {
    const chave = item.atividade || "(sem nome)";
    if (!(chave in indicePorAtividade)) {
      indicePorAtividade[chave] = grupos.length;
      grupos.push({ atividade: chave, itens: [] });
    }
    grupos[indicePorAtividade[chave]].itens.push(item);
  });

  const L = { ativ: 200, area: 50, setor: 46, dia: 42, trator: 58, impl: 90, tipo: 44, quant: 52, uni: 34 };
  const numDias = DIAS_SEMANA.length;
  const largura = L.ativ + L.area + L.setor + L.dia * numDias + L.trator + L.impl + L.tipo + L.quant + L.uni;
  const alturaTitulo = 34, alturaCab1 = 24, alturaCab2 = 24, alturaLinha = 28;
  const totalLinhas = itens.length;
  const altura = alturaTitulo + alturaCab1 + alturaCab2 + alturaLinha * totalLinhas;

  const canvas = document.createElement("canvas");
  canvas.width = largura;
  canvas.height = altura;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, largura, altura);
  ctx.textBaseline = "middle";

  // Título
  ctx.fillStyle = "#c0622a";
  ctx.fillRect(0, 0, largura, alturaTitulo);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 16px Arial";
  ctx.textAlign = "center";
  ctx.fillText(`CRONOGRAMA — SEMANA ${numeroDaSemana(S._progSemana)}`, largura / 2, alturaTitulo / 2);

  let y = alturaTitulo;

  // Cabeçalho nível 1 (grupos de coluna)
  let x = 0;
  [
    { label: "Atividades", w: L.ativ + L.area + L.setor, cor: "#c8e0c3" },
    { label: "Programado", w: L.dia * numDias, cor: "#ffef62" },
    { label: "Veículos e Implementos", w: L.trator + L.impl, cor: "#e5e7eb" },
    { label: "Produtos", w: L.tipo + L.quant + L.uni, cor: "#e5e7eb" },
  ].forEach((g) => {
    ctx.fillStyle = g.cor;
    ctx.fillRect(x, y, g.w, alturaCab1);
    ctx.strokeStyle = "#999"; ctx.strokeRect(x, y, g.w, alturaCab1);
    ctx.fillStyle = "#1f2937";
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";
    ctx.fillText(g.label, x + g.w / 2, y + alturaCab1 / 2);
    x += g.w;
  });
  y += alturaCab1;

  // Cabeçalho nível 2 (colunas individuais)
  x = 0;
  ctx.font = "bold 9.5px Arial";
  [
    { label: "Atividades", w: L.ativ, cor: "#dcecd9" }, { label: "Área", w: L.area, cor: "#dcecd9" }, { label: "Setor", w: L.setor, cor: "#dcecd9" },
    ...DIAS_SEMANA.map((d) => ({ label: d.label, w: L.dia, cor: "#ffef62" })),
    { label: "Trator", w: L.trator, cor: "#f3f4f6" }, { label: "Implem.", w: L.impl, cor: "#f3f4f6" },
    { label: "Tipo", w: L.tipo, cor: "#f3f4f6" }, { label: "Quant.", w: L.quant, cor: "#f3f4f6" }, { label: "Uni.", w: L.uni, cor: "#f3f4f6" },
  ].forEach((c) => {
    ctx.fillStyle = c.cor;
    ctx.fillRect(x, y, c.w, alturaCab2);
    ctx.strokeStyle = "#999"; ctx.strokeRect(x, y, c.w, alturaCab2);
    ctx.fillStyle = "#1f2937";
    ctx.textAlign = "center";
    ctx.fillText(c.label, x + c.w / 2, y + alturaCab2 / 2);
    x += c.w;
  });
  y += alturaCab2;

  // Corpo — agrupado por atividade. As colunas Atividade/Área/Trator/Implemento mostram o texto
  // uma vez só, centralizado no meio do grupo (efeito de célula mesclada do Excel). O fundo
  // dessas colunas é pintado de uma vez só, ANTES de escrever o texto — se pintasse de novo a
  // cada linha (como estava antes), a repintura da 2ª linha em diante apagava metade do texto
  // que tinha "vazado" pra baixo da 1ª linha. Foi esse o bug que cortava as informações.
  grupos.forEach((grupo, gi) => {
    const inicioGrupoY = y;
    const numLinhasGrupo = grupo.itens.length;
    const alturaGrupo = numLinhasGrupo * alturaLinha;
    const corFundo = gi % 2 === 0 ? "#ffffff" : "#f7f7f7";
    const centroGrupoY = inicioGrupoY + alturaGrupo / 2;
    const primeiroItem = grupo.itens[0];

    // 1) Fundo das colunas mescladas (Atividades+Área, e Trator+Implementos), pintado uma vez só
    ctx.fillStyle = corFundo;
    ctx.fillRect(0, inicioGrupoY, L.ativ + L.area, alturaGrupo);
    ctx.fillRect(L.ativ + L.area + L.setor + L.dia * numDias, inicioGrupoY, L.trator + L.impl, alturaGrupo);

    // 2) Texto mesclado, uma vez só, centralizado na altura do grupo inteiro
    ctx.fillStyle = "#111827";
    ctx.font = "bold 9.5px Arial";
    desenharTextoComQuebra(ctx, grupo.atividade, 5, centroGrupoY, L.ativ - 10, 11, "left");
    ctx.textAlign = "center";
    ctx.font = "10px Arial";
    ctx.fillText(primeiroItem.area || "", L.ativ + L.area / 2, centroGrupoY);
    ctx.font = "9.5px Arial";
    const xTrator = L.ativ + L.area + L.setor + L.dia * numDias;
    ctx.fillText(primeiroItem.veiculo || "-", xTrator + L.trator / 2, centroGrupoY);
    desenharTextoComQuebra(ctx, primeiroItem.implemento || "-", xTrator + L.trator + L.impl / 2, centroGrupoY, L.impl - 8, 11, "center");

    // 3) Agora desenha o que É por linha (Setor, dias programados, produtos) — sem tocar de
    // novo nas colunas mescladas de cima
    let yLinha = inicioGrupoY;
    grupo.itens.forEach((item) => {
      let cx = L.ativ + L.area;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx, yLinha, L.setor, alturaLinha);
      ctx.fillStyle = "#111827"; ctx.font = "10px Arial"; ctx.textAlign = "center";
      ctx.fillText(item.setor || "", cx + L.setor / 2, yLinha + alturaLinha / 2);
      cx += L.setor;

      DIAS_SEMANA.forEach((d) => {
        const valor = item.prog && item.prog[d.key];
        const temValor = valor !== undefined && valor !== "" && Number(valor) !== 0;
        ctx.fillStyle = temValor ? "#ffef62" : "#ffffff";
        ctx.fillRect(cx, yLinha, L.dia, alturaLinha);
        ctx.strokeStyle = "#ddd"; ctx.strokeRect(cx, yLinha, L.dia, alturaLinha);
        if (temValor) {
          ctx.fillStyle = "#111827";
          ctx.textAlign = "center";
          ctx.fillText(String(valor), cx + L.dia / 2, yLinha + alturaLinha / 2);
        }
        cx += L.dia;
      });

      cx += L.trator + L.impl; // já pintado/escrito acima (mesclado) — só pula essa faixa

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx, yLinha, L.tipo + L.quant + L.uni, alturaLinha);
      ctx.fillStyle = "#111827";
      ctx.font = "9.5px Arial";
      ctx.textAlign = "center";
      ctx.fillText(item.produtoTipo || "-", cx + L.tipo / 2, yLinha + alturaLinha / 2);
      ctx.fillText(item.produtoQtd || "-", cx + L.tipo + L.quant / 2, yLinha + alturaLinha / 2);
      ctx.fillText(item.produtoUni || "-", cx + L.tipo + L.quant + L.uni / 2, yLinha + alturaLinha / 2);

      yLinha += alturaLinha;
    });

    // 4) Linhas de grade finas separando cada setor dentro do grupo (só nas colunas por linha)
    ctx.strokeStyle = "#eee";
    for (let k = 1; k < numLinhasGrupo; k++) {
      const yy = inicioGrupoY + k * alturaLinha;
      ctx.beginPath();
      ctx.moveTo(L.ativ + L.area, yy);
      ctx.lineTo(L.ativ + L.area + L.setor + L.dia * numDias, yy);
      ctx.stroke();
    }

    y += alturaGrupo;

    // Linha mais forte separando de outra atividade
    ctx.strokeStyle = "#9ca3af";
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(largura, y); ctx.stroke();
  });

  ctx.strokeStyle = "#555"; ctx.lineWidth = 1.5;
  ctx.strokeRect(0.5, 0.5, largura - 1, altura - 1);

  canvas.toBlob(async (blob) => {
    if (!blob) { alert("Não consegui gerar a imagem. Tenta de novo."); return; }
    const nomeArquivo = `cronograma-semana-${numeroDaSemana(S._progSemana)}.png`;
    const arquivo = new File([blob], nomeArquivo, { type: "image/png" });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      try {
        await navigator.share({ files: [arquivo], title: `Cronograma Semana ${numeroDaSemana(S._progSemana)}` });
        return;
      } catch (e) {
        if (e.name === "AbortError") return;
        console.warn("Falha ao compartilhar a imagem, baixando em vez disso:", e);
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    a.click();
    URL.revokeObjectURL(url);
  }, "image/png");
};

window.gerarImagemProgramacaoColaborador = async function () {
  const itens = S.programacao.filter((p) => p.semana === S._progSemana);
  if (itens.length === 0) return;
  const colaboradoresSet = new Set();
  itens.forEach((item) => {
    (item.quemVaiFazer || "").split(",").map((n) => n.trim()).filter(Boolean).forEach((n) => colaboradoresSet.add(n));
  });
  const nomes = Array.from(colaboradoresSet).sort((a, b) => a.localeCompare(b, "pt-BR"));
  if (nomes.length === 0) { alert("Ninguém informado em \"Quem vai fazer\" ainda essa semana."); return; }

  const semanaInicio = new Date(S._progSemana + "T00:00:00");
  const colNomeW = 130, colDiaW = 138, rowH = 46, headerH = 58;
  const largura = colNomeW + colDiaW * DIAS_SEMANA.length;
  const altura = headerH + rowH * nomes.length;

  const canvas = document.createElement("canvas");
  canvas.width = largura;
  canvas.height = altura;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, largura, altura);

  // Cabeçalho: canto vazio + um bloco por dia da semana, com a data debaixo do nome do dia
  ctx.fillStyle = "#1f2937";
  ctx.fillRect(0, 0, largura, headerH);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  DIAS_SEMANA.forEach((d, i) => {
    const x = colNomeW + i * colDiaW;
    const dataDia = new Date(semanaInicio);
    dataDia.setDate(dataDia.getDate() + i);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial";
    ctx.fillText(d.label.toUpperCase(), x + colDiaW / 2, headerH / 2 - 10);
    ctx.font = "12px Arial";
    ctx.fillStyle = "#d1d5db";
    ctx.fillText(dataDia.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }), x + colDiaW / 2, headerH / 2 + 12);
  });

  // Uma linha por colaborador, uma célula colorida por dia (mesma cor da atividade que já usamos
  // na tela "Por colaborador" — dias seguidos com a mesma tarefa acabam formando um bloco visual
  // igual na sua planilha, mesmo sem mesclar célula de verdade).
  nomes.forEach((nome, li) => {
    const y = headerH + li * rowH;
    ctx.fillStyle = li % 2 === 0 ? "#f3f4f6" : "#e5e7eb";
    ctx.fillRect(0, y, colNomeW, rowH);
    ctx.fillStyle = "#111827";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "left";
    ctx.fillText(nome.toUpperCase(), 10, y + rowH / 2, colNomeW - 16);

    DIAS_SEMANA.forEach((d, ci) => {
      const x = colNomeW + ci * colDiaW;
      const tarefas = itens.filter((item) => {
        const temPessoa = (item.quemVaiFazer || "").split(",").map((n) => n.trim()).includes(nome);
        const temDia = item.prog && item.prog[d.key] !== undefined && item.prog[d.key] !== "" && Number(item.prog[d.key]) !== 0;
        return temPessoa && temDia;
      });
      const cor = tarefas.length > 0 ? corAtividade(tarefas[0].atividade) : null;
      ctx.fillStyle = cor ? cor.bg : "#fafafa";
      ctx.fillRect(x, y, colDiaW, rowH);
      ctx.strokeStyle = "#d1d5db";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, colDiaW - 1, rowH - 1);
      if (tarefas.length > 0) {
        ctx.fillStyle = cor.fg;
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(tarefas.map((t) => t.atividade).join(" + "), x + colDiaW / 2, y + rowH / 2, colDiaW - 10);
      }
    });
  });

  ctx.strokeStyle = "#9ca3af";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0.5, 0.5, largura - 1, altura - 1);

  canvas.toBlob(async (blob) => {
    if (!blob) { alert("Não consegui gerar a imagem. Tenta de novo."); return; }
    const nomeArquivo = `programacao-semana-${numeroDaSemana(S._progSemana)}.png`;
    const arquivo = new File([blob], nomeArquivo, { type: "image/png" });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      try {
        await navigator.share({ files: [arquivo], title: `Programação Semana ${numeroDaSemana(S._progSemana)}` });
        return;
      } catch (e) {
        if (e.name === "AbortError") return;
        console.warn("Falha ao compartilhar a imagem, baixando em vez disso:", e);
      }
    }
    // Sem compartilhamento nativo disponível (ex: computador) — baixa a imagem direto.
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    a.click();
    URL.revokeObjectURL(url);
  }, "image/png");
};

/* =========================================================================
   RENDIMENTO POR ATIVIDADE
   Cadastro do rendimento padrão de cada atividade (unidade livre — ha/dia,
   plantas/dia, kg/dia, o que fizer sentido pra ela) e comparação com o que
   foi realmente executado, cruzando com o que já é lançado na Programação.
   ========================================================================= */
S._novaAtividadePadrao = { nome: "", unidade: "", rendimentoPadrao: "" };
S._editandoAtividadePadrao = null; // chave da atividade sendo editada, ou null = formulário novo

function calcRendimentoAtividade(nomeAtividade) {
  const nomeNormalizado = (nomeAtividade || "").trim().toLowerCase();
  let somaExec = 0, diasComExec = 0;

  S.programacao
    .filter((p) => (p.atividade || "").trim().toLowerCase() === nomeNormalizado)
    .forEach((p) => {
      DIAS_SEMANA.forEach((d) => {
        const exec = Number(p.exec[d.key]) || 0;
        if (exec > 0) { somaExec += exec; diasComExec++; }
      });
    });

  const mediaRealizada = diasComExec > 0 ? somaExec / diasComExec : null;
  return { mediaRealizada, diasComExec, somaExec };
}

window.editarAtividadePadrao = function (chave) {
  const item = S.atividadesPadrao[chave];
  if (!item) return;
  S._editandoAtividadePadrao = chave;
  S._novaAtividadePadrao = { ...item };
  renderRendimento();
};

window.cancelarEdicaoAtividadePadrao = function () {
  S._editandoAtividadePadrao = null;
  S._novaAtividadePadrao = { nome: "", unidade: "", rendimentoPadrao: "" };
  renderRendimento();
};

window.salvarAtividadePadrao = function () {
  if (!S._novaAtividadePadrao.nome) { alert("Digita o nome da atividade."); return; }
  const chave = S._novaAtividadePadrao.nome.trim().toLowerCase();
  marcarSalvando("rendimento");
  setDoc(doc(db, "atividadesPadrao", chave), { ...S._novaAtividadePadrao })
    .then(() => { if (navigator.onLine) setSaveStatus("rendimento", "saved"); })
    .catch((e) => tratarErroSalvamento("rendimento", e));
  S._editandoAtividadePadrao = null;
  S._novaAtividadePadrao = { nome: "", unidade: "", rendimentoPadrao: "" };
  renderRendimento();
};

// Importação em lote — cola várias linhas "nome; rendimento; unidade" de uma vez e cadastra
// todas juntas, em vez de preencher o formulário uma atividade por vez.
window.importarAtividadesPadrao = function () {
  const texto = document.getElementById("importarAtividadesTexto");
  const linhas = (texto ? texto.value : "").split("\n").map((l) => l.trim()).filter(Boolean);
  if (linhas.length === 0) { alert("Cola pelo menos uma linha no formato: nome; rendimento; unidade"); return; }

  let importadas = 0, comProblema = [];
  marcarSalvando("rendimento");
  linhas.forEach((linha) => {
    const partes = linha.split(";").map((p) => p.trim());
    const [nome, rendimentoPadrao, unidade] = partes;
    if (!nome) { comProblema.push(linha); return; }
    const chave = nome.toLowerCase();
    setDoc(doc(db, "atividadesPadrao", chave), { nome, rendimentoPadrao: rendimentoPadrao || "", unidade: unidade || "" })
      .catch((e) => tratarErroSalvamento("rendimento", e));
    importadas++;
  });
  if (navigator.onLine) setSaveStatus("rendimento", "saved");

  if (texto) texto.value = "";
  alert(`${importadas} atividade${importadas>1?"s":""} importada${importadas>1?"s":""}!${comProblema.length ? `\n\nLinhas ignoradas (sem nome): ${comProblema.length}` : ""}`);
  renderRendimento();
};

window.removerAtividadePadrao = function (chave) {
  pedirSenha(() => {
    marcarSalvando("rendimento");
    deleteDoc(doc(db, "atividadesPadrao", chave))
      .then(() => { if (navigator.onLine) setSaveStatus("rendimento", "saved"); })
      .catch((e) => tratarErroSalvamento("rendimento", e));
  });
};

function renderRendimento() {
  const f = S._novaAtividadePadrao;
  let html = `<div class="card" style="padding:10px 12px;">
    <div class="row-flex">
      <span class="muted" style="font-size:12px;">📐 Cadastre o rendimento esperado de cada atividade e compare com o que já foi executado na Programação.</span>
      <span id="savingPill-rendimento" class="saving-pill"></span>
    </div>
  </div>`;

  html += `<div class="card">
    <h3 style="margin-bottom:8px; font-size:13px;">${S._editandoAtividadePadrao ? "✏️ Editando padrão" : "➕ Novo padrão de atividade"}</h3>
    <div class="grid grid-2" style="margin-bottom:10px;">

      <label class="field"><span>Rendimento padrão</span><input type="number" value="${esc(f.rendimentoPadrao)}" oninput="S._novaAtividadePadrao.rendimentoPadrao=this.value"/></label>

let _progTimers = {};
window.atualizarProgDia = function (id, tipo, diaKey, valor) {
  const item = S.programacao.find((p) => p.id === id);
  if (!item) return;

  // Só checa conflito quando está mexendo no PROGRAMADO (é isso que "reserva" a pessoa naquele dia).
  if (tipo === "prog" && valor && Number(valor) !== 0) {
    const pessoas = pessoasDoItem(item);
    const itensDaSemana = S.programacao.filter((p) => p.semana === item.semana);
    const conflitos = conflitosDeAgenda(pessoas, diaKey, itensDaSemana, id);
    if (conflitos.length > 0) {
      const diaLabel = (DIAS_SEMANA.find((d) => d.key === diaKey) || {}).label || diaKey;
      const msg = conflitos.map((c) => `• ${c.nome} já está em "${c.atividade}" (${c.setor}) na ${diaLabel}`).join("\n");
      alert("Não dá pra programar — conflito de agenda:\n\n" + msg);
      renderProgramacao(); // desfaz visualmente, o valor não foi salvo
      return;
    }
  }

  item[tipo][diaKey] = valor; // atualização otimista local, evita perder o foco do campo
  const k = id + "-" + tipo + "-" + diaKey;
  clearTimeout(_progTimers[k]);
  setSaveStatus("programacao", navigator.onLine ? "saving" : "offline");
  _progTimers[k] = setTimeout(() => {
    updateDoc(doc(db, "programacao", id), { [tipo]: item[tipo] })
      .then(() => { if (navigator.onLine) setSaveStatus("programacao", "saved"); })
      .catch((e) => tratarErroSalvamento("programacao", e));
  }, 500);
};

// Baixas automáticas: toda linha da aba Aplicações/Adubações que tem produto do estoque + quantidade
// + data aplicada preenchidos vira um "consumo" desse insumo — sem precisar lançar de novo em Estoque.
function consumoAplicacoesDoInsumo(nome) {
  const lista = [];
  [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO].forEach(({ tipo }) => {
    TALHOES.forEach((setor) => {
      const reg = S.aplicacoesDados[chaveAplic(setor, tipo)];
      if (!reg) return;
      const qtd = Number(reg.quantidade) || 0;
      if (reg.produtoInsumo === nome && reg.dataAplicada && qtd > 0) {
        lista.push({ data: reg.dataAplicada, quantidade: qtd, setor, tipo });
      }
    });
  });
  return lista;
}

function estoqueAtual(nome) {
  const movsManuais = S.estoqueMovs
    .filter((m) => m.insumoNome === nome)
    .reduce((s, m) => s + (m.tipo === "entrada" ? (Number(m.quantidade) || 0) : -(Number(m.quantidade) || 0)), 0);
  const consumoAuto = consumoAplicacoesDoInsumo(nome).reduce((s, c) => s + c.quantidade, 0);
  return movsManuais - consumoAuto;
}

// Previsão de consumo: olha as saídas dos últimos 90 dias (ajustes manuais + baixas automáticas das
// aplicações/adubações) pra estimar o ritmo médio de uso e prever quando o estoque atual vai zerar.
function previsaoConsumo(nome) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const desde = new Date(hoje); desde.setDate(desde.getDate() - 90);
  const desdeISO = desde.toISOString().slice(0, 10);

  let totalSaidas = 0;
  let dataMaisAntiga = null;
  const registra = (data, qtd) => {
    totalSaidas += qtd;
    if (!dataMaisAntiga || data < dataMaisAntiga) dataMaisAntiga = data;
  };
  S.estoqueMovs
    .filter((m) => m.insumoNome === nome && m.tipo === "saida" && m.data >= desdeISO)
    .forEach((m) => registra(m.data, Number(m.quantidade) || 0));
  consumoAplicacoesDoInsumo(nome)
    .filter((c) => c.data >= desdeISO)
    .forEach((c) => registra(c.data, c.quantidade));

  if (totalSaidas <= 0 || !dataMaisAntiga) return null;

  const diasPeriodo = Math.max(1, Math.round((hoje - new Date(dataMaisAntiga + "T00:00:00")) / 86400000));
  const consumoDiario = totalSaidas / diasPeriodo;
  if (consumoDiario <= 0) return null;

  const atual = estoqueAtual(nome);
  const diasRestantes = Math.floor(atual / consumoDiario);
  const dataEsgota = new Date(hoje); dataEsgota.setDate(dataEsgota.getDate() + diasRestantes);
  return { consumoDiario, diasRestantes, dataEsgotaFmt: dataEsgota.toLocaleDateString("pt-BR") };
}

const _setorTimers = {};

// Antes o "histórico" seria uma aba própria, mas o app já tem várias abas — faz mais sentido
// mostrar direto aqui dentro da ficha do setor, cruzando o que já existe em Contagem, Aplicações/
// Adubações e Ocorrências (nada disso é digitado de novo, só é lido e agrupado por talhão).
function historicoDoSetor(talhao) {
  const contagens = S.contagemLinhas
    .filter((l) => l.setor === talhao)
    .sort((a, b) => (b.id || "").localeCompare(a.id || ""));

  const ocorrenciasSetor = S.ocorrencias
    .filter((o) => o.setor === talhao)
    .sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  const aplicacoesSetor = [];
  [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO].forEach(({ tipo }) => {
    const reg = S.aplicacoesDados[chaveAplic(talhao, tipo)];
    if (reg && (reg.dataAplicada || reg.produtoInsumo)) aplicacoesSetor.push({ tipo, ...reg });
  });
  aplicacoesSetor.sort((a, b) => (b.dataAplicada || "").localeCompare(a.dataAplicada || ""));

  const consumoPorProduto = {};
  aplicacoesSetor.forEach((a) => {
    const qtd = Number(a.quantidade) || 0;
    if (a.produtoInsumo && a.dataAplicada && qtd > 0) {
      consumoPorProduto[a.produtoInsumo] = (consumoPorProduto[a.produtoInsumo] || 0) + qtd;
    }
  });

  return { contagens, ocorrenciasSetor, aplicacoesSetor, consumoPorProduto };
}

/* =========================================================================
   ABA OCORRÊNCIAS
   Registro de incêndio, praga, doença, quebra de equipamento, etc. — com
   foto, setor, data, responsável, descrição e providência tomada. Vai servir
   de base pro Histórico por Setor mais pra frente.
   ========================================================================= */
window.criarOcorrencia = function () {
  const oc = S._novaOcorrencia;
  if (!oc.tipo || !oc.data) { alert("Escolhe pelo menos o tipo e a data da ocorrência."); return; }
  marcarSalvando("ocorrencias");
  addDoc(collection(db, "ocorrencias"), { ...oc, criadoEm: new Date().toISOString() })
    .then(() => { if (navigator.onLine) setSaveStatus("ocorrencias", "saved"); })
    .catch((e) => tratarErroSalvamento("ocorrencias", e));
  S._novaOcorrencia = { tipo: "Praga", setor: "", data: todayISO(), responsavel: "", descricao: "", providencia: "" };
  renderOcorrencias();
};

window.removerOcorrencia = function (id, fileId) {
  pedirSenha(() => {
    deleteDoc(doc(db, "ocorrencias", id)).catch((e) => console.error(e));
    if (fileId) {
      fetch(BACKUP_SHEETS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "excluirFoto", fileId }),
      }).catch((e) => console.warn("Não consegui apagar a foto no Drive:", e));
    }
  });
};

// Foto de ocorrência é mais simples que a de carga: uma só por registro, sem fila offline
// (ocorrência não costuma ser lançada em série rápida como fotos de carregamento). Se falhar,
// só avisa e a pessoa tenta de novo — o registro em si (texto) já está salvo de qualquer jeito.
window.selecionarFotoOcorrencia = function (ocorrenciaId) {
  S._ocorrenciaFotoEnviando = ocorrenciaId;
  const input = document.getElementById("inputFotoOcorrencia");
  if (input) input.click();
};

window.onFotoOcorrenciaSelecionada = async function (input) {
  const ocorrenciaId = S._ocorrenciaFotoEnviando;
  const file = (input.files || [])[0];
  input.value = "";
  if (!ocorrenciaId || !file) return;

  marcarSalvando("ocorrencias");
  renderOcorrencias();
  try {
    if (!navigator.onLine) throw new Error("sem-internet");
    const blob = await comprimirImagem(file);
    const base64 = await blobParaBase64(blob);
    const nomeArquivo = `${Date.now()}.jpg`;

    const res = await comTimeout(fetch(BACKUP_SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "uploadFoto", pasta: "ocorrencia_" + ocorrenciaId, base64, nomeArquivo, mimeType: "image/jpeg" }),
    }), 30000, "envio-demorou");
    const data = await res.json();
    if (!data || !data.ok) throw new Error((data && data.erro) || "falha desconhecida no envio");

    await updateDoc(doc(db, "ocorrencias", ocorrenciaId), { fotoUrl: data.url, fotoFileId: data.fileId });
  } catch (e) {
    console.error("Falha ao enviar foto da ocorrência:", e);
    alert(!navigator.onLine
      ? "Sem internet no momento — tenta anexar a foto de novo quando tiver sinal."
      : "Não consegui enviar essa foto agora. Tenta de novo em instantes.");
  } finally {
    S._ocorrenciaFotoEnviando = null;
    setSaveStatus("ocorrencias", "saved");
    renderOcorrencias();
  }
};

  const lista = S.ocorrencias.slice().sort((a, b) => (b.data || "").localeCompare(a.data || "") || (b.criadoEm||"").localeCompare(a.criadoEm||""));

  lista.forEach((o) => {
    const enviandoFoto = S._ocorrenciaFotoEnviando === o.id;
    html += `<div class="card acento vermelho" style="margin-bottom:10px;">
      <div class="row-flex" style="align-items:flex-start;">
        <div style="display:flex; gap:9px; align-items:flex-start;">
          <span class="stat-ic vermelho" style="width:32px; height:32px; font-size:15px; flex-shrink:0;">${iconesOcorrencia[o.tipo] || "⚠️"}</span>
          <div>
            <span class="status-pill vermelho">${esc(o.tipo)}</span>
            ${o.setor ? `<span class="muted" style="margin-left:6px;">📍 ${esc(o.setor)}</span>` : ""}
            <span class="muted" style="margin-left:6px;">${brDate(o.data)}</span>
            ${o.responsavel ? `<div class="muted" style="margin-top:2px;">Responsável: ${esc(o.responsavel)}</div>` : ""}
            ${o.descricao ? `<div style="margin-top:4px;">${esc(o.descricao)}</div>` : ""}
            ${o.providencia ? `<div class="muted" style="margin-top:4px;">✅ Providência: ${esc(o.providencia)}</div>` : ""}
          </div>
        </div>
        <button class="x-btn" onclick="removerOcorrencia('${o.id}','${esc(o.fotoFileId||"")}')">✕</button>

}

    return {
      "Talhão": talhao, "Área (ha)": info.area, "Variedade": info.variedade, "Nº de Plantas": info.numPlantas,
      "Idade (anos)": info.idade, "Irrigação": info.irrigacao, "Localização": info.localizacao, "Observações": info.observacoes,
    };
  });
}

function montarLinhasFotos() {
  return S.cargaFotos
    .slice()
    .sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""))
    .map((f) => {
      const carga = S.cargas.find((c) => c.id === f.cargaId);
      return {
        "Carga Nº": carga ? carga.numero : f.cargaId, "Tipo": f.tipo, "Data": (f.criadoEm || "").slice(0, 10),
        "Link da foto": f.url,
      };
    });
}

function montarLinhasOcorrencias() {
  return S.ocorrencias
    .slice()
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""))
    .map((o) => ({
      "Data": o.data, "Tipo": o.tipo, "Setor": o.setor || "Geral", "Responsável": o.responsavel,
      "Descrição": o.descricao, "Providência": o.providencia, "Link da foto": o.fotoUrl || "",
    }));
}

function montarLinhasRendimento() {
  return Object.keys(S.atividadesPadrao).sort((a, b) => a.localeCompare(b, "pt-BR")).map((chave) => {
    const item = S.atividadesPadrao[chave];
    const r = calcRendimentoAtividade(item.nome);
    return {
      "Atividade": item.nome, "Rendimento Padrão": item.rendimentoPadrao, "Unidade": item.unidade,
      "Média Realizada": r.mediaRealizada !== null ? Number(r.mediaRealizada.toFixed(2)) : "",
      "Dias com Execução": r.diasComExec,
    };
  });
}

function montarLinhasColheita() {
  const mapaUltimas = construirMapaUltimasContagens();
  const rows = [];
  Object.keys(TIPOS_CONTAGEM).forEach((tipo) => {
    const config = TIPOS_CONTAGEM[tipo];
    config.setores.forEach((setor) => {
      for (let linha = 1; linha <= config.linhasPorSetor; linha++) {
        const st = statusCicloLinhaComMapa(mapaUltimas, tipo, setor, linha);
        rows.push({
          "Tipo": tipo, "Setor": setor, "Linha": linha,
          "Última Contagem": st.ultima || "", "Situação": st.disponivel ? "Disponível" : `Descansando (${st.diasFaltam}d)`,
        });
      }
    });
  });
  return rows;
}

function montarLinhasContagem() {
  return S.contagemLinhas.map((l) => ({
    "Tipo": l.tipo, "Setor": l.setor, "Linha": l.numero, "Nº Plantas": l.valores.length, "Total Frutas": l.total,
  }));
}

function montarLinhasAplic(tiposList) {
  const rows = [];
  tiposList.forEach(({ tipo }) => {
    TALHOES.forEach((setor) => {
      const reg = getRegistroAplic(setor, tipo);
      const calc = calcAplicacao(reg, tipo);
      rows.push({
        "Setor": setor, "Tipo": tipo, "Produto": reg.produtoInsumo, "Quantidade Aplicada": reg.quantidade, "Intervalo (dias)": reg.intervalo,
        "Data Programada": reg.dataProgramada, "Data Aplicada": reg.dataAplicada,
        "Status": calc.status, "Próxima Aplicação": calc.proximaFmt,
      });
    });
  });
  return rows;
}

/* =========================================================================
   BACKUP NO GOOGLE SHEETS
   ========================================================================= */
window.enviarBackupSheets = async function () {
  const pill = document.getElementById("backupPill");
  if (pill) { pill.textContent = "enviando…"; pill.className = "backup-pill enviando"; }
  try {
    const payload = {
      sheets: {
        "Romaneio": montarLinhasRomaneio(),
        "Romaneio Verde": montarLinhasRomaneioVerde(),
        "Descasca Manual": montarLinhasDescascaManual(),
        "Descartes": montarLinhasDescartes(),
        "Contagem": montarLinhasContagem(),
        "Aplicações": montarLinhasAplic(TIPOS_APLICACAO),
        "Adubações": montarLinhasAplic(TIPOS_ADUBACAO),
        "Indicadores": montarLinhasIndicadores(),
        "Programação": montarLinhasProgramacao(),
        "Insumos": montarLinhasInsumos(),
        "Estoque Movimentações": montarLinhasEstoqueMovs(),
        "Solicitações": montarLinhasSolicitacoes(),
        "Setores": montarLinhasSetores(),
        "Fotos": montarLinhasFotos(),
        "Ocorrências": montarLinhasOcorrencias(),
        "Rendimento": montarLinhasRendimento(),
        "Colheita": montarLinhasColheita(),
      },
    };
    const res = await fetch(BACKUP_SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita pré-checagem CORS que o Apps Script não trata bem
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data && data.ok) {
      if (pill) { pill.textContent = "backup ok ✓"; pill.className = "backup-pill ok"; }
    } else {
      throw new Error((data && data.erro) || "falha desconhecida");
    }
  } catch (e) {
    console.error("Backup Sheets falhou:", e);
    if (pill) { pill.textContent = "falhou, tenta de novo"; pill.className = "backup-pill erro"; }
  }
  setTimeout(() => { if (pill) { pill.textContent = ""; pill.className = "backup-pill"; } }, 4000);
};


/* =========================================================================
   INSTALAÇÃO DO APP (PWA)
   ========================================================================= */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});
window.instalarApp = async function () {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBanner").classList.remove("show");
};
window.addEventListener("appinstalled", () => {
  document.getElementById("installBanner").classList.remove("show");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").then((reg) => {
      // Verifica se tem versão nova assim que abre o app
      reg.update().catch(() => {});
      // Se detectar uma versão nova instalada, recarrega sozinho pra usar ela
      reg.addEventListener("updatefound", () => {
        const novoSW = reg.installing;
        if (!novoSW) return;
        novoSW.addEventListener("statechange", () => {
          if (novoSW.state === "activated") {
            window.location.reload();
          }
        });
      });
    }).catch((e) => console.warn("SW falhou:", e));
  });

  let jaRecarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (jaRecarregou) return;
    jaRecarregou = true;
    window.location.reload();
  });
}

/* =========================================================================
   TEMA (claro / escuro / alto contraste)
   ========================================================================= */
const TEMAS = [
  { id: "claro", icone: "☀️" },
  { id: "escuro", icone: "🌙" },
  { id: "contraste", icone: "🔆" },
];
function aplicarTema(id) {
  if (id === "claro") document.body.removeAttribute("data-tema");
  else document.body.setAttribute("data-tema", id);
  const btn = document.getElementById("btnTema");
  const t = TEMAS.find((t) => t.id === id) || TEMAS[0];
  if (btn) btn.textContent = t.icone;
  try { localStorage.setItem("coco-tema", id); } catch (e) { /* sem storage, tudo bem */ }
}
window.alternarTema = function () {
  const atual = document.body.getAttribute("data-tema") || "claro";
  const idx = TEMAS.findIndex((t) => t.id === atual);
  const proximo = TEMAS[(idx + 1) % TEMAS.length];
  aplicarTema(proximo.id);
};
(function iniciarTema() {
  let salvo = "claro";
  try { salvo = localStorage.getItem("coco-tema") || "claro"; } catch (e) {}
  aplicarTema(salvo);
})();
