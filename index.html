<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#065f46" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>Controle de Campo — Coco</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#f5f5f4; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#292524; }
  #app { min-height:100vh; padding-bottom: 40px; }

  .header { background:#064e3b; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20; }
  .header .title { font-weight:700; font-size:15px; line-height:1.2; }
  .header .status { font-size:11px; line-height:1.3; display:flex; align-items:center; gap:5px; margin-top:2px; }
  .status.online { color:#a7f3d0; }
  .status.offline { color:#fcd34d; font-weight:600; }
  .header .spacer { flex:1; }
  .btn-export { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:7px; padding:7px 10px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; cursor:pointer; }
  .btn-export:active { background:rgba(255,255,255,.3); }
  .backup-pill { font-size:10px; color:#d1fae5; min-height:12px; }
  .backup-pill.enviando { color:#fcd34d; }
  .backup-pill.ok { color:#a7f3d0; font-weight:700; }
  .backup-pill.erro { color:#fca5a5; font-weight:700; }

  .tabs { display:flex; background:#fff; border-bottom:1px solid #e7e5e4; position:sticky; top:52px; z-index:19; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab-btn { flex: 0 0 auto; min-width:78px; text-align:center; padding:8px 6px; font-size:10.5px; font-weight:700; color:#a8a29e; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; line-height:1.15; white-space:nowrap; }
  .tab-btn.active { color:#065f46; border-bottom-color:#065f46; }
  .tab-btn .ic { display:block; font-size:17px; margin-bottom:2px; }

  .content { max-width: 720px; margin: 0 auto; padding: 12px; }
  .card { background:#fff; border:1px solid #e7e5e4; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card h3 { margin:0 0 10px; font-size:13px; font-weight:700; color:#44403c; display:flex; align-items:center; gap:6px; }
  .saving-pill { font-size:11px; color:#78716c; margin-left:auto; }
  .saving-pill.offline { color:#d97706; font-weight:700; }
  .saving-pill.saved { color:#047857; }

  .grid { display:grid; gap:8px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width:640px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }

  label.field { display:flex; flex-direction:column; gap:3px; }
  label.field span { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#78716c; }
  input, select { font-size:15px; padding:8px 9px; border:1px solid #d6d3d1; border-radius:7px; background:#fff; color:#292524; width:100%; }
  input:focus, select:focus { outline:2px solid #059669; border-color:#059669; }
  input.amarelo { background:#fff2cc; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:#065f46; color:#fff; border:none; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; width:100%; }
  .btn:active { background:#064e3b; }
  .btn.danger { background:transparent; color:#dc2626; }
  .btn.ghost { background:transparent; color:#065f46; }

  .carga-card { border:1px solid #e7e5e4; border-radius:12px; margin-bottom:10px; overflow:hidden; background:#fff; }
  .carga-head { width:100%; text-align:left; padding:12px 14px; background:none; border:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; cursor:pointer; }
  .carga-head .left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; flex:1 1 100%; }
  .carga-head .num { font-weight:700; color:#292524; }
  .carga-head .badge { background:#f5f5f4; color:#57534e; border-radius:99px; padding:2px 8px; font-size:11px; }
  .carga-body { border-top:1px solid #f0efee; padding:12px 14px; }
  .carga-resumo { display:flex; gap:6px; flex:1 1 100%; }
  .resumo-item { flex:1; background:#f5f5f4; border-radius:8px; padding:6px 4px; text-align:center; }
  .resumo-lbl { display:block; font-size:10px; font-weight:700; text-transform:uppercase; color:#a8a29e; letter-spacing:.02em; }
  .resumo-val { display:block; font-size:17px; font-weight:800; color:#292524; margin-top:1px; }
  .resumo-val.neg { color:#dc2626; }
  .resumo-val.pos { color:#047857; }

  table.tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.tbl th { text-align:right; color:#78716c; font-weight:600; padding:5px 6px; border-bottom:1px solid #e7e5e4; white-space:nowrap;}
  table.tbl th:first-child, table.tbl td:first-child { text-align:left; }
  table.tbl td { padding:5px 6px; border-bottom:1px solid #f5f5f4; text-align:right; }
  .tbl-wrap { overflow-x:auto; margin: 0 -14px; padding: 0 14px; }
  .neg { color:#dc2626; font-weight:700; }
  .pos { color:#047857; font-weight:700; }
  .x-btn { background:none; border:none; color:#a8a29e; cursor:pointer; padding:8px; font-size:17px; line-height:1; }
  .x-btn:active { color:#065f46; }
  .bag-pendente-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:14px; }
  @media (min-width:420px) { .bag-pendente-grid { grid-template-columns: repeat(4, 1fr); } }
  .bag-pendente-btn { background:#fffbeb; border:2px solid #fde68a; color:#92400e; font-weight:800; font-size:14px; padding:14px 4px; border-radius:10px; cursor:pointer; }
  .bag-pendente-btn:active { background:#fde68a; }
  .x-btn:active { color:#dc2626; }

  .stat-box { background:#f5f5f4; border-radius:9px; padding:10px; text-align:center; }
  .stat-box .lbl { font-size:10px; text-transform:uppercase; color:#a8a29e; }
  .stat-box .val { font-size:17px; font-weight:700; color:#292524; }
  .stat-box.green { background:#ecfdf5; }
  .stat-box.green .lbl { color:#059669; }
  .stat-box.green .val { color:#065f46; }

  .status-pill { display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; }
  .status-pill.verde { background:#C6EFCE; color:#065f46; }
  .status-pill.amarelo { background:#FFEB9C; color:#7a5b00; }
  .status-pill.vermelho { background:#FFC7CE; color:#9c0006; }
  .status-pill.azul { background:#D9E1F2; color:#1e3a6e; }
  .status-pill.cinza { background:#e7e5e4; color:#57534e; }

  .aplic-section { margin-bottom:14px; }
  .aplic-section-hdr { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; color:#292524; padding:10px 4px 8px; }
  .aplic-row { display:grid; grid-template-columns: 56px 1fr; gap:8px; padding:10px; border-bottom:1px solid #f0efee; align-items:start; }
  .aplic-row:last-child { border-bottom:none; }
  .aplic-setor { font-weight:800; font-size:13px; color:#292524; padding-top:6px; }
  .aplic-fields { display:grid; grid-template-columns: repeat(2, 1fr); gap:6px; }
  .aplic-fields .field span { font-size:9.5px; }
  .aplic-fields input { padding:6px 7px; font-size:13px; }
  .aplic-meta { grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between; margin-top:4px; font-size:11.5px; color:#78716c; }

  .plantas-grid { display:grid; grid-template-columns: repeat(6, 1fr); gap:5px; max-height:230px; overflow-y:auto; padding:2px; margin-bottom:10px; }
  @media (min-width:520px) { .plantas-grid { grid-template-columns: repeat(8, 1fr); } }
  .planta-cell { text-align:center; }
  .planta-cell.atual-voz input { border-color:#dc2626; border-width:2px; background:#fef2f2; box-shadow:0 0 0 3px rgba(220,38,38,.15); }
  .btn-voz { background:#f5f5f4; color:#44403c; border:1px solid #d6d3d1; border-radius:99px; padding:5px 11px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn-voz.ativo { background:#dc2626; color:#fff; border-color:#dc2626; animation: pulsa-voz 1.4s infinite; }
  @keyframes pulsa-voz { 0%,100% { opacity:1; } 50% { opacity:.72; } }
  .planta-cell .n { font-size:9px; color:#a8a29e; display:block; }
  .planta-cell input { text-align:center; padding:6px 2px; font-size:13px; }

  .empty { text-align:center; padding:26px 10px; color:#a8a29e; font-size:13px; }
  .row-flex { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted { color:#a8a29e; font-size:12px; }

  .fotos-carga-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .fotos-carga-btns button { width:auto; padding:7px 11px; font-size:12px; border-radius:8px; border:1px solid #d6d3d1; background:#f5f5f4; color:#44403c; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .fotos-carga-btns button.seco { border-color:#fde68a; background:#fffbeb; color:#92400e; }
  .fotos-carga-btns button.verde { border-color:#a7f3d0; background:#ecfdf5; color:#065f46; }
  .fotos-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
  @media (min-width:520px) { .fotos-grid { grid-template-columns: repeat(5, 1fr); } }
  .foto-item { position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:#f0efee; border:1px solid #e7e5e4; }
  .foto-item img { width:100%; height:100%; object-fit:cover; cursor:pointer; display:block; }
  .foto-tipo-badge { position:absolute; left:3px; bottom:3px; font-size:8.5px; font-weight:700; padding:2px 5px; border-radius:99px; background:rgba(0,0,0,.55); color:#fff; white-space:nowrap; }
  .foto-tipo-badge.seco { background:rgba(180,83,9,.85); }
  .foto-tipo-badge.verde { background:rgba(6,95,70,.85); }
  .foto-del { position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:99px; width:20px; height:20px; font-size:12px; line-height:1; cursor:pointer; }
  .foto-uploading { display:flex; align-items:center; justify-content:center; font-size:9px; color:#78716c; text-align:center; padding:4px; }

  .install-banner { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; display:none; align-items:center; gap:8px; }
  .install-banner.show { display:flex; }
  .install-banner button { background:#d97706; color:#fff; border:none; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }

  .btn-tema { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:99px; width:34px; height:34px; font-size:16px; cursor:pointer; margin-right:6px; flex-shrink:0; }
  .btn-tema:active { background:rgba(255,255,255,.3); }

  /* ===================== TEMA ESCURO ===================== */
  body[data-tema="escuro"] { background:#121815; color:#e7e5e4; }
  body[data-tema="escuro"] .tabs { background:#1a2320; border-bottom-color:#2d3733; }
  body[data-tema="escuro"] .tab-btn { color:#7d8a83; }
  body[data-tema="escuro"] .tab-btn.active { color:#4ade80; border-bottom-color:#4ade80; }
  body[data-tema="escuro"] .card, body[data-tema="escuro"] .carga-card { background:#1a2320; border-color:#2d3733; }
  body[data-tema="escuro"] .card h3 { color:#e7e5e4; }
  body[data-tema="escuro"] .carga-head .num, body[data-tema="escuro"] .resumo-val,
  body[data-tema="escuro"] .stat-box .val, body[data-tema="escuro"] .aplic-setor { color:#f5f5f4; }
  body[data-tema="escuro"] .muted, body[data-tema="escuro"] .resumo-lbl, body[data-tema="escuro"] .stat-box .lbl,
  body[data-tema="escuro"] .saving-pill, body[data-tema="escuro"] .aplic-section-hdr .muted { color:#8a938d; }
  body[data-tema="escuro"] .carga-body { border-top-color:#2d3733; }
  body[data-tema="escuro"] .carga-head .badge { background:#2d3733; color:#c7ccc9; }
  body[data-tema="escuro"] .resumo-item, body[data-tema="escuro"] .stat-box { background:#232b27; }
  body[data-tema="escuro"] .stat-box.green { background:#0f3324; }
  body[data-tema="escuro"] input, body[data-tema="escuro"] select {
    background:#1f2723; border-color:#3a453f; color:#f5f5f4;
  }
  body[data-tema="escuro"] input.amarelo { background:#3a3018; }
  body[data-tema="escuro"] .tbl th { color:#8a938d; border-bottom-color:#2d3733; }
  body[data-tema="escuro"] .tbl td { border-bottom-color:#232b27; color:#e7e5e4; }
  body[data-tema="escuro"] .empty { color:#6b746e; }
  body[data-tema="escuro"] .field span { color:#8a938d; }
  body[data-tema="escuro"] .install-banner { background:#3a3018; border-color:#5a4a1f; color:#fcd34d; }
  body[data-tema="escuro"] .aplic-fields input { background:#1f2723; }
  body[data-tema="escuro"] .planta-cell.atual-voz input { background:#3a1414; }
  body[data-tema="escuro"] .btn-voz { background:#232b27; color:#c7ccc9; border-color:#3a453f; }
  body[data-tema="escuro"] .fotos-carga-btns button { background:#232b27; color:#c7ccc9; border-color:#3a453f; }
  body[data-tema="escuro"] .fotos-carga-btns button.seco { background:#3a3018; border-color:#5a4a1f; color:#fcd34d; }
  body[data-tema="escuro"] .fotos-carga-btns button.verde { background:#0f3324; border-color:#1e5a42; color:#6ee7b7; }
  body[data-tema="escuro"] .foto-item { background:#1f2723; border-color:#2d3733; }

  /* ===================== ALTO CONTRASTE ===================== */
  body[data-tema="contraste"] { background:#ffffff; color:#000000; }
  body[data-tema="contraste"] .card, body[data-tema="contraste"] .carga-card {
    border:2px solid #000; box-shadow:none;
  }
  body[data-tema="contraste"] .card h3 { color:#000; font-weight:800; }
  body[data-tema="contraste"] .tabs { border-bottom:2px solid #000; }
  body[data-tema="contraste"] .tab-btn { color:#000; }
  body[data-tema="contraste"] .tab-btn.active { color:#000; border-bottom:4px solid #000; font-weight:900; }
  body[data-tema="contraste"] .muted, body[data-tema="contraste"] .resumo-lbl, body[data-tema="contraste"] .stat-box .lbl,
  body[data-tema="contraste"] .saving-pill { color:#333; font-weight:700; }
  body[data-tema="contraste"] .carga-head .num, body[data-tema="contraste"] .resumo-val,
  body[data-tema="contraste"] .stat-box .val, body[data-tema="contraste"] .aplic-setor { color:#000; font-weight:900; }
  body[data-tema="contraste"] .resumo-item, body[data-tema="contraste"] .stat-box { background:#f0f0f0; border:1px solid #000; }
  body[data-tema="contraste"] input, body[data-tema="contraste"] select {
    border:2px solid #000; color:#000; font-weight:700;
  }
  body[data-tema="contraste"] input.amarelo { background:#fff3b0; }
  body[data-tema="contraste"] .tbl th { color:#000; font-weight:900; border-bottom:2px solid #000; }
  body[data-tema="contraste"] .tbl td { border-bottom:1px solid #000; color:#000; font-weight:600; }
  body[data-tema="contraste"] .btn { font-weight:900; border:2px solid #000; }
  body[data-tema="contraste"] .neg { color:#b91c1c; font-weight:900; }
  body[data-tema="contraste"] .pos { color:#166534; font-weight:900; }
  body[data-tema="contraste"] .carga-head .badge { border:1px solid #000; font-weight:700; }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <span style="font-size:20px;">🌴</span>
    <div>
      <div class="title">Controle de Campo — Coco</div>
      <div id="statusLine" class="status offline">verificando conexão…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn-tema" id="btnTema" onclick="alternarTema()" title="Trocar tema">☀️</button>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
      <div style="display:flex; gap:6px;">
        <button class="btn-export" onclick="exportarExcel()">⬇️ Excel</button>
        <button class="btn-export" onclick="enviarBackupSheets()">📊 Sheets</button>
      </div>
      <span id="backupPill" class="backup-pill"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabbtn-romaneio" onclick="mudarAba('romaneio')"><span class="ic">🚛</span>Romaneio</button>
    <button class="tab-btn" id="tabbtn-descartes" onclick="mudarAba('descartes')"><span class="ic">🗑️</span>Descartes</button>
    <button class="tab-btn" id="tabbtn-contagem" onclick="mudarAba('contagem')"><span class="ic">🌱</span>Contagem</button>
    <button class="tab-btn" id="tabbtn-aplicacoes" onclick="mudarAba('aplicacoes')"><span class="ic">🧴</span>Aplic./Adub.</button>
    <button class="tab-btn" id="tabbtn-indicadores" onclick="mudarAba('indicadores')"><span class="ic">📈</span>Indicadores</button>
    <button class="tab-btn" id="tabbtn-programacao" onclick="mudarAba('programacao')"><span class="ic">🗓️</span>Programação</button>
    <button class="tab-btn" id="tabbtn-estoque" onclick="mudarAba('estoque')"><span class="ic">📦</span>Estoque</button>
  </div>

  <div class="content">
    <div id="installBanner" class="install-banner">
      <span>📲 Instale este app na tela inicial pra abrir rapidinho, igual um app normal.</span>
      <button onclick="instalarApp()">Instalar</button>
    </div>
    <div id="tabContent"></div>
    <input type="file" id="inputFotoCarga" accept="image/*" capture="environment" multiple style="display:none" onchange="onFotosCargaSelecionadas(this)"/>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, onSnapshot, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDiF0gJtRCJKLyv45k3SjUfoZea8fwhOkM",
  authDomain: "controle-coco.firebaseapp.com",
  projectId: "controle-coco",
  storageBucket: "controle-coco.firebasestorage.app",
  messagingSenderId: "1007624515688",
  appId: "1:1007624515688:web:205aff930193f39a938bdd",
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
// As fotos não usam mais o Firebase Storage (que exigia o plano pago) — agora vão
// pro Google Drive através do mesmo Apps Script que já faz o backup da planilha.
// Ver BACKUP_SHEETS_URL mais abaixo.

enableIndexedDbPersistence(db).catch((err) => {
  console.warn("Persistência offline não pôde ser ativada:", err.code);
});

/* =========================================================================
   ESTADO GLOBAL
   ========================================================================= */
window.__state = {
  cargas: [],
  bags: [],
  cargaFotos: [],
  registrosDescarte: [],
  contagemLinhas: [],
  aplicacoesDados: {},
  programacao: [],
  insumos: [],
  estoqueMovs: [],
  solicitacoes: [],
  currentTab: "romaneio",
  contagem: { tipo: "Híbrido", setor: "A3A4", numLinha: "", qtdPlantas: 78, valores: [] },
  _vozAtivo: false,
  _vozIndiceAtual: 0,
  _aplicColapsado: {},
  _uploadCargaId: null,
  _uploadTipoFoto: "Carga geral",
  _fotosEnviando: 0,
  _fotosPendentes: [],
  saveStatus: { romaneio: "idle", descartes: "idle", contagem: "idle", aplicacoes: "idle", programacao: "idle", estoque: "idle" },
};
const S = window.__state;
window.S = S; // necessário para os campos de formulário (oninput="S...") funcionarem

const TALHOES = ["A3A4", "B3B4", "C1C2", "C3C4", "D1", "D2", "D3", "D4"];

function calcLinhaRomaneio(l) {
  const estocado1 = Number(l.estocado1) || 0;
  const temCarregado = l.carregado1 !== undefined && l.carregado1 !== null && l.carregado1 !== "";
  const carregado1 = Number(l.carregado1) || 0;
  const diferenca = temCarregado ? carregado1 - estocado1 : null;
  const frutos1 = Number(l.coco1) || 0;
  const desvio = (temCarregado && estocado1) ? carregado1 / estocado1 : null;
  const mediaCarregado = (temCarregado && frutos1) ? carregado1 / frutos1 : null;
  const mediaAmostrada = Number(l.cincoCocosG) ? Number(l.cincoCocosG) / 5 / 1000 : null;
  const comparacao = (mediaAmostrada && mediaCarregado) ? mediaCarregado / mediaAmostrada : null;
  return { estocado1, carregado1, temCarregado, diferenca, desvio, mediaCarregado, mediaAmostrada, comparacao };
}

function calcDescarte(d) {
  const num = (v) => Number(v) || 0;
  const totalKg = CATS_DESCARTES.reduce((s, c) => s + num(d.cats[c.key].kg), 0);
  const totalUnid = num(d.descartesUnid) + CATS_DESCARTES.reduce((s, c) => s + num(d.cats[c.key].unid), 0);
  const pctKg = {}, pctUnid = {};
  CATS_DESCARTES.forEach((c) => {
    pctKg[c.key] = totalKg ? num(d.cats[c.key].kg) / totalKg : null;
    pctUnid[c.key] = totalUnid ? num(d.cats[c.key].unid) / totalUnid : null;
  });
  const brotoPct = pctKg.brotos;
  const perda350 = pctKg.refugos;
  const aprov350 = (brotoPct !== null && perda350 !== null) ? 1 - (brotoPct||0) - (perda350||0) : null;
  const perda400 = (pctKg.refugos||0) + (pctKg.g350_400||0);
  const aprov400 = 1 - (brotoPct||0) - perda400;
  return { totalKg, totalUnid, pctKg, pctUnid, brotoPct, perda350, aprov350, perda400, aprov400 };
}

function calcAplicacao(reg, tipo) {
  reg = reg || {};
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const parseD = (s) => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
  const addDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + Number(n)); return r; };
  const diffDias = (d) => Math.round((d - hoje) / 86400000);
  const fmtD = (d) => d ? d.toLocaleDateString("pt-BR") : "—";

  const dataProgramada = parseD(reg.dataProgramada);
  const dataAplicada = parseD(reg.dataAplicada);
  const intervalo = reg.intervalo !== undefined && reg.intervalo !== "" ? Number(reg.intervalo) : null;
  const proxima = (dataAplicada && intervalo) ? addDias(dataAplicada, intervalo) : null;

  let status, cor;
  if (tipo === "Foliar") {
    if (dataAplicada) { status = "Aplicado"; cor = "verde"; }
    else { status = "Monitorar campo"; cor = "cinza"; }
  } else if (dataAplicada) {
    if (!proxima) { status = "Concluído"; cor = "verde"; }
    else if (diffDias(proxima) < 0) { status = "Atrasado"; cor = "vermelho"; }
    else if (diffDias(proxima) <= 7) { status = "Em breve"; cor = "amarelo"; }
    else { status = "Concluído"; cor = "verde"; }
  } else if (dataProgramada) {
    if (diffDias(dataProgramada) < 0) { status = "Atrasado"; cor = "vermelho"; }
    else if (diffDias(dataProgramada) <= 7) { status = "Em breve"; cor = "amarelo"; }
    else { status = "Programado"; cor = "azul"; }
  } else {
    status = "-"; cor = "cinza";
  }
  return { status, cor, proxima, proximaFmt: fmtD(proxima), diasProxima: proxima ? diffDias(proxima) : null };
}

        html += `<div class="muted" style="font-size:10.5px; margin:-6px 0 10px;">⏳ ${pendentes.length} foto${pendentes.length > 1 ? "s" : ""} guardada${pendentes.length > 1 ? "s" : ""} no celular, esperando internet pra enviar — não vai perder, pode continuar usando.</div>`;
      }
    } else {
      html += `<div class="muted" style="font-size:11.5px; margin-bottom:10px;">Nenhuma foto ainda.</div>`;
    }

    html += `<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px; flex-wrap:wrap;">`;
    html += `<button class="btn ghost" style="width:auto; color:#128C7E; border:1px solid #128C7E;" onclick="compartilharCargaWhatsapp('${carga.id}')">📲 Compartilhar</button>`;
    if (!arquivada) {
      html += `<button class="btn danger" onclick="removeCarga('${carga.id}')">🗑️ Excluir carga</button>`;
      html += `<button class="btn" style="width:auto; background:#0f766e;" onclick="arquivarCarga('${carga.id}')">📦 Finalizar e arquivar carga</button>`;
    } else {
      html += `<button class="btn ghost" style="width:auto;" onclick="reabrirCarga('${carga.id}')">↩️ Reabrir carga</button>`;
    }
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

function bagsDaCarga(cargaId) {
  return S.bags
    .filter((b) => b.cargaId === cargaId)
    .sort((a, b) => (Number(a.idBag) || 0) - (Number(b.idBag) || 0));
}

/* =========================================================================
   FOTOS DO CARREGAMENTO
   Fotos tiradas pelo responsável na hora do carregamento, pra depois dar pra
   ver como saiu a carga (coco seco / coco verde). Os bytes da imagem vão pro
   Google Drive através do Apps Script (mesmo endpoint do backup da planilha,
   diferenciado pelo campo "action") — sem tela de login pro pessoal do campo,
   porque o script roda com a conta Google de quem publicou ele. Só a
   referência (url do Drive) e o tipo ficam guardados no Firestore, então a
   sincronização entre celulares continua em tempo real, do jeito que já era.
   ========================================================================= */
function fotosDaCarga(cargaId) {
  return S.cargaFotos
    .filter((f) => f.cargaId === cargaId)
    .sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""));
}

// Reduz a foto antes de enviar (câmeras de celular tiram fotos enormes e o sinal no
// campo costuma ser fraco) — redimensiona pro máximo de 1600px no lado maior e
// comprime em JPEG. Se por algum motivo não conseguir processar, manda o arquivo original.
async function comprimirImagem(file, maxDim = 1600, qualidade = 0.72) {
  try {
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if (width > maxDim || height > maxDim) {
      const escala = maxDim / Math.max(width, height);
      width = Math.round(width * escala);
      height = Math.round(height * escala);
    }
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, width, height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", qualidade));
    return blob || file;
  } catch (e) {
    console.warn("Não consegui comprimir a foto, enviando original:", e);
    return file;
  }
}

// O Apps Script recebe a imagem em base64 dentro de um JSON (não dá pra mandar o
// arquivo binário direto como o Storage aceitava) — essa função faz essa conversão.
function blobParaBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      // reader.result vem como "data:image/jpeg;base64,AAAA..." — só queremos a parte depois da vírgula
      const base64 = String(reader.result).split(",")[1] || "";
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Antes o envio da foto podia ficar "pendurado" pra sempre (ampulheta girando sem parar) se o
// sinal caísse no meio do envio ou o servidor não respondesse. Com isso, depois de X segundos sem
// resposta a gente desiste e avisa, em vez de deixar a pessoa esperando pra sempre sem saber o que houve.
function comTimeout(promise, ms, mensagem) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(mensagem || "tempo esgotado")), ms)),
  ]);
}

/* ---------- Fila de fotos pendentes: funciona sem internet -------------
   Se não tem sinal na hora de enviar, a foto não se perde: fica guardada
   aqui no próprio celular (IndexedDB) e o app tenta enviar sozinho assim
   que a internet voltar — seja porque o navegador avisou que reconectou,
   seja porque a pessoa só abriu o app de novo depois, já com sinal. */
const FOTOS_PENDENTES_DB = "coco-campo-fotos-pendentes";
const FOTOS_PENDENTES_STORE = "pendentes";

function abrirDBFotosPendentes() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FOTOS_PENDENTES_DB, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(FOTOS_PENDENTES_STORE, { keyPath: "id", autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function salvarFotoPendente(registro) {
  const db = await abrirDBFotosPendentes();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOTOS_PENDENTES_STORE, "readwrite");
    const req = tx.objectStore(FOTOS_PENDENTES_STORE).add(registro);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function listarFotosPendentes() {
  const db = await abrirDBFotosPendentes();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOTOS_PENDENTES_STORE, "readonly");
    const req = tx.objectStore(FOTOS_PENDENTES_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function removerFotoPendente(id) {
  const db = await abrirDBFotosPendentes();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOTOS_PENDENTES_STORE, "readwrite");
    tx.objectStore(FOTOS_PENDENTES_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function atualizarListaPendentesEmMemoria() {
  try {
    S._fotosPendentes = await listarFotosPendentes();
  } catch (e) {
    console.warn("Não consegui ler a fila de fotos pendentes:", e);
  }
  renderRomaneioSeAtivo();
}

// O envio de verdade — separado numa função própria porque é usado tanto na hora
// de tirar a foto quanto depois, ao tentar reenviar o que ficou na fila.
async function enviarFotoAgora({ cargaId, tipo, base64, nomeArquivo }) {
  const res = await comTimeout(fetch(BACKUP_SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita pré-checagem CORS que o Apps Script não trata bem
    body: JSON.stringify({ action: "uploadFoto", cargaId, tipo, base64, nomeArquivo, mimeType: "image/jpeg" }),
  }), 30000, "envio-demorou");
  const data = await res.json();
  if (!data || !data.ok) throw new Error((data && data.erro) || "falha desconhecida no envio");

  await addDoc(collection(db, "cargaFotos"), {
    cargaId, url: data.url, fileId: data.fileId, tipo, criadoEm: new Date().toISOString(),
  });
}

let _sincronizandoFotosPendentes = false;
async function sincronizarFotosPendentes() {
  if (_sincronizandoFotosPendentes || !navigator.onLine) return;
  _sincronizandoFotosPendentes = true;
  try {
    const pendentes = await listarFotosPendentes();
    for (const p of pendentes) {
      try {
        await enviarFotoAgora({ cargaId: p.cargaId, tipo: p.tipo, base64: p.base64, nomeArquivo: p.nomeArquivo });
        await removerFotoPendente(p.id);
        await atualizarListaPendentesEmMemoria();
      } catch (e) {
        console.warn("Ainda não consegui enviar uma foto da fila, tento de novo mais tarde:", e);
        break; // se essa falhou (sinal deve continuar ruim), não adianta insistir nas próximas agora
      }
    }
  } finally {
    _sincronizandoFotosPendentes = false;
  }
}
window.addEventListener("online", sincronizarFotosPendentes);
setInterval(sincronizarFotosPendentes, 25000); // tenta de novo periodicamente enquanto o app estiver aberto
atualizarListaPendentesEmMemoria().then(sincronizarFotosPendentes); // carrega o que sobrou de sessões anteriores e já tenta enviar

window.selecionarFotosCarga = function (cargaId, tipo) {

window.onFotosCargaSelecionadas = async function (input) {
  const cargaId = S._uploadCargaId;
  const tipo = S._uploadTipoFoto || "Carga geral";
  const files = Array.from(input.files || []);
  input.value = ""; // permite escolher o mesmo arquivo de novo depois, se precisar

  if (!cargaId || files.length === 0) return;

  S._fotosEnviando += files.length;
  marcarSalvando("romaneio");
  renderRomaneioSeAtivo();

  for (const file of files) {
    let base64, nomeArquivo;
    try {
      const blob = await comprimirImagem(file);
      base64 = await blobParaBase64(blob);
      nomeArquivo = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`;
    } catch (e) {
      console.error("Não consegui processar essa foto:", e);
      alert("Não consegui processar uma das fotos. Tenta tirar de novo.");
      S._fotosEnviando = Math.max(0, S._fotosEnviando - 1);
      renderRomaneioSeAtivo();
      continue;
    }

    try {
      if (!navigator.onLine) throw new Error("sem-internet");
      await enviarFotoAgora({ cargaId, tipo, base64, nomeArquivo });
    } catch (e) {
      // Sem sucesso no envio (sem sinal, ou o servidor não respondeu a tempo) — em vez de perder a
      // foto, guarda no celular pra tentar de novo sozinho depois.
      console.warn("Sem sucesso no envio agora, guardando no celular pra tentar depois:", e);
      try {
        await salvarFotoPendente({ cargaId, tipo, base64, nomeArquivo, mimeType: "image/jpeg", criadoEm: new Date().toISOString() });
        await atualizarListaPendentesEmMemoria();
      } catch (e2) {
        console.error("Falha ao guardar a foto localmente:", e2);
        alert("Não consegui enviar nem guardar essa foto agora. Tenta de novo.");
      }
    } finally {
      S._fotosEnviando = Math.max(0, S._fotosEnviando - 1);
      renderRomaneioSeAtivo(); // atualiza a cada foto, não só no final — some a ampulheta assim que aquela terminar
    }
  }

  if (S._fotosEnviando === 0) setSaveStatus("romaneio", "saved");
};

// Manda os totais da carga (e as fotos, quando o celular permite) direto pro compartilhamento
// nativo — o WhatsApp aparece como uma das opções pra escolher o contato/grupo. Não tem como
// pular esse último toque: por segurança, nenhum site consegue mandar mensagem sozinho pelo
// WhatsApp de alguém sem a pessoa escolher o destino na hora.
window.compartilharCargaWhatsapp = async function (cargaId) {
  const carga = S.cargas.find((c) => c.id === cargaId);
  if (!carga) return;

  const linhasCalc = bagsDaCarga(cargaId).map((l) => ({ ...l, ...calcLinhaRomaneio(l) }));
  const totalCoco = linhasCalc.reduce((s, l) => s + (Number(l.coco1) || 0), 0);
  const totalEstocado = linhasCalc.reduce((s, l) => s + l.estocado1, 0);
  const totalCarregado = linhasCalc.reduce((s, l) => s + l.carregado1, 0);
  const totalDiferenca = totalCarregado - totalEstocado;

  const texto = `🌴 *Carga Nº ${carga.numero}* — ${brDate(carga.data)}\n` +
    (carga.encarregado ? `Encarregado: ${carga.encarregado}\n` : "") +
    `Bags: ${linhasCalc.length}\n` +
    `Quantidade: ${fmt(totalCoco, 0)} cocos\n` +
    `Estocado: ${fmt(totalEstocado, 0)} kg\n` +
    `Carregado: ${fmt(totalCarregado, 0)} kg\n` +
    `Diferença: ${fmt(totalDiferenca, 0)} kg`;

  const fotos = fotosDaCarga(cargaId);
  let arquivos = [];
  if (fotos.length > 0 && navigator.canShare) {
    try {
      const blobs = await Promise.all(fotos.map((f) => fetch(f.url).then((r) => r.blob())));
      arquivos = blobs.map((b, i) => new File([b], `carga-${carga.numero}-${i + 1}.jpg`, { type: b.type || "image/jpeg" }));
      if (!navigator.canShare({ files: arquivos })) arquivos = []; // esse navegador não aceita compartilhar arquivo, só texto
    } catch (e) {
      console.warn("Não consegui baixar as fotos pra compartilhar, mandando só o texto:", e);
      arquivos = [];
    }
  }

  if (navigator.share) {
    try {
      await navigator.share(arquivos.length > 0
        ? { title: `Carga ${carga.numero}`, text: texto, files: arquivos }
        : { title: `Carga ${carga.numero}`, text: texto });
      return;
    } catch (e) {
      if (e.name === "AbortError") return; // a pessoa cancelou o compartilhamento, tudo bem
      console.warn("Falha ao abrir o compartilhamento nativo, caindo pro link do WhatsApp:", e);
    }
  }

  // Fallback pra quando o celular/navegador não tem compartilhamento nativo (ex: computador):
  // abre o WhatsApp Web já com o texto pronto. As fotos, nesse caso, precisam ser anexadas na mão.
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, "_blank");
};

/* =========================================================================
   CONTAGEM POR VOZ
   ========================================================================= */
const UNIDADES_PT = { "zero":0,"um":1,"uma":1,"dois":2,"duas":2,"três":3,"tres":3,"quatro":4,"cinco":5,"seis":6,"sete":7,"oito":8,"nove":9 };
const DEZ_A_DEZENOVE_PT = { "dez":10,"onze":11,"doze":12,"treze":13,"quatorze":14,"catorze":14,"quinze":15,"dezesseis":16,"dezasseis":16,"dezessete":17,"dezassete":17,"dezoito":18,"dezenove":19,"dezanove":19 };
const DEZENAS_PT = { "vinte":20,"trinta":30,"quarenta":40,"cinquenta":50,"sessenta":60,"setenta":70,"oitenta":80,"noventa":90 };
const CENTENAS_PT = { "cem":100,"cento":100 };

// Antes essa função usava `.includes()` num dicionário só de 0-20 — o que causava um bug feio:
// como "dez" é testado antes, qualquer fala com "dezesseis/dezessete/dezoito/dezenove" virava 10
// (porque essas palavras CONTÊM "dez" e também "seis/sete/oito/nove" como substring). Agora a
// comparação é palavra por palavra (não substring) e também entende números compostos, tipo
// "vinte e cinco" ou "trinta e dois", que são comuns numa contagem de coco por planta.
function extrairNumeroDaFala(texto) {
  const t = (texto || "").toLowerCase().trim();

  // Se o motor de voz já devolveu em dígitos (comum em vários Android), usa direto — é o caminho mais confiável.
  const digitos = t.match(/\d+/);
  if (digitos) return parseInt(digitos[0], 10);

  const palavras = t
    .replace(/[^\wà-úÀ-Ú\s]/g, " ")
    .split(/\s+/)
    .filter((p) => p && p !== "e"); // "e" é só conector ("vinte E cinco"), não conta como número

  if (palavras.length === 0) return null;

  let total = null;
  for (const p of palavras) {
    if (p in CENTENAS_PT) total = (total || 0) + CENTENAS_PT[p];
    else if (p in DEZENAS_PT) total = (total || 0) + DEZENAS_PT[p];
    else if (p in DEZ_A_DEZENOVE_PT) total = (total || 0) + DEZ_A_DEZENOVE_PT[p];
    else if (p in UNIDADES_PT) total = (total || 0) + UNIDADES_PT[p];
    // palavras que não são número (ex: "coco", "cocos", "planta") são ignoradas, não travam o resultado
  }
  return total;
}

let _recognitionVoz = null;
window.toggleContagemVoz = function () {
  if (S._vozAtivo) { pararContagemVoz(); return; }
  iniciarContagemVoz();
};

function criarReconhecimentoVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "pt-BR";
  // Antes "continuous" ficava false e o app recriava o reconhecimento inteiro a cada número —
  // por isso a demora e a sensação de precisar falar de novo (o microfone "morria" entre uma
  // fala e outra, e o novo às vezes não pegava o começo da próxima palavra a tempo). Com
  // continuous=true, o mesmo microfone escuta vários números seguidos sem re-inicializar.
  // Só recriamos quando o navegador encerra a sessão sozinho (o que ainda acontece de vez em
  // quando, principalmente no Android) — isso é tratado no onend, não a cada resultado.
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  let ultimoIndiceProcessado = -1;

  rec.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const resultado = event.results[i];
      const transcript = resultado[0].transcript;

      if (!resultado.isFinal) {
        // só mostra o que está ouvindo (feedback de que o microfone está vivo); não confirma ainda
        const btn = document.getElementById("btnVoz");
        if (btn) btn.textContent = `🔴 ouvindo: "${transcript.trim()}"…`;
        continue;
      }

      if (i <= ultimoIndiceProcessado) continue; // já processamos esse trecho antes
      ultimoIndiceProcessado = i;

      const numero = extrairNumeroDaFala(transcript);
      if (numero !== null) aplicarNumeroDaVoz(numero);
    }
  };

  rec.onerror = (event) => {
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      alert("Preciso de permissão pra usar o microfone.");
      pararContagemVoz();
    }
    // outros erros (ex: "no-speech", "aborted") são normais — o onend cuida de reiniciar
  };

  rec.onend = () => {
    if (!S._vozAtivo) return;
    // O navegador derruba a sessão de vez em quando por conta própria (silêncio prolongado,
    // limite de tempo do Android etc) — aqui só recriamos quando isso realmente acontece,
    // não depois de cada número reconhecido.
    setTimeout(() => {
      if (!S._vozAtivo) return;
      try {
        _recognitionVoz = criarReconhecimentoVoz();
        _recognitionVoz.start();
      } catch (e) {
        console.error("Falha ao reiniciar reconhecimento de voz:", e);
        S._vozAtivo = false;
        if (S.currentTab === "contagem") renderContagem();
      }
    }, 250);
  };

  return rec;
}

function aplicarNumeroDaVoz(numero) {
  if (S._vozIndiceAtual >= S.contagem.valores.length) { pararContagemVoz(); return; }
  S.contagem.valores[S._vozIndiceAtual] = String(numero);
  S._vozIndiceAtual += 1;
  if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(70); // confirma sem precisar olhar pra tela
  if (S._vozIndiceAtual >= S.contagem.valores.length) {
    pararContagemVoz();
  } else if (S.currentTab === "contagem") {
    renderContagem();
  }
}

function iniciarContagemVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    const aviso = document.getElementById("vozAvisoNaoSuportado");
    if (aviso) aviso.style.display = "block";
    return;
  }
  S._vozAtivo = true;
  S._vozIndiceAtual = S.contagem.valores.findIndex((v) => v === "" || v === null || v === undefined);
  if (S._vozIndiceAtual === -1) S._vozIndiceAtual = 0;

  try {
    _recognitionVoz = criarReconhecimentoVoz();
    _recognitionVoz.start();
  } catch (e) {
    console.error("Erro ao iniciar reconhecimento de voz:", e);
    S._vozAtivo = false;
  }
  if (S.currentTab === "contagem") renderContagem();
}

function pararContagemVoz() {
  S._vozAtivo = false;
  if (_recognitionVoz) {
    try { _recognitionVoz.onend = null; _recognitionVoz.stop(); } catch (e) {}
    _recognitionVoz = null;
  }
  if (S.currentTab === "contagem") renderContagem();
}

window.salvarLinhaContagem = function () {
  pararContagemVoz();
  const ctg = S.contagem;
  if (!ctg.numLinha) return;
  const total = ctg.valores.reduce((s, v) => s + (Number(v) || 0), 0);
  const payload = { tipo: ctg.tipo, setor: ctg.setor, numero: ctg.numLinha, valores: [...ctg.valores], total };
  ctg.numLinha = "";
  ctg.valores = Array.from({ length: Number(ctg.qtdPlantas) || 0 }, () => "");
  marcarSalvando("contagem");
  addDoc(collection(db, "contagemLinhas"), payload).then(() => { if (navigator.onLine) setSaveStatus("contagem", "saved"); }).catch((e) => console.error(e));
  renderContagem();
};
window.removerLinhaContagem = function (id) {

  deleteDoc(doc(db, "contagemLinhas", id)).then(() => { if (navigator.onLine) setSaveStatus("contagem", "saved"); }).catch((e) => console.error(e));

};

/* =========================================================================
   ABA APLICAÇÕES
   ========================================================================= */
function chaveAplic(setor, tipo) { return setor + "__" + tipo; }

function getRegistroAplic(setor, tipo) {
  const k = chaveAplic(setor, tipo);
  const existente = S.aplicacoesDados[k];
  if (existente) return existente;
  const padrao = [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO].find((t) => t.tipo === tipo);
  return { produtoInsumo: "", quantidade: "", intervalo: padrao && padrao.intervaloPadrao !== null ? padrao.intervaloPadrao : "", dataProgramada: "", dataAplicada: "" };
}

// Categoria de estoque esperada para cada tipo de lançamento — só pra filtrar o dropdown
// de produto e facilitar achar o item certo (defensivo nas aplicações, adubo nas adubações).
function categoriaEstoqueDoTipo(tipo) {
  return TIPOS_ADUBACAO.some((t) => t.tipo === tipo) ? "Adubo" : "Defensivo";
}
function insumosParaTipo(tipo) {
  const cat = categoriaEstoqueDoTipo(tipo);
  return [...S.insumos]
    .filter((i) => i.categoria === cat || i.categoria === "Outro")
    .sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
}

// Quantas linhas (setores) desse tipo estão atrasadas / em breve — mostrado no cabeçalho
// da seção pra dar pra ver o que precisa de atenção sem abrir tudo.
function contarPendentesTipo(tipo) {
  let atrasado = 0, embreve = 0;
  TALHOES.forEach((setor) => {
    const calc = calcAplicacao(getRegistroAplic(setor, tipo), tipo);
    if (calc.cor === "vermelho") atrasado++;
    else if (calc.cor === "amarelo") embreve++;
  });
  return { atrasado, embreve };
}

window.toggleAplicSecao = function (tipo) {
  const k = "sec__" + tipo;
  const colapsadoAtual = (k in S._aplicColapsado) ? S._aplicColapsado[k] : true; // padrão: começa fechado
  S._aplicColapsado[k] = !colapsadoAtual;

};

function renderAplicacoes() {
  const tiposList = [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO];
  let html = `<div class="card" style="padding:10px 12px;">

      <span id="savingPill-aplicacoes" class="saving-pill"></span>
    </div>
  </div>`;

  tiposList.forEach(({ tipo, icone, intervaloPadrao }) => {
    const secKey = "sec__" + tipo;
    const colapsado = (secKey in S._aplicColapsado) ? S._aplicColapsado[secKey] : true;
    const pend = contarPendentesTipo(tipo);
    const insumosTipo = insumosParaTipo(tipo);

    html += `<div class="aplic-section"><div class="card" style="padding:6px 4px 4px;">
      <button class="aplic-section-hdr" style="width:100%; background:none; border:none; cursor:pointer;" onclick="toggleAplicSecao('${tipo}')">
        <span style="flex:1; text-align:left;">${icone} ${esc(tipo)} ${intervaloPadrao ? `<span class="muted" style="font-weight:400; font-size:11px;">(a cada ${intervaloPadrao}d, padrão)</span>` : `<span class="muted" style="font-weight:400; font-size:11px;">(monitoramento de campo)</span>`}</span>
        ${pend.atrasado ? `<span class="status-pill vermelho">${pend.atrasado} atrasado${pend.atrasado > 1 ? "s" : ""}</span>` : ""}
        ${pend.embreve ? `<span class="status-pill amarelo">${pend.embreve} em breve</span>` : ""}
        <span class="muted" style="font-size:13px;">${colapsado ? "▸ abrir" : "▾ fechar"}</span>
      </button>`;

    if (!colapsado) {
      TALHOES.forEach((setor) => {
        const reg = getRegistroAplic(setor, tipo);
        const calc = calcAplicacao(reg, tipo);
        const rowId = `aplic-${esc(setor)}-${esc(tipo).replace(/[^a-zA-Z0-9]/g, "")}`;
        const insumoSel = S.insumos.find((i) => i.nome === reg.produtoInsumo);
        const unidade = insumoSel ? insumoSel.unidade : "";
        html += `<div class="aplic-row" id="${rowId}">
          <div class="aplic-setor">${setor}</div>
          <div>
            <div class="aplic-fields">
              <label class="field" style="grid-column:span 2;"><span>Produto (estoque)</span>
                <select onchange="atualizarAplic('${setor}','${tipo}','produtoInsumo',this.value,'${rowId}')">
                  <option value="" ${!reg.produtoInsumo ? "selected" : ""}>Selecione…</option>
                  ${insumosTipo.map((i) => `<option value="${esc(i.nome)}" ${reg.produtoInsumo === i.nome ? "selected" : ""}>${esc(i.nome)}</option>`).join("")}
                </select>

              <label class="field"><span>Qtd. aplicada${unidade ? ` (${esc(unidade)})` : ""}</span><input type="number" value="${esc(reg.quantidade)}" oninput="atualizarAplic('${setor}','${tipo}','quantidade',this.value,'${rowId}')"/></label>
              ${tipo !== "Foliar" ? `<label class="field"><span>Intervalo (dias)</span><input type="number" value="${esc(reg.intervalo)}" oninput="atualizarAplic('${setor}','${tipo}','intervalo',this.value,'${rowId}')"/></label>` : `<div></div>`}
              <label class="field"><span>Data Programada</span><input type="date" value="${esc(reg.dataProgramada)}" oninput="atualizarAplic('${setor}','${tipo}','dataProgramada',this.value,'${rowId}')"/></label>
              <label class="field"><span>Data Aplicada</span><input type="date" value="${esc(reg.dataAplicada)}" oninput="atualizarAplic('${setor}','${tipo}','dataAplicada',this.value,'${rowId}')"/></label>
            </div>
            <div class="aplic-meta">
              <span class="status-pill ${calc.cor}" id="${rowId}-pill">${calc.status}</span>
              <span id="${rowId}-prox">${calc.proxima ? `Próxima: <b style="color:#292524;">${calc.proximaFmt}</b>` : ""}</span>
            </div>
          </div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });

  document.getElementById("tabContent").innerHTML = html;
  setSaveStatus("aplicacoes", S.saveStatus.aplicacoes);
}

const _aplicTimers = {};
window.atualizarAplic = function (setor, tipo, campo, valor, rowId) {
  const k = chaveAplic(setor, tipo);
  const atual = getRegistroAplic(setor, tipo);
  const novoRegistro = { ...atual, [campo]: valor };
  S.aplicacoesDados = { ...S.aplicacoesDados, [k]: novoRegistro };

  // Atualiza só o selo e a próxima aplicação dessa linha (sem re-renderizar tudo, senão perde o foco do campo)
  const linhaCalc = calcAplicacao(novoRegistro, tipo);
  const pill = document.getElementById(rowId + "-pill");
  if (pill) { pill.className = "status-pill " + linhaCalc.cor; pill.textContent = linhaCalc.status; }
  const prox = document.getElementById(rowId + "-prox");
  if (prox) prox.innerHTML = linhaCalc.proxima ? `Próxima: <b style="color:#292524;">${linhaCalc.proximaFmt}</b>` : "";

  // Cada combinação Setor+Tipo é o SEU PRÓPRIO documento no Firestore — editar o Herbicida do A3A4
  // nunca sobrescreve o Acaricida do B3B4 (mesmo com vários tablets mexendo ao mesmo tempo, offline).
  marcarSalvando("aplicacoes");
  clearTimeout(_aplicTimers[k]);
  _aplicTimers[k] = setTimeout(() => {
    setDoc(doc(db, "aplicacoes", k), novoRegistro)
      .then(() => { if (navigator.onLine) setSaveStatus("aplicacoes", "saved"); })
      .catch((e) => console.error(e));
  }, 500);
};

function mesLabel(mesStr) {
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const [y, m] = mesStr.split("-").map(Number);
  return `${meses[m-1]}/${y}`;
}
function mesAnterior(mesStr) {
  let [y, m] = mesStr.split("-").map(Number);
  m -= 1; if (m === 0) { m = 12; y -= 1; }
  return `${y}-${String(m).padStart(2, "0")}`;
}

function calcIndicadoresMes(mes) {
  const bagsProduzidos = S.bags.filter((b) => (b.dataDescasca || "").slice(0, 7) === mes);
  const producaoKg = bagsProduzidos.reduce((s, b) => s + (Number(b.estocado1) || 0), 0);

  const bagsExpedidos = S.bags.filter((b) => (b.dataCarregamento || "").slice(0, 7) === mes);
  const expedidoKg = bagsExpedidos.reduce((s, b) => s + (Number(b.carregado1) || 0), 0);

  const descartesMes = S.registrosDescarte.filter((r) => (r.data || "").slice(0, 7) === mes);
  let descarteKg = 0, brotoKgSoma = 0, totalKgSoma = 0;
  descartesMes.forEach((r) => {
    const c = calcDescarte(r);
    descarteKg += c.totalKg;
    totalKgSoma += c.totalKg;
    brotoKgSoma += (Number(r.cats.brotos.kg) || 0);
  });
  const brotoPctMedio = totalKgSoma ? brotoKgSoma / totalKgSoma : null;

  const porArea = {};
  bagsProduzidos.forEach((b) => {
    const t = b.talhao || "—";
    porArea[t] = (porArea[t] || 0) + (Number(b.estocado1) || 0);
  });

  return { producaoKg, expedidoKg, descarteKg, brotoPctMedio, porArea, nBagsProduzidos: bagsProduzidos.length, nBagsExpedidos: bagsExpedidos.length };
}

function calcEstoqueAtual() {
  return S.bags.filter((b) => !calcLinhaRomaneio(b).temCarregado).reduce((s, b) => s + (Number(b.estocado1) || 0), 0);
}

function renderIndicadores() {
  const mes = S._mesIndicadores;
  const atual = calcIndicadoresMes(mes);
  const mesAnt = mesAnterior(mes);
  const anterior = calcIndicadoresMes(mesAnt);
  const estoque = calcEstoqueAtual();

  function variacao(a, b) { return b ? (a - b) / b : null; }
  function setaVar(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return `<span class="muted">—</span>`;
    if (v > 0.001) return `<span class="pos">▲ ${fmtPct(v)}</span>`;
    if (v < -0.001) return `<span class="neg">▼ ${fmtPct(Math.abs(v))}</span>`;
    return `<span class="muted">= 0%</span>`;
  }

  const areasSorted = Object.entries(atual.porArea).sort((a, b) => b[1] - a[1]);
  const maxArea = areasSorted.length ? areasSorted[0][1] : 0;

  let html = `
  <div class="card">
    <h3 style="margin-bottom:8px;">📈 Indicadores</h3>
    <label class="field"><span>Mês de referência</span>
      <input type="month" value="${esc(mes)}" onchange="mudarMesIndicadores(this.value)"/>
    </label>
  </div>

  <div class="grid grid-2" style="margin-bottom:14px;">
    <div class="stat-box">
      <div class="lbl">Carga produzida no mês</div>
      <div class="val" style="font-size:19px;">${fmt(atual.producaoKg,0)} kg</div>
      <div style="font-size:11px; margin-top:2px; color:#a8a29e;">${atual.nBagsProduzidos} bags — tudo que foi colhido/processado</div>
    </div>
    <div class="stat-box">
      <div class="lbl">Carga expedida no mês</div>
      <div class="val" style="font-size:19px;">${fmt(atual.expedidoKg,0)} kg</div>
      <div style="font-size:11px; margin-top:2px; color:#a8a29e;">${atual.nBagsExpedidos} bags — o que saiu de verdade</div>
    </div>
    <div class="stat-box green" style="grid-column:span 2;">
      <div class="lbl">Estoque atual</div>
      <div class="val" style="font-size:19px;">${fmt(estoque,0)} kg</div>
      <div style="font-size:11px; margin-top:2px;">produzido mas ainda não expedido (todas as cargas, não só esse mês)</div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px;">🗑️ Descarte no mês</h3>
    <div class="grid grid-2">
      <div class="stat-box"><div class="lbl">Total descartado</div><div class="val">${fmt(atual.descarteKg,0)} kg</div></div>
      <div class="stat-box"><div class="lbl">Broto (%) médio</div><div class="val">${fmtPct(atual.brotoPctMedio)}</div></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px;">🌴 Produtividade por área (mês)</h3>`;

  if (areasSorted.length === 0) {
    html += `<div class="empty">Nenhum bag descascado nesse mês ainda.</div>`;
  } else {
    areasSorted.forEach(([talhao, kg]) => {
      const pct = maxArea ? (kg / maxArea) * 100 : 0;
      html += `<div style="margin-bottom:8px;">
        <div class="row-flex" style="font-size:12.5px; margin-bottom:2px;"><b>${esc(talhao)}</b><span>${fmt(kg,0)} kg</span></div>
        <div style="background:#f0efee; border-radius:99px; height:8px; overflow:hidden;">
          <div style="background:#059669; height:100%; width:${pct}%;"></div>
        </div>
      </div>`;
    });
  }
  html += `</div>

  <div class="card">
    <h3 style="margin-bottom:10px;">📊 Comparação com ${esc(mesLabel(mesAnt))}</h3>
    <table class="tbl">
      <thead><tr><th style="text-align:left;">Indicador</th><th>${esc(mesLabel(mes))}</th><th>${esc(mesLabel(mesAnt))}</th><th>Variação</th></tr></thead>
      <tbody>
        <tr><td style="text-align:left; font-weight:600;">Produzido (kg)</td><td>${fmt(atual.producaoKg,0)}</td><td>${fmt(anterior.producaoKg,0)}</td><td>${setaVar(variacao(atual.producaoKg, anterior.producaoKg))}</td></tr>
        <tr><td style="text-align:left; font-weight:600;">Expedido (kg)</td><td>${fmt(atual.expedidoKg,0)}</td><td>${fmt(anterior.expedidoKg,0)}</td><td>${setaVar(variacao(atual.expedidoKg, anterior.expedidoKg))}</td></tr>
        <tr><td style="text-align:left; font-weight:600;">Descarte (kg)</td><td>${fmt(atual.descarteKg,0)}</td><td>${fmt(anterior.descarteKg,0)}</td><td>${setaVar(variacao(atual.descarteKg, anterior.descarteKg))}</td></tr>
      </tbody>
    </table>
  </div>`;

  document.getElementById("tabContent").innerHTML = html;
}

window.mudarMesIndicadores = function (val) {
  S._mesIndicadores = val;
  renderIndicadores();
};

/* =========================================================================
   ABA PROGRAMAÇÃO SEMANAL
   ========================================================================= */
const DIAS_SEMANA = [
  { key: "seg", label: "Seg" }, { key: "ter", label: "Ter" }, { key: "qua", label: "Qua" },
  { key: "qui", label: "Qui" }, { key: "sex", label: "Sex" }, { key: "sab", label: "Sáb" }, { key: "dom", label: "Dom" },
];

function segundaDaSemana(iso) {
  const d = new Date(iso + "T00:00:00");
  const diaSemana = d.getDay(); // 0=domingo
  const diff = diaSemana === 0 ? -6 : 1 - diaSemana;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

function numeroDaSemana(iso) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay() || 7)); // quinta-feira da mesma semana ISO
  const inicioAno = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - inicioAno) / 86400000) + 1) / 7);
}

const PALETA_CORES_ATIVIDADE = [
  { bg: "#dbeafe", fg: "#1e40af" }, { bg: "#dcfce7", fg: "#166534" }, { bg: "#fef9c3", fg: "#854d0e" },
  { bg: "#fce7f3", fg: "#9d174d" }, { bg: "#ede9fe", fg: "#5b21b6" }, { bg: "#ffedd5", fg: "#9a3412" },
  { bg: "#cffafe", fg: "#155e75" }, { bg: "#fee2e2", fg: "#991b1b" }, { bg: "#e0e7ff", fg: "#3730a3" },
  { bg: "#f0fdf4", fg: "#15803d" },
];
function corAtividade(nome) {
  let hash = 0;
  const s = nome || "";
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) & 0xffffffff;
  return PALETA_CORES_ATIVIDADE[Math.abs(hash) % PALETA_CORES_ATIVIDADE.length];
}

function progVazia() {
  const prog = {}, exec = {};
  DIAS_SEMANA.forEach((d) => { prog[d.key] = ""; exec[d.key] = ""; });
  return {
    semana: S._progSemana, atividade: "", area: "", setor: TALHOES[0],
    planejadoQtd: "", planejadoUni: "", diasNec: "", quemVaiFazer: "",
    veiculo: "", implemento: "", produtoTipo: "", produtoQtd: "", produtoUni: "",
    prog, exec,
  };
}

S._progSemana = segundaDaSemana(todayISO());
S._novaProg = progVazia();
S._progAberta = null;

function calcRendimentoProg(item) {
  const somaProg = DIAS_SEMANA.reduce((s, d) => s + (Number(item.prog[d.key]) || 0), 0);
  const somaExec = DIAS_SEMANA.reduce((s, d) => s + (Number(item.exec[d.key]) || 0), 0);
  const rendimento = somaProg ? somaExec / somaProg : null;
  return { somaProg, somaExec, rendimento };
}

function renderProgramacaoPorColaborador(itensSemana) {
  // Monta a grade "quem faz o quê cada dia" a partir do que já foi programado —
  // não precisa digitar de novo: usa o campo "Quem vai fazer" + os dias com quantidade programada.
  const colaboradores = new Set();
  itensSemana.forEach((item) => {
    (item.quemVaiFazer || "").split(",").map((n) => n.trim()).filter(Boolean).forEach((n) => colaboradores.add(n));
  });
  const nomes = Array.from(colaboradores).sort((a, b) => a.localeCompare(b, "pt-BR"));

  let html = `<div class="card">
    <h3 style="margin-bottom:10px;">👤 Quem faz o quê essa semana</h3>`;

  if (nomes.length === 0) {
    html += `<div class="empty">Nenhum colaborador informado ainda. Preenche o campo "Quem vai fazer" nas atividades da aba "Por atividade".</div></div>`;
    return html;
  }

  html += `<div class="tbl-wrap"><table class="tbl" style="min-width:640px;">
    <thead><tr><th style="text-align:left;">Colaborador</th>${DIAS_SEMANA.map(d=>`<th>${d.label}</th>`).join("")}</tr></thead>
    <tbody>`;

  nomes.forEach((nome) => {
    html += `<tr><td style="text-align:left; font-weight:700; white-space:nowrap;">${esc(nome)}</td>`;
    DIAS_SEMANA.forEach((d) => {
      const tarefas = itensSemana.filter((item) => {
        const temPessoa = (item.quemVaiFazer || "").split(",").map((n) => n.trim()).includes(nome);
        const temDia = item.prog && item.prog[d.key] !== undefined && item.prog[d.key] !== "" && Number(item.prog[d.key]) !== 0;
        return temPessoa && temDia;
      });
      if (tarefas.length === 0) {
        html += `<td style="color:#d6d3d1;">—</td>`;
      } else {
        html += `<td style="text-align:left; font-size:11.5px; line-height:1.3;">${tarefas.map((t) => { const c = corAtividade(t.atividade); return `<div style="background:${c.bg}; color:${c.fg}; border-radius:5px; padding:2px 5px; margin-bottom:3px; display:inline-block;"><b>${esc(t.setor)}</b> ${esc(t.atividade)}</div>`; }).join("")}</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>
    <div class="muted" style="font-size:11px; margin-top:8px;">Essa tabela é montada sozinha a partir das atividades cadastradas em "Por atividade" — mostra o dia se tiver quantidade programada naquele dia e o nome da pessoa estiver em "Quem vai fazer".</div>
  </div>`;
  return html;
}

window.toggleProg = function (id) {
  S._progAberta = S._progAberta === id ? null : id;
  renderProgramacao();
};
function pessoasDoItem(item) {
  return (item.quemVaiFazer || "").split(",").map((n) => n.trim()).filter(Boolean);
}

// Verifica se alguma das "pessoas" já está em OUTRA atividade nesse dia (mesma semana).
// "ignorarId" exclui a própria atividade da checagem (usado ao editar uma já existente).
function conflitosDeAgenda(pessoas, diaKey, itensDaSemana, ignorarId) {
  const conflitos = [];
  itensDaSemana.forEach((it) => {
    if (it.id === ignorarId) return;
    if (!it.prog || !it.prog[diaKey] || Number(it.prog[diaKey]) === 0) return;
    pessoasDoItem(it).forEach((nome) => {
      if (pessoas.includes(nome)) conflitos.push({ nome, atividade: it.atividade, setor: it.setor });
    });
  });
  return conflitos;
}

window.criarProgramacao = function () {
  if (!S._novaProg.atividade) { alert("Preenche o nome da atividade."); return; }

  const pessoas = pessoasDoItem(S._novaProg);
  const itensDaSemana = S.programacao.filter((p) => p.semana === S._novaProg.semana);
  let todosConflitos = [];
  DIAS_SEMANA.forEach((d) => {
    if (S._novaProg.prog[d.key] && Number(S._novaProg.prog[d.key]) !== 0) {
      conflitosDeAgenda(pessoas, d.key, itensDaSemana, null).forEach((c) => todosConflitos.push({ dia: d.label, ...c }));
    }
  });
  if (todosConflitos.length > 0) {
    const msg = todosConflitos.map((c) => `• ${c.nome} já está em "${c.atividade}" (${c.setor}) na ${c.dia}`).join("\n");
    alert("Não dá pra programar — conflito de agenda:\n\n" + msg);
    return;
  }

  const payload = { ...S._novaProg };
  setSaveStatus("programacao", "saving");
  addDoc(collection(db, "programacao"), payload)
    .then(() => { if (navigator.onLine) setSaveStatus("programacao", "saved"); })
    .catch((e) => { console.error(e); setSaveStatus("programacao", "offline"); });
  S._novaProg = progVazia();
  renderProgramacao();
};
window.removerProgramacao = function (id) {
  S._progAberta = null;
  deleteDoc(doc(db, "programacao", id)).catch((e) => console.error(e));
};
window.duplicarProgramacao = function (id) {
  const item = S.programacao.find((p) => p.id === id);
  if (!item) return;
  const execZerado = {};
  DIAS_SEMANA.forEach((d) => { execZerado[d.key] = ""; });
  S._novaProg = {
    ...item,
    prog: { ...item.prog },   // mantém os mesmos dias/quantidades programadas
    exec: execZerado,          // executado começa zerado (é uma atividade nova, ainda não feita)
    semana: S._progSemana,     // usa a semana que está selecionada na tela
  };
  delete S._novaProg.id;
  S._progAberta = null;
  if (typeof window.scrollTo === "function") window.scrollTo(0, 0);
  renderProgramacao();
};
let _progTimers = {};
window.atualizarProgDia = function (id, tipo, diaKey, valor) {
  const item = S.programacao.find((p) => p.id === id);
  if (!item) return;

  // Só checa conflito quando está mexendo no PROGRAMADO (é isso que "reserva" a pessoa naquele dia).
  if (tipo === "prog" && valor && Number(valor) !== 0) {
    const pessoas = pessoasDoItem(item);
    const itensDaSemana = S.programacao.filter((p) => p.semana === item.semana);
    const conflitos = conflitosDeAgenda(pessoas, diaKey, itensDaSemana, id);
    if (conflitos.length > 0) {
      const diaLabel = (DIAS_SEMANA.find((d) => d.key === diaKey) || {}).label || diaKey;
      const msg = conflitos.map((c) => `• ${c.nome} já está em "${c.atividade}" (${c.setor}) na ${diaLabel}`).join("\n");
      alert("Não dá pra programar — conflito de agenda:\n\n" + msg);
      renderProgramacao(); // desfaz visualmente, o valor não foi salvo
      return;
    }
  }

  item[tipo][diaKey] = valor; // atualização otimista local, evita perder o foco do campo
  const k = id + "-" + tipo + "-" + diaKey;
  clearTimeout(_progTimers[k]);
  setSaveStatus("programacao", navigator.onLine ? "saving" : "offline");
  _progTimers[k] = setTimeout(() => {
    updateDoc(doc(db, "programacao", id), { [tipo]: item[tipo] })
      .then(() => { if (navigator.onLine) setSaveStatus("programacao", "saved"); })
      .catch((e) => console.error(e));
  }, 500);
};

S._novoInsumo = { nome: "", categoria: "Defensivo", unidade: "", estoqueMinimo: "" };

// Baixas automáticas: toda linha da aba Aplicações/Adubações que tem produto do estoque + quantidade
// + data aplicada preenchidos vira um "consumo" desse insumo — sem precisar lançar de novo em Estoque.
function consumoAplicacoesDoInsumo(nome) {
  const lista = [];
  [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO].forEach(({ tipo }) => {
    TALHOES.forEach((setor) => {
      const reg = S.aplicacoesDados[chaveAplic(setor, tipo)];
      if (!reg) return;
      const qtd = Number(reg.quantidade) || 0;
      if (reg.produtoInsumo === nome && reg.dataAplicada && qtd > 0) {
        lista.push({ data: reg.dataAplicada, quantidade: qtd, setor, tipo });
      }
    });
  });
  return lista;
}

function estoqueAtual(nome) {
  const movsManuais = S.estoqueMovs
    .filter((m) => m.insumoNome === nome)
    .reduce((s, m) => s + (m.tipo === "entrada" ? (Number(m.quantidade) || 0) : -(Number(m.quantidade) || 0)), 0);
  const consumoAuto = consumoAplicacoesDoInsumo(nome).reduce((s, c) => s + c.quantidade, 0);
  return movsManuais - consumoAuto;
}

// Previsão de consumo: olha as saídas dos últimos 90 dias (ajustes manuais + baixas automáticas das
// aplicações/adubações) pra estimar o ritmo médio de uso e prever quando o estoque atual vai zerar.
function previsaoConsumo(nome) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const desde = new Date(hoje); desde.setDate(desde.getDate() - 90);
  const desdeISO = desde.toISOString().slice(0, 10);

  let totalSaidas = 0;
  let dataMaisAntiga = null;
  const registra = (data, qtd) => {
    totalSaidas += qtd;
    if (!dataMaisAntiga || data < dataMaisAntiga) dataMaisAntiga = data;
  };
  S.estoqueMovs
    .filter((m) => m.insumoNome === nome && m.tipo === "saida" && m.data >= desdeISO)
    .forEach((m) => registra(m.data, Number(m.quantidade) || 0));
  consumoAplicacoesDoInsumo(nome)
    .filter((c) => c.data >= desdeISO)
    .forEach((c) => registra(c.data, c.quantidade));

  if (totalSaidas <= 0 || !dataMaisAntiga) return null;

  const diasPeriodo = Math.max(1, Math.round((hoje - new Date(dataMaisAntiga + "T00:00:00")) / 86400000));
  const consumoDiario = totalSaidas / diasPeriodo;
  if (consumoDiario <= 0) return null;

  const atual = estoqueAtual(nome);
  const diasRestantes = Math.floor(atual / consumoDiario);
  const dataEsgota = new Date(hoje); dataEsgota.setDate(dataEsgota.getDate() + diasRestantes);
  return { consumoDiario, diasRestantes, dataEsgotaFmt: dataEsgota.toLocaleDateString("pt-BR") };
}

      </div>`;
    });

  html += `

      } else {

        html += `<div class="grid grid-2" style="background:#f0fdf4; border-radius:8px; padding:8px; margin-top:6px;">

      <label class="field" style="grid-column:span 2;"><span>Setor / motivo (opcional)</span>
        <select onchange="S._novaSaida.setor=this.value">

  document.getElementById("tabContent").innerHTML = html;

}

function montarLinhasDescartes() {
  return S.registrosDescarte.map((r) => {
    const c = calcDescarte(r);
    const row = { "Data": r.data, "Nº Romaneio": r.numeroRomaneio, "Descartes (unid)": r.descartesUnid };
    CATS_DESCARTES.forEach((cat) => {
      row[`${cat.label} (kg)`] = r.cats[cat.key].kg;
      row[`${cat.label} (unid)`] = r.cats[cat.key].unid;
    });
    row["TOTAL (kg)"] = c.totalKg; row["TOTAL (unid)"] = c.totalUnid;
    row["Broto (%)"] = c.brotoPct; row["Perda até 350g (%)"] = c.perda350; row["Aproveit. até 350g (%)"] = c.aprov350;
    row["Perda até 400g (%)"] = c.perda400; row["Aproveit. até 400g (%)"] = c.aprov400;
    return row;
  });
}

function montarLinhasIndicadores() {
  const meses = new Set();
  S.bags.forEach((b) => { if (b.dataDescasca) meses.add(b.dataDescasca.slice(0,7)); if (b.dataCarregamento) meses.add(b.dataCarregamento.slice(0,7)); });
  S.registrosDescarte.forEach((r) => { if (r.data) meses.add(r.data.slice(0,7)); });
  return Array.from(meses).sort().map((mes) => {
    const c = calcIndicadoresMes(mes);
    return {
      "Mês": mesLabel(mes), "Produzido (kg)": c.producaoKg, "Expedido (kg)": c.expedidoKg,
      "Descarte (kg)": c.descarteKg, "Broto (%) médio": c.brotoPctMedio,
      "Bags produzidos": c.nBagsProduzidos, "Bags expedidos": c.nBagsExpedidos,
    };
  });
}

function montarLinhasProgramacao() {
  return S.programacao.map((item) => {
    const { somaProg, somaExec, rendimento } = calcRendimentoProg(item);
    const row = {
      "Semana (segunda)": item.semana, "Atividade": item.atividade, "Área": item.area, "Setor": item.setor,
      "Planejado": item.planejadoQtd, "Unidade": item.planejadoUni, "Dias Necessários": item.diasNec,
      "Quem vai fazer": item.quemVaiFazer, "Veículo": item.veiculo, "Implemento": item.implemento,
      "Produto": item.produtoTipo, "Qtd. Produto": item.produtoQtd, "Uni. Produto": item.produtoUni,
    };
    DIAS_SEMANA.forEach((d) => { row["Prog. " + d.label] = item.prog[d.key]; });
    DIAS_SEMANA.forEach((d) => { row["Feito " + d.label] = item.exec[d.key]; });
    row["Total Programado"] = somaProg; row["Total Feito"] = somaExec; row["Rendimento (%)"] = rendimento;
    return row;
  });
}

function montarLinhasInsumos() {
  return S.insumos.map((ins) => {
    const prev = previsaoConsumo(ins.nome);
    return {
      "Produto": ins.nome, "Categoria": ins.categoria, "Unidade": ins.unidade,
      "Estoque Mínimo": ins.estoqueMinimo, "Estoque Atual": estoqueAtual(ins.nome),
      "Consumo Médio/Dia": prev ? Number(prev.consumoDiario.toFixed(2)) : "",
      "Previsão de Esgotar": prev ? (prev.diasRestantes <= 0 ? "já esgotou" : prev.dataEsgotaFmt) : "",
    };
  });
}
function montarLinhasEstoqueMovs() {
  const manuais = S.estoqueMovs.map((m) => ({
    "Data": m.data, "Produto": m.insumoNome, "Tipo": m.tipo === "entrada" ? "Entrada" : "Saída",
    "Quantidade": m.quantidade,
    "Origem": m.origem === "ajuste" ? "Ajuste manual" : m.origem === "compra" ? "Compra" : (m.origem || ""),
    "Setor": m.setor || "",
  }));
  const automaticas = [];
  S.insumos.forEach((ins) => {
    consumoAplicacoesDoInsumo(ins.nome).forEach((c) => {
      automaticas.push({
        "Data": c.data, "Produto": ins.nome, "Tipo": "Saída", "Quantidade": c.quantidade,
        "Origem": `Automática (${c.tipo})`, "Setor": c.setor,
      });
    });
  });
  return manuais.concat(automaticas).sort((a, b) => (a["Data"] || "").localeCompare(b["Data"] || ""));
}
function montarLinhasSolicitacoes() {
  return S.solicitacoes.map((s) => ({
    "Produto": s.insumoNome, "Quantidade Pedida": s.quantidade, "Data do Pedido": s.dataPedido,
    "Previsão": s.dataPrevista, "Status": s.status === "recebido" ? "Recebido" : "A caminho",
    "Quantidade Recebida": s.quantidadeRecebida || "", "Data Recebido": s.dataRecebido || "",
  }));
}

function montarLinhasContagem() {
  return S.contagemLinhas.map((l) => ({
    "Tipo": l.tipo, "Setor": l.setor, "Linha": l.numero, "Nº Plantas": l.valores.length, "Total Frutas": l.total,
  }));
}

function montarLinhasAplic(tiposList) {
  const rows = [];
  tiposList.forEach(({ tipo }) => {
    TALHOES.forEach((setor) => {
      const reg = getRegistroAplic(setor, tipo);
      const calc = calcAplicacao(reg, tipo);
      rows.push({
        "Setor": setor, "Tipo": tipo, "Produto": reg.produtoInsumo, "Quantidade Aplicada": reg.quantidade, "Intervalo (dias)": reg.intervalo,
        "Data Programada": reg.dataProgramada, "Data Aplicada": reg.dataAplicada,
        "Status": calc.status, "Próxima Aplicação": calc.proximaFmt,
      });
    });
  });
  return rows;
}

/* =========================================================================
   BACKUP NO GOOGLE SHEETS
   ========================================================================= */
window.enviarBackupSheets = async function () {
  const pill = document.getElementById("backupPill");
  if (pill) { pill.textContent = "enviando…"; pill.className = "backup-pill enviando"; }
  try {
    const payload = {
      sheets: {
        "Romaneio": montarLinhasRomaneio(),
        "Descartes": montarLinhasDescartes(),
        "Contagem": montarLinhasContagem(),
        "Aplicações": montarLinhasAplic(TIPOS_APLICACAO),
        "Adubações": montarLinhasAplic(TIPOS_ADUBACAO),
        "Indicadores": montarLinhasIndicadores(),
        "Programação": montarLinhasProgramacao(),
        "Insumos": montarLinhasInsumos(),
        "Estoque Movimentações": montarLinhasEstoqueMovs(),
        "Solicitações": montarLinhasSolicitacoes(),
      },
    };
    const res = await fetch(BACKUP_SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita pré-checagem CORS que o Apps Script não trata bem
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data && data.ok) {
      if (pill) { pill.textContent = "backup ok ✓"; pill.className = "backup-pill ok"; }
    } else {
      throw new Error((data && data.erro) || "falha desconhecida");
    }
  } catch (e) {
    console.error("Backup Sheets falhou:", e);
    if (pill) { pill.textContent = "falhou, tenta de novo"; pill.className = "backup-pill erro"; }
  }
  setTimeout(() => { if (pill) { pill.textContent = ""; pill.className = "backup-pill"; } }, 4000);
};


/* =========================================================================
   INSTALAÇÃO DO APP (PWA)
   ========================================================================= */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});
window.instalarApp = async function () {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBanner").classList.remove("show");
};
window.addEventListener("appinstalled", () => {
  document.getElementById("installBanner").classList.remove("show");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").then((reg) => {
      // Verifica se tem versão nova assim que abre o app
      reg.update().catch(() => {});
      // Se detectar uma versão nova instalada, recarrega sozinho pra usar ela
      reg.addEventListener("updatefound", () => {
        const novoSW = reg.installing;
        if (!novoSW) return;
        novoSW.addEventListener("statechange", () => {
          if (novoSW.state === "activated") {
            window.location.reload();
          }
        });
      });
    }).catch((e) => console.warn("SW falhou:", e));
  });

  let jaRecarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (jaRecarregou) return;
    jaRecarregou = true;
    window.location.reload();
  });
}

/* =========================================================================
   TEMA (claro / escuro / alto contraste)
   ========================================================================= */
const TEMAS = [
  { id: "claro", icone: "☀️" },
  { id: "escuro", icone: "🌙" },
  { id: "contraste", icone: "🔆" },
];
function aplicarTema(id) {
  if (id === "claro") document.body.removeAttribute("data-tema");
  else document.body.setAttribute("data-tema", id);
  const btn = document.getElementById("btnTema");
  const t = TEMAS.find((t) => t.id === id) || TEMAS[0];
  if (btn) btn.textContent = t.icone;
  try { localStorage.setItem("coco-tema", id); } catch (e) { /* sem storage, tudo bem */ }
}
window.alternarTema = function () {
  const atual = document.body.getAttribute("data-tema") || "claro";
  const idx = TEMAS.findIndex((t) => t.id === atual);
  const proximo = TEMAS[(idx + 1) % TEMAS.length];
  aplicarTema(proximo.id);
};
(function iniciarTema() {
  let salvo = "claro";
  try { salvo = localStorage.getItem("coco-tema") || "claro"; } catch (e) {}
  aplicarTema(salvo);
})();
