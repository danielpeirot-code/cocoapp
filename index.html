  return html;
}

window.addDescarte = function (cargaId) {
  if (!S._formDescarte || S._formDescarte.cargaId !== cargaId) return;
  const payload = { ...S._formDescarte };
  S._formDescarte = null;
  marcarSalvando("descartes");
  addDoc(collection(db, "descartes"), payload).then(() => { if (navigator.onLine) setSaveStatus("descartes", "saved"); }).catch((e) => tratarErroSalvamento("descartes", e));
  renderRomaneio();
};
window.removeDescarte = function (id) {
  pedirSenha(() => {
    marcarSalvando("descartes");
    deleteDoc(doc(db, "descartes", id)).then(() => { if (navigator.onLine) setSaveStatus("descartes", "saved"); }).catch((e) => tratarErroSalvamento("descartes", e));
    renderRomaneio();
  });
};

/* =========================================================================
   ABA CONTAGEM
   ========================================================================= */
function linhasContagem(tipo, setor) {
  return S.contagemLinhas.filter((l) => l.tipo === tipo && l.setor === setor);
}

function renderContagem() {
  try { renderContagemInner(); }
  catch (e) {
    console.error("Erro ao renderizar Contagem:", e);
    document.getElementById("tabContent").innerHTML = `<div class="card" style="border-color:#dc2626;">
      <b style="color:#dc2626;">⚠️ Deu erro ao mostrar essa tela.</b>
      <div class="muted" style="font-size:11px; margin-top:6px; word-break:break-word;">${esc(String(e && e.message || e))}</div>
      <div class="muted" style="font-size:11px; margin-top:6px;">Tira um print e manda pra quem cuida do app.</div>
    </div>`;
  }
}
function renderContagemInner() {
  const ctg = S.contagem;
  const registrosSetor = linhasContagem(ctg.tipo, ctg.setor);
  const somaTotal = registrosSetor.reduce((s, l) => s + l.total, 0);
  const media = registrosSetor.length ? somaTotal / registrosSetor.length : null;
  const config = TIPOS_CONTAGEM[ctg.tipo];
  const estimativa = media !== null ? media * config.linhasPorSetor : null;
  const totalLinha = ctg.valores.reduce((s, v) => s + (Number(v) || 0), 0);
  const modoDuasLinhas = !!config.censoCompleto; // Anão Verde: conta em duas colunas lado a lado, igual planilha

  // No Anão Verde não é "completar as 52 linhas" — é contar linha após linha (em dupla) até
  // bater a meta de frutos definida pra hoje. A meta é a mesma usada na aba Colheita, e o
  // "contado hoje" soma TODOS os setores (a meta é do dia inteiro, não só desse setor) menos
  // a baseline (pra quando já zerou o contador nessa mesma data, começando uma rodada nova).
  const hoje = todayISO();
  const metaChave = chaveMetaColheita(hoje, ctg.tipo);
  const meta = Number((S.metasColheita[metaChave] || {}).meta) || 0;
  const totalHojeRaw = S.contagemLinhas.filter((l) => l.tipo === ctg.tipo && l.data === hoje).reduce((s, l) => s + (Number(l.total) || 0), 0);
  const somaHojeSetor = Math.max(0, totalHojeRaw - baselineHoje(ctg.tipo));
  const faltamFrutos = Math.max(0, meta - somaHojeSetor);
  const registrosHojeSetorAtual = registrosSetor.filter((l) => l.data === hoje);
  const mediaHoje = registrosHojeSetorAtual.length
    ? registrosHojeSetorAtual.reduce((s, l) => s + l.total, 0) / registrosHojeSetorAtual.length : null;
  const linhasEstimadasRestantes = (faltamFrutos > 0 && mediaHoje) ? Math.ceil(faltamFrutos / mediaHoje) : null;

  let html = `
  <div class="card">
    <div class="row-flex" style="margin-bottom:10px;">
      <h3>🌱 Contar linha${modoDuasLinhas ? "s (em dupla)" : ""}</h3>
      <span id="savingPill-contagem" class="saving-pill"></span>
    </div>
    <div class="grid grid-4" style="margin-bottom:12px;">
      <label class="field"><span>Tipo</span>
        <select id="contagemTipoSelect" onchange="mudarTipoContagem(this.value)">
          ${Object.keys(TIPOS_CONTAGEM).map(t=>`<option value="${t}" ${ctg.tipo===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </label>
      <label class="field"><span>Setor</span>
        <select id="contagemSetorSelect" onchange="ctgSet('setor', this.value); renderContagem();">
          ${TIPOS_CONTAGEM[ctg.tipo].setores.map(s=>`<option value="${s}" ${ctg.setor===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </label>
      <label class="field"><span>Nº da linha${modoDuasLinhas ? " A" : ""}</span><input type="number" value="${esc(ctg.numLinha)}" oninput="ctgSet('numLinha', this.value)" onblur="renderContagem()"/></label>
      ${modoDuasLinhas
        ? `<label class="field"><span>Nº da linha B</span><input type="number" value="${esc(ctg.numLinhaB)}" oninput="ctgSet('numLinhaB', this.value)" onblur="renderContagem()"/></label>`
        : `<label class="field"><span>Plantas nessa linha</span><input type="number" value="${esc(ctg.qtdPlantas)}" oninput="mudarQtdPlantas(this.value)"/></label>`}
    </div>
    <button class="btn ghost" style="width:auto; margin-bottom:6px;" onclick="verSetorContagem()">🔍 Ver setor</button>`;

  // Avisa antes de tentar salvar se a linha (ou as duas, no modo dupla) ainda está descansando —
  // não deixa nem chegar a apertar salvar sem saber que vai travar.
  const mapaCiclo = construirMapaUltimasContagens();
  const statusLinhaA = linhaDisponivelParaContar(ctg.tipo, ctg.setor, ctg.numLinha, mapaCiclo);
  html += !statusLinhaA.disponivel
    ? `<div style="font-size:11.5px; margin-bottom:8px; color:#9a3412; background:#FFEDD5; border-radius:8px; padding:6px 10px;">🟠 Linha ${esc(ctg.numLinha)} ainda descansando — faltam ${statusLinhaA.diasFaltam} dia${statusLinhaA.diasFaltam>1?"s":""}.</div>`
    : "";
  if (modoDuasLinhas) {
    const statusLinhaB = linhaDisponivelParaContar(ctg.tipo, ctg.setor, ctg.numLinhaB, mapaCiclo);
    html += !statusLinhaB.disponivel
      ? `<div style="font-size:11.5px; margin-bottom:8px; color:#9a3412; background:#FFEDD5; border-radius:8px; padding:6px 10px;">🟠 Linha ${esc(ctg.numLinhaB)} ainda descansando — faltam ${statusLinhaB.diasFaltam} dia${statusLinhaB.diasFaltam>1?"s":""}.</div>`
      : "";
  }

  if (modoDuasLinhas) {
    html += `<div class="grid grid-2" style="margin-bottom:10px;">
      <label class="field"><span>Meta de frutos hoje (${esc(ctg.tipo)})</span><input type="number" value="${meta || ""}" placeholder="ex: 5000" oninput="definirMetaColheita(this.value)"/></label>
      <label class="field"><span>Plantas por linha</span><input type="number" value="${esc(ctg.qtdPlantas)}" oninput="mudarQtdPlantas(this.value)"/></label>
    </div>
    ${meta > 0 ? `<div class="grid grid-2" style="margin-bottom:8px;">
      <div class="stat-box ico ${somaHojeSetor>=meta?'green':''}"><div class="stat-ic">👥</div><div><div class="lbl">Contado hoje (todos setores)</div><div class="val">${fmt(somaHojeSetor,0)}</div></div></div>
      <div class="stat-box ico ${faltamFrutos===0?'green':''}"><div class="stat-ic laranja">🌴</div><div><div class="lbl">Faltam</div><div class="val">${fmt(faltamFrutos,0)}</div></div></div>
      <div class="stat-box ico" style="grid-column:span 2;"><div class="stat-ic azul">📋</div><div><div class="lbl">~Linhas restantes</div><div class="val">${linhasEstimadasRestantes ?? "—"}</div></div></div>
    </div>
    ${somaHojeSetor >= meta ? `<div style="background:#dcfce7; border-radius:8px; padding:7px 10px; margin-bottom:8px; font-size:12px; color:#166534; font-weight:700;">🎉 Bateu a meta! <button class="btn ghost" style="width:auto; padding:3px 8px; font-size:11px; margin-left:6px;" onclick="zerarContadorColheita('${ctg.tipo}', ${totalHojeRaw})">🔄 Zerar e começar nova rodada</button></div>` : ""}` : ""}
    <div class="muted" style="font-size:11px; margin-bottom:6px;">Anda pela rua contando uma árvore da linha A, uma da linha B, e assim por diante — preenche as duas colunas na mesma ordem que for passando.</div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:340px;"><thead><tr>
      <th style="text-align:left;">Árvore</th><th>Linha ${esc(ctg.numLinha || "A")}</th><th>Linha ${esc(ctg.numLinhaB || "B")}</th>
    </tr></thead><tbody>`;
    const qtd = Math.max(ctg.valores.length, (ctg.valoresB || []).length);
    for (let i = 0; i < qtd; i++) {
      html += `<tr>
        <td style="text-align:left; font-weight:600; color:#a8a29e;">${i+1}</td>
        <td><input type="number" value="${esc(ctg.valores[i])}" oninput="setValorPlanta(${i}, this.value)"/></td>
        <td><input type="number" value="${esc((ctg.valoresB||[])[i])}" oninput="setValorPlantaB(${i}, this.value)"/></td>
      </tr>`;
    }
    const totalLinhaB = (ctg.valoresB || []).reduce((s, v) => s + (Number(v) || 0), 0);
    html += `<tr style="font-weight:800; background:#fafaf9;">
        <td style="text-align:left;">Total</td><td>${totalLinha}</td><td>${totalLinhaB}</td>
      </tr>
    </tbody></table></div>
    <div style="margin-top:10px;"><button class="btn" onclick="salvarDuasLinhasContagem()">💾 Salvar as duas linhas e ir pras próximas</button></div>`;
  } else {
    let gridHtml = "";
    ctg.valores.forEach((v, i) => {
      gridHtml += `<div class="planta-cell"><span class="n">${i+1}</span><input type="number" value="${esc(v)}" oninput="setValorPlanta(${i}, this.value)"/></div>`;
    });
    html += `<div style="font-size:10px; font-weight:700; text-transform:uppercase; color:#78716c; margin-bottom:6px;">Quantidade de fruta por planta</div>
    <div class="plantas-grid">${gridHtml}</div>
    <div class="row-flex">
      <span class="muted">Total desta linha: <b style="color:#292524;">${totalLinha}</b></span>
      <button class="btn" style="width:auto;" onclick="salvarLinhaContagem()">💾 Salvar linha e ir pra próxima</button>
    </div>`;
  }

  html += `
  </div>

  <div class="card">
    <h3>📋 Setor ${esc(ctg.setor)} — ${esc(ctg.tipo)}</h3>`;

  if (config.censoCompleto) {
    html += `<div class="grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:14px;">
      <div class="stat-box ico"><div class="stat-ic">🥥</div><div><div class="lbl">Total contado (histórico)</div><div class="val">${fmt(somaTotal,0)}</div></div></div>
      <div class="stat-box ico"><div class="stat-ic azul">📋</div><div><div class="lbl">Linhas já contadas</div><div class="val">${registrosSetor.length}</div></div></div>
    </div>`;
  } else {
    html += `<div class="grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:14px;">
      <div class="stat-box ico"><div class="stat-ic">🥥</div><div><div class="lbl">Soma total</div><div class="val">${fmt(somaTotal,0)}</div></div></div>
      <div class="stat-box ico"><div class="stat-ic azul">📊</div><div><div class="lbl">Média/linha</div><div class="val">${fmt(media,1)}</div></div></div>
      <div class="stat-box ico green"><div class="stat-ic">🎯</div><div><div class="lbl">Estim. setor (${config.linhasPorSetor} linhas)</div><div class="val">${fmt(estimativa,0)}</div></div></div>
    </div>`;
  }

  if (registrosSetor.length === 0) {
    html += `<div class="empty">Nenhuma linha contada ainda neste setor.</div>`;
  } else {
    html += `<table class="tbl"><thead><tr><th style="text-align:left;">Linha</th><th>Plantas</th><th>Total frutas</th><th></th></tr></thead><tbody>`;
    registrosSetor.forEach((l) => {
      html += `<tr>
        <td style="text-align:left; font-weight:600;">${esc(l.numero)}</td>
        <td>${l.valores.length}</td>
        <td style="font-weight:700;">${fmt(l.total,0)}</td>
        <td><button class="x-btn" onclick="removerLinhaContagem('${l.id}')">✕</button></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  document.getElementById("tabContent").innerHTML = html;
  setSaveStatus("contagem", S.saveStatus.contagem);
}

window.ctgSet = function (key, val) { S.contagem[key] = val; };

// Botão manual pra "forçar" ir pro setor/tipo escolhido — lê direto dos selects na tela,
// então funciona mesmo se o onchange do celular não disparar sozinho de vez em quando.
window.verSetorContagem = function () {
  const selTipo = document.getElementById("contagemTipoSelect");
  const selSetor = document.getElementById("contagemSetorSelect");
  if (selTipo) S.contagem.tipo = selTipo.value;
  if (selSetor) S.contagem.setor = selSetor.value;
  renderContagem();
};
window.mudarTipoContagem = function (tipo) {
  pararContagemVoz();
  S.contagem.tipo = tipo;
  S.contagem.setor = TIPOS_CONTAGEM[tipo].setores[0];
  S.contagem.qtdPlantas = TIPOS_CONTAGEM[tipo].plantasPadrao;
  S.contagem.valores = Array.from({ length: S.contagem.qtdPlantas }, () => "");
  S.contagem.numLinhaB = "";
  S.contagem.valoresB = Array.from({ length: S.contagem.qtdPlantas }, () => "");
  renderContagem();
};
window.mudarQtdPlantas = function (val) {
  pararContagemVoz();
  S.contagem.qtdPlantas = val;
  S.contagem.valores = Array.from({ length: Number(val) || 0 }, () => "");
  S.contagem.valoresB = Array.from({ length: Number(val) || 0 }, () => "");
  renderContagem();
};
window.setValorPlanta = function (i, val) { S.contagem.valores[i] = val; };
window.setValorPlantaB = function (i, val) { S.contagem.valoresB[i] = val; };

/* =========================================================================
   CONTAGEM POR VOZ
   ========================================================================= */
const UNIDADES_PT = { "zero":0,"um":1,"uma":1,"dois":2,"duas":2,"três":3,"tres":3,"quatro":4,"cinco":5,"seis":6,"sete":7,"oito":8,"nove":9 };
const DEZ_A_DEZENOVE_PT = { "dez":10,"onze":11,"doze":12,"treze":13,"quatorze":14,"catorze":14,"quinze":15,"dezesseis":16,"dezasseis":16,"dezessete":17,"dezassete":17,"dezoito":18,"dezenove":19,"dezanove":19 };
const DEZENAS_PT = { "vinte":20,"trinta":30,"quarenta":40,"cinquenta":50,"sessenta":60,"setenta":70,"oitenta":80,"noventa":90 };
const CENTENAS_PT = { "cem":100,"cento":100 };

// Antes essa função usava `.includes()` num dicionário só de 0-20 — o que causava um bug feio:
// como "dez" é testado antes, qualquer fala com "dezesseis/dezessete/dezoito/dezenove" virava 10
// (porque essas palavras CONTÊM "dez" e também "seis/sete/oito/nove" como substring). Agora a
// comparação é palavra por palavra (não substring) e também entende números compostos, tipo
// "vinte e cinco" ou "trinta e dois", que são comuns numa contagem de coco por planta.
function extrairNumeroDaFala(texto) {
  const t = (texto || "").toLowerCase().trim();

  // Se o motor de voz já devolveu em dígitos (comum em vários Android), usa direto — é o caminho mais confiável.
  const digitos = t.match(/\d+/);
  if (digitos) return parseInt(digitos[0], 10);

  const palavras = t
    .replace(/[^\wà-úÀ-Ú\s]/g, " ")
    .split(/\s+/)
    .filter((p) => p && p !== "e"); // "e" é só conector ("vinte E cinco"), não conta como número

  if (palavras.length === 0) return null;

  let total = null;
  for (const p of palavras) {
    if (p in CENTENAS_PT) total = (total || 0) + CENTENAS_PT[p];
    else if (p in DEZENAS_PT) total = (total || 0) + DEZENAS_PT[p];
    else if (p in DEZ_A_DEZENOVE_PT) total = (total || 0) + DEZ_A_DEZENOVE_PT[p];
    else if (p in UNIDADES_PT) total = (total || 0) + UNIDADES_PT[p];
    // palavras que não são número (ex: "coco", "cocos", "planta") são ignoradas, não travam o resultado
  }
  return total;
}

let _recognitionVoz = null;
window.toggleContagemVoz = function () {
  if (S._vozAtivo) { pararContagemVoz(); return; }
  iniciarContagemVoz();
};

function criarReconhecimentoVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "pt-BR";
  // Antes "continuous" ficava false e o app recriava o reconhecimento inteiro a cada número —
  // por isso a demora e a sensação de precisar falar de novo (o microfone "morria" entre uma
  // fala e outra, e o novo às vezes não pegava o começo da próxima palavra a tempo). Com
  // continuous=true, o mesmo microfone escuta vários números seguidos sem re-inicializar.
  // Só recriamos quando o navegador encerra a sessão sozinho (o que ainda acontece de vez em
  // quando, principalmente no Android) — isso é tratado no onend, não a cada resultado.
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  let ultimoIndiceProcessado = -1;

  rec.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const resultado = event.results[i];
      const transcript = resultado[0].transcript;

      if (!resultado.isFinal) {
        // só mostra o que está ouvindo (feedback de que o microfone está vivo); não confirma ainda
        const btn = document.getElementById("btnVoz");
        if (btn) btn.textContent = `🔴 ouvindo: "${transcript.trim()}"…`;
        continue;
      }

      if (i <= ultimoIndiceProcessado) continue; // já processamos esse trecho antes
      ultimoIndiceProcessado = i;

      const numero = extrairNumeroDaFala(transcript);
      if (numero !== null) aplicarNumeroDaVoz(numero);
    }
  };

  rec.onerror = (event) => {
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      alert("Preciso de permissão pra usar o microfone.");
      pararContagemVoz();
    }
    // outros erros (ex: "no-speech", "aborted") são normais — o onend cuida de reiniciar
  };

  rec.onend = () => {
    if (!S._vozAtivo) return;
    // O navegador derruba a sessão de vez em quando por conta própria (silêncio prolongado,
    // limite de tempo do Android etc) — aqui só recriamos quando isso realmente acontece,
    // não depois de cada número reconhecido.
    setTimeout(() => {
      if (!S._vozAtivo) return;
      try {
        _recognitionVoz = criarReconhecimentoVoz();
        _recognitionVoz.start();
      } catch (e) {
        console.error("Falha ao reiniciar reconhecimento de voz:", e);
        S._vozAtivo = false;
        if (S.currentTab === "contagem") renderContagem();
      }
    }, 250);
  };

  return rec;
}

function aplicarNumeroDaVoz(numero) {
  if (S._vozIndiceAtual >= S.contagem.valores.length) { pararContagemVoz(); return; }
  S.contagem.valores[S._vozIndiceAtual] = String(numero);
  S._vozIndiceAtual += 1;
  if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(70); // confirma sem precisar olhar pra tela
  if (S._vozIndiceAtual >= S.contagem.valores.length) {
    pararContagemVoz();
  } else if (S.currentTab === "contagem") {
    renderContagem();
  }
}

function iniciarContagemVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    const aviso = document.getElementById("vozAvisoNaoSuportado");
    if (aviso) aviso.style.display = "block";
    return;
  }
  S._vozAtivo = true;
  S._vozIndiceAtual = S.contagem.valores.findIndex((v) => v === "" || v === null || v === undefined);
  if (S._vozIndiceAtual === -1) S._vozIndiceAtual = 0;

  try {
    _recognitionVoz = criarReconhecimentoVoz();
    _recognitionVoz.start();
  } catch (e) {
    console.error("Erro ao iniciar reconhecimento de voz:", e);
    S._vozAtivo = false;
  }
  if (S.currentTab === "contagem") renderContagem();
}

function pararContagemVoz() {
  S._vozAtivo = false;
  if (_recognitionVoz) {
    try { _recognitionVoz.onend = null; _recognitionVoz.stop(); } catch (e) {}
    _recognitionVoz = null;
  }
  if (S.currentTab === "contagem") renderContagem();
}

// Impede contar de novo uma linha que ainda está no período de descanso — só libera quando
// completar os 21 dias. Reaproveita o mesmo mapa/cálculo já usado na aba Colheita. Aceita um
// mapa já pronto (pra não reconstruir do zero toda vez que precisa checar duas linhas seguidas).
function linhaDisponivelParaContar(tipo, setor, numero, mapaPronto) {
  if (!numero) return { disponivel: true, diasFaltam: 0 };
  const mapa = mapaPronto || construirMapaUltimasContagens();
  return statusCicloLinhaComMapa(mapa, tipo, setor, numero);
}

window.salvarLinhaContagem = function () {
  const ctg = S.contagem;
  if (!ctg.numLinha) return;

  const status = linhaDisponivelParaContar(ctg.tipo, ctg.setor, ctg.numLinha);
  if (!status.disponivel) {
    alert(`Essa linha (${ctg.numLinha}) ainda está descansando — faltam ${status.diasFaltam} dia${status.diasFaltam>1?"s":""} pra completar o ciclo de ${CICLO_COLHEITA_DIAS} dias. Não dá pra contar de novo antes disso.`);
    return;
  }

  const total = ctg.valores.reduce((s, v) => s + (Number(v) || 0), 0);
  const payload = { tipo: ctg.tipo, setor: ctg.setor, numero: ctg.numLinha, valores: [...ctg.valores], total, data: todayISO() };
  // Avança pra próxima linha sozinho (se o número for numérico) — quem conta linha atrás de
  // linha (como no Anão Verde, onde precisa contar todas) não perde tempo digitando de novo.
  const proximoNumero = Number(ctg.numLinha);
  ctg.numLinha = Number.isFinite(proximoNumero) && ctg.numLinha !== "" ? String(proximoNumero + 1) : "";
  ctg.valores = Array.from({ length: Number(ctg.qtdPlantas) || 0 }, () => "");
  marcarSalvando("contagem");
  addDoc(collection(db, "contagemLinhas"), payload).then(() => { if (navigator.onLine) setSaveStatus("contagem", "saved"); }).catch((e) => tratarErroSalvamento("contagem", e));
  renderContagem();
};

// Anão Verde é contado linha por linha, mas em dupla — a pessoa faz a linha A inteira, depois
// a linha B inteira, e salva as duas juntas de uma vez (sem precisar apertar salvar duas vezes).
window.salvarDuasLinhasContagem = function () {
  const ctg = S.contagem;
  if (!ctg.numLinha || !ctg.numLinhaB) { alert("Preenche o número das duas linhas."); return; }

  const statusA = linhaDisponivelParaContar(ctg.tipo, ctg.setor, ctg.numLinha);
  const statusB = linhaDisponivelParaContar(ctg.tipo, ctg.setor, ctg.numLinhaB);
  if (!statusA.disponivel || !statusB.disponivel) {
    const avisos = [];
    if (!statusA.disponivel) avisos.push(`Linha ${ctg.numLinha}: faltam ${statusA.diasFaltam} dia${statusA.diasFaltam>1?"s":""}`);
    if (!statusB.disponivel) avisos.push(`Linha ${ctg.numLinhaB}: faltam ${statusB.diasFaltam} dia${statusB.diasFaltam>1?"s":""}`);
    alert("Essas linhas ainda estão descansando — não dá pra contar antes de completar os 21 dias:\n\n" + avisos.join("\n"));
    return;
  }

  const totalA = ctg.valores.reduce((s, v) => s + (Number(v) || 0), 0);
  const totalB = ctg.valoresB.reduce((s, v) => s + (Number(v) || 0), 0);
  const hoje = todayISO();
  const payloadA = { tipo: ctg.tipo, setor: ctg.setor, numero: ctg.numLinha, valores: [...ctg.valores], total: totalA, data: hoje };
  const payloadB = { tipo: ctg.tipo, setor: ctg.setor, numero: ctg.numLinhaB, valores: [...ctg.valoresB], total: totalB, data: hoje };

  const proxA = Number(ctg.numLinha), proxB = Number(ctg.numLinhaB);
  ctg.numLinha = Number.isFinite(proxA) ? String(proxA + 2) : "";
  ctg.numLinhaB = Number.isFinite(proxB) ? String(proxB + 2) : "";
  ctg.valores = Array.from({ length: Number(ctg.qtdPlantas) || 0 }, () => "");
  ctg.valoresB = Array.from({ length: Number(ctg.qtdPlantas) || 0 }, () => "");

  marcarSalvando("contagem");
  Promise.all([
    addDoc(collection(db, "contagemLinhas"), payloadA),
    addDoc(collection(db, "contagemLinhas"), payloadB),
  ]).then(() => { if (navigator.onLine) setSaveStatus("contagem", "saved"); }).catch((e) => tratarErroSalvamento("contagem", e));
  renderContagem();
};

window.removerLinhaContagem = function (id) {
  pedirSenha(() => {
    marcarSalvando("contagem");
    deleteDoc(doc(db, "contagemLinhas", id)).then(() => { if (navigator.onLine) setSaveStatus("contagem", "saved"); }).catch((e) => tratarErroSalvamento("contagem", e));
    renderContagem();
  });
};

/* =========================================================================
   ABA COLHEITA
   Isso aqui é só uma tela de consulta — nada é lançado aqui. Os números reais
   (o que foi contado/colhido de cada linha) continuam sendo lançados na
   Contagem; a Colheita só lê esses registros e organiza pra responder
   "qual setor e qual linha eu entro colher hoje", cruzando com o ciclo de
   21 dias de descanso por linha (o mesmo cacho não volta antes disso).
   ========================================================================= */
const CICLO_COLHEITA_DIAS = 21;
const CACHO_REFERENCIA = { "Anão Verde": 18, "Híbrido": 25, "Anão Seco": 25 }; // só um lembrete na tela, não afeta cálculo nenhum

S._colheitaTipo = "Anão Verde";
S._colheitaSetor = TIPOS_CONTAGEM["Anão Verde"].setores[0];

function chaveMetaColheita(data, tipo) { return data + "__" + tipo; }

function diasDesde(dataISO) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const d = new Date(dataISO + "T00:00:00");
  return Math.round((hoje - d) / 86400000);
}

// Última vez (mais recente) que essa linha foi contada — usado pra saber há quantos dias ela
// "descansa" e quando completa o ciclo de novo. Registros muito antigos (de antes desta função
// existir) não têm data salva — esses não dá pra saber quando foram contados, então entram
// como "disponível" por padrão (não têm como travar o ciclo sem essa informação).
//
// Construído como um mapa único (varre a lista de contagens uma vez só) em vez de vasculhar tudo
// de novo pra cada uma das até 52 linhas — sem isso, abrir a Colheita ficava pesado/travava
// conforme foi acumulando mais contagens.
function construirMapaUltimasContagens() {
  const mapa = new Map();
  S.contagemLinhas.forEach((l) => {
    if (!l.data) return;
    const chave = l.tipo + "__" + l.setor + "__" + String(l.numero);
    const atual = mapa.get(chave);
    if (!atual || l.data > atual) mapa.set(chave, l.data);
  });
  return mapa;
}

function statusCicloLinhaComMapa(mapa, tipo, setor, numero) {
  const ultimaData = mapa.get(tipo + "__" + setor + "__" + String(numero));
  if (!ultimaData) return { disponivel: true, diasFaltam: 0, ultima: null };
  const dias = diasDesde(ultimaData);
  // O próprio dia da contagem já conta como o 1º dia do descanso — por isso "-1": contando hoje,
  // já mostra 20 dias faltando (não 21), e completa o ciclo no dia 21 depois da contagem.
  const diasFaltam = Math.max(0, CICLO_COLHEITA_DIAS - dias - 1);
  return { disponivel: diasFaltam === 0, diasFaltam, ultima: ultimaData };
}

// Toda linha contada na aba Contagem, pra esse tipo+setor+data de hoje, conta como "colhida hoje".
function contagensDoDia(tipo, setor, data) {
  return S.contagemLinhas.filter((l) => l.tipo === tipo && l.setor === setor && l.data === data);
}

// "Contado hoje" soma toda contagem do dia — mas às vezes tem mais de uma "rodada" de colheita
// no mesmo dia (bateu a meta, fechou uma carga, começa outra). Em vez de ficar somando o dia
// inteiro sem parar, guarda-se uma "baseline" (o total de quando a rodada anterior terminou) e
// o "contado hoje" exibido é o total real MENOS essa baseline — sem apagar nada da Contagem,
// só ajusta o que aparece como "dessa rodada".
function baselineHoje(tipo) {
  const chave = chaveMetaColheita(todayISO(), tipo);
  return Number((S.metasColheita[chave] || {}).baseline) || 0;
}

window.definirMetaColheita = function (valor) {
  const chave = chaveMetaColheita(todayISO(), S._colheitaTipo);
  const atual = S.metasColheita[chave] || {};
  const novo = { ...atual, meta: Number(valor) || 0 };
  S.metasColheita = { ...S.metasColheita, [chave]: novo };
  marcarSalvando("colheita");
  setDoc(doc(db, "metasColheita", chave), novo)
    .then(() => { if (navigator.onLine) setSaveStatus("colheita", "saved"); })
    .catch((e) => tratarErroSalvamento("colheita", e));
};

// Zera o contador "dessa rodada" sem apagar nenhuma contagem — só marca o total de agora como
// o novo "ponto de partida". Usa isso depois de fechar uma carga / bater a meta, pra começar a
// próxima rodada do zero.
window.zerarContadorColheita = function (tipo, totalHojeAtual) {
  if (!confirm("Zerar o contador de \"colhido hoje\"? Nada da Contagem é apagado, só o contador dessa tela volta a zero pra começar uma nova rodada.")) return;
  const chave = chaveMetaColheita(todayISO(), tipo);
  const atual = S.metasColheita[chave] || {};
  const novo = { ...atual, baseline: totalHojeAtual };
  S.metasColheita = { ...S.metasColheita, [chave]: novo };
  marcarSalvando("colheita");
  setDoc(doc(db, "metasColheita", chave), novo)
    .then(() => { if (navigator.onLine) setSaveStatus("colheita", "saved"); })
    .catch((e) => tratarErroSalvamento("colheita", e));
  renderColheita();
};

function renderColheita() {
  try { renderColheitaInner(); }
  catch (e) {
    console.error("Erro ao renderizar Colheita:", e);
    document.getElementById("tabContent").innerHTML = `<div class="card" style="border-color:#dc2626;">
      <b style="color:#dc2626;">⚠️ Deu erro ao mostrar essa tela.</b>
      <div class="muted" style="font-size:11px; margin-top:6px; word-break:break-word;">${esc(String(e && e.message || e))}</div>
      <div class="muted" style="font-size:11px; margin-top:6px;">Tira um print e manda pra quem cuida do app.</div>
    </div>`;
  }
}
// Botão manual pra "forçar" ir pro setor escolhido — lê o valor direto dos selects na tela,
// então funciona mesmo se o onchange do celular não disparar sozinho de vez em quando.
window.verSetorColheita = function () {
  const selTipo = document.getElementById("colheitaTipoSelect");
  const selSetor = document.getElementById("colheitaSetorSelect");
  if (selTipo) S._colheitaTipo = selTipo.value;
  if (selSetor) S._colheitaSetor = selSetor.value;
  renderColheita();
};

function renderColheitaInner() {
  const tipo = S._colheitaTipo;
  const setor = S._colheitaSetor;
  const config = TIPOS_CONTAGEM[tipo];
  const hoje = todayISO();
  const mapaUltimas = construirMapaUltimasContagens();

  const contadasHoje = contagensDoDia(tipo, setor, hoje);
  const totalHojeTodosSetoresRaw = S.contagemLinhas.filter((l) => l.tipo === tipo && l.data === hoje).reduce((s, l) => s + (Number(l.total) || 0), 0);
  const baseline = baselineHoje(tipo);
  const totalHojeExibido = Math.max(0, totalHojeTodosSetoresRaw - baseline);
  const metaChave = chaveMetaColheita(hoje, tipo);
  const meta = Number((S.metasColheita[metaChave] || {}).meta) || 0;
  const faltam = Math.max(0, meta - totalHojeExibido);
  const bateuMeta = meta > 0 && totalHojeExibido >= meta;
  const mediaPorLinhaHoje = contadasHoje.length ? contadasHoje.reduce((s, l) => s + (Number(l.total) || 0), 0) / contadasHoje.length : null;
  const linhasRestantesEstimadas = (faltam > 0 && mediaPorLinhaHoje) ? Math.ceil(faltam / mediaPorLinhaHoje) : null;

  // Quais setores desse tipo já têm linha disponível hoje — pra responder "em qual setor eu entro"
  const setoresComDisponivel = config.setores.filter((s) => {
    for (let linha = 1; linha <= config.linhasPorSetor; linha++) {
      if (statusCicloLinhaComMapa(mapaUltimas, tipo, s, linha).disponivel) return true;
    }
    return false;
  });

  let html = `<div class="card" style="padding:10px 12px;">
    <span class="muted" style="font-size:12px;">🌾 Só consulta — os números de verdade continuam sendo lançados na aba Contagem. Aqui é só pra ver onde entrar colher hoje.</span>
  </div>`;

  html += `<div class="card">
    <div class="grid grid-2" style="margin-bottom:10px;">
      <label class="field"><span>Tipo</span>
        <select id="colheitaTipoSelect" onchange="S._colheitaTipo=this.value; S._colheitaSetor=TIPOS_CONTAGEM[this.value].setores[0]; renderColheita();">
          ${Object.keys(TIPOS_CONTAGEM).map((t) => `<option value="${t}" ${tipo===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </label>
      <label class="field"><span>Setor</span>
        <select id="colheitaSetorSelect" onchange="S._colheitaSetor=this.value; renderColheita();">
          ${config.setores.map((s) => `<option value="${s}" ${setor===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </label>
    </div>
    <button class="btn ghost" style="width:auto; margin-bottom:10px;" onclick="verSetorColheita()">🔍 Ver setor</button>
    <div class="muted" style="font-size:11.5px; margin-bottom:6px;">📍 Referência: colher o cacho nº ${CACHO_REFERENCIA[tipo] || "—"} para ${esc(tipo)}.</div>
    <div style="font-size:12.5px;">👉 Setores com linha disponível hoje: ${setoresComDisponivel.length > 0 ? setoresComDisponivel.map(s => `<span class="status-pill verde" style="margin-right:4px;">${esc(s)}</span>`).join("") : `<span class="status-pill amarelo">nenhum — todos descansando</span>`}</div>
  </div>`;

  html += `<div class="card">
    <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:#78716c; margin-bottom:8px; display:flex; align-items:center; gap:5px;">🗓️ Meta de hoje (${brDate(hoje)}) — ${esc(tipo)}</div>
    <div class="grid grid-2" style="margin-bottom:8px;">
      <div class="stat-box ico"><div class="stat-ic">🎯</div><div><div class="lbl">Meta de frutos</div><input type="number" value="${meta || ""}" placeholder="ex: 5000" style="border:none; background:none; padding:0; font-size:18px; font-weight:800; width:100%;" oninput="definirMetaColheita(this.value)"/></div></div>
      <div class="stat-box ico ${bateuMeta?'green':''}"><div class="stat-ic">👥</div><div><div class="lbl">Contado hoje</div><div class="val">${fmt(totalHojeExibido,0)}</div></div></div>
    </div>
    ${meta > 0 ? `<div class="grid grid-2" style="margin-bottom:8px;">
      <div class="stat-box ico ${faltam===0?'green':''}"><div class="stat-ic laranja">🌴</div><div><div class="lbl">Faltam</div><div class="val">${fmt(faltam,0)}</div></div></div>
      <div class="stat-box ico"><div class="stat-ic azul">📋</div><div><div class="lbl">Linhas restantes (${esc(setor)})</div><div class="val">${linhasRestantesEstimadas ?? "—"}</div></div></div>
    </div>` : ""}
    ${bateuMeta ? `<div style="background:#dcfce7; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:12.5px; color:#166534; font-weight:700;">🎉 Bateu a meta de hoje!</div>` : ""}
    <div class="list-row" style="cursor:pointer; padding:8px 4px;" onclick="zerarContadorColheita('${tipo}', ${totalHojeTodosSetoresRaw})">
      <span class="stat-ic azul" style="width:28px; height:28px; font-size:13px;">🔄</span>
      <span style="font-size:12.5px; font-weight:700; color:#292524;">Zerar contador (começar nova rodada)</span>
      <span class="chev">›</span>
    </div>
    <div class="muted" style="font-size:10.5px; margin-top:2px;">Não apaga nada da Contagem — só zera o que aparece aqui, pra começar a contar de novo em direção a uma nova meta (ex: depois de fechar uma carga).</div>
  </div>`;

  // Situação do ciclo de cada linha desse setor — disponível pra entrar colher ou ainda descansando
  html += `<div class="card">
    <h3 style="margin-bottom:8px; font-size:13px;">📅 Ciclo das linhas — ${esc(setor)}</h3>
    <div class="muted" style="font-size:11px; margin-bottom:8px;">🟢 disponível — 🟠 ainda descansando (dias que faltam pro ciclo de ${CICLO_COLHEITA_DIAS} dias completar)</div>
    <div style="display:flex; flex-wrap:wrap; gap:5px;">`;
  for (let linha = 1; linha <= config.linhasPorSetor; linha++) {
    const st = statusCicloLinhaComMapa(mapaUltimas, tipo, setor, linha);
    const cor = st.disponivel ? "#C6EFCE" : "#FED7AA";
    const corTexto = st.disponivel ? "#065f46" : "#9a3412";
    html += `<div title="${st.ultima ? "Última contagem: " + brDate(st.ultima) : "Nunca contada"}" style="background:${cor}; color:${corTexto}; border-radius:6px; padding:4px 6px; font-size:10.5px; font-weight:700; min-width:30px; text-align:center;">
      ${linha}${!st.disponivel ? `<div style="font-size:8.5px; font-weight:600;">${st.diasFaltam}d</div>` : ""}
    </div>`;
  }
  html += `</div></div>`;

  if (contadasHoje.length > 0) {
    html += `<div class="card">
      <h3 style="margin-bottom:8px; font-size:13px;">Contado hoje — ${esc(setor)}</h3>
      <div class="muted" style="font-size:11px; margin-bottom:6px;">Pra corrigir ou excluir algum, faz isso direto na aba Contagem.</div>`;
    contadasHoje.forEach((l) => {
      html += `<div style="padding:4px 0; font-size:12.5px;">Linha ${esc(l.numero)}: <b>${fmt(l.total,0)}</b> frutos</div>`;
    });
    html += `</div>`;
  }

  document.getElementById("tabContent").innerHTML = html;
}

/* =========================================================================
   ABA APLICAÇÕES
   ========================================================================= */
function chaveAplic(setor, tipo) { return setor + "__" + tipo; }

function getRegistroAplic(setor, tipo) {
  const k = chaveAplic(setor, tipo);
  const existente = S.aplicacoesDados[k];
  if (existente) return existente;
  const padrao = [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO].find((t) => t.tipo === tipo);
  return { produtoInsumo: "", quantidade: "", intervalo: padrao && padrao.intervaloPadrao !== null ? padrao.intervaloPadrao : "", dataProgramada: "", dataAplicada: "" };
}

// Categoria de estoque esperada para cada tipo de lançamento — só pra filtrar o dropdown
// de produto e facilitar achar o item certo (defensivo nas aplicações, adubo nas adubações).
function categoriaEstoqueDoTipo(tipo) {
  return TIPOS_ADUBACAO.some((t) => t.tipo === tipo) ? "Adubo" : "Defensivo";
}
function insumosParaTipo(tipo) {
  const cat = categoriaEstoqueDoTipo(tipo);
  return [...S.insumos]
    .filter((i) => i.categoria === cat || i.categoria === "Outro")
    .sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
}

// Quantas linhas (setores) desse tipo estão atrasadas / em breve — mostrado no cabeçalho
// da seção pra dar pra ver o que precisa de atenção sem abrir tudo.
function contarPendentesTipo(tipo) {
  let atrasado = 0, embreve = 0;
  TALHOES.forEach((setor) => {
    const calc = calcAplicacao(getRegistroAplic(setor, tipo), tipo);
    if (calc.cor === "vermelho") atrasado++;
    else if (calc.cor === "amarelo") embreve++;
  });
  return { atrasado, embreve };
}

window.toggleAplicSecao = function (tipo) {
  const k = "sec__" + tipo;
  const colapsadoAtual = (k in S._aplicColapsado) ? S._aplicColapsado[k] : true; // padrão: começa fechado
  S._aplicColapsado[k] = !colapsadoAtual;
  renderAplicacoes();
};

      <span id="savingPill-aplicacoes" class="saving-pill"></span>
    </div>
  </div>`;

  tiposList.forEach(({ tipo, icone, intervaloPadrao }) => {
    const secKey = "sec__" + tipo;
    const colapsado = (secKey in S._aplicColapsado) ? S._aplicColapsado[secKey] : true;
    const pend = contarPendentesTipo(tipo);
    const insumosTipo = insumosParaTipo(tipo);

    html += `<div class="aplic-section"><div class="card" style="padding:6px 4px 4px;">

        ${pend.atrasado ? `<span class="status-pill vermelho">${pend.atrasado} atrasado${pend.atrasado > 1 ? "s" : ""}</span>` : ""}
        ${pend.embreve ? `<span class="status-pill amarelo">${pend.embreve} em breve</span>` : ""}
        <span class="chev" style="transform:rotate(${colapsado?"0":"90"}deg); transition:transform .15s;">›</span>
      </button>`;

    if (!colapsado) {
      TALHOES.forEach((setor) => {
        const reg = getRegistroAplic(setor, tipo);
        const calc = calcAplicacao(reg, tipo);
        const rowId = `aplic-${esc(setor)}-${esc(tipo).replace(/[^a-zA-Z0-9]/g, "")}`;
        const insumoSel = S.insumos.find((i) => i.nome === reg.produtoInsumo);
        const unidade = insumoSel ? insumoSel.unidade : "";
        html += `<div class="aplic-row" id="${rowId}">
          <div class="aplic-setor">${setor}</div>
          <div>
            <div class="aplic-fields">
              <label class="field" style="grid-column:span 2;"><span>Produto (estoque)</span>
                <select onchange="atualizarAplic('${setor}','${tipo}','produtoInsumo',this.value,'${rowId}')">
                  <option value="" ${!reg.produtoInsumo ? "selected" : ""}>Selecione…</option>
                  ${insumosTipo.map((i) => `<option value="${esc(i.nome)}" ${reg.produtoInsumo === i.nome ? "selected" : ""}>${esc(i.nome)}</option>`).join("")}
                </select>
              </label>
              <label class="field"><span>Qtd. aplicada${unidade ? ` (${esc(unidade)})` : ""}</span><input type="number" value="${esc(reg.quantidade)}" oninput="atualizarAplic('${setor}','${tipo}','quantidade',this.value,'${rowId}')"/></label>
              ${tipo !== "Foliar" ? `<label class="field"><span>Intervalo (dias)</span><input type="number" value="${esc(reg.intervalo)}" oninput="atualizarAplic('${setor}','${tipo}','intervalo',this.value,'${rowId}')"/></label>` : `<div></div>`}
              <label class="field"><span>Data Programada</span><input type="date" value="${esc(reg.dataProgramada)}" oninput="atualizarAplic('${setor}','${tipo}','dataProgramada',this.value,'${rowId}')"/></label>
              <label class="field"><span>Data Aplicada</span><input type="date" value="${esc(reg.dataAplicada)}" oninput="atualizarAplic('${setor}','${tipo}','dataAplicada',this.value,'${rowId}')"/></label>
            </div>
            <div class="aplic-meta">
              <span class="status-pill ${calc.cor}" id="${rowId}-pill">${calc.status}</span>
              <span id="${rowId}-prox">${calc.proxima ? `Próxima: <b style="color:#292524;">${calc.proximaFmt}</b>` : ""}</span>
            </div>
          </div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });

  document.getElementById("tabContent").innerHTML = html;
  setSaveStatus("aplicacoes", S.saveStatus.aplicacoes);
}

const _aplicTimers = {};
const _cargaTimers = {};

// Autosave dos dados de transporte (motorista, placa, destino, horário) — cada campo salva
// sozinho meio segundo depois de parar de digitar, sem re-renderizar a tela (senão perderia
// o foco do campo a cada letra digitada).
window.editarNumeroCarga = function (cargaId) {
  pedirSenha(() => {
    const carga = S.cargas.find((c) => c.id === cargaId);
    if (!carga) return;
    const novoStr = prompt("Novo número da carga:", carga.numero);
    if (novoStr === null) return; // cancelou
    const novo = novoStr.trim();
    if (!novo) { alert("O número não pode ficar em branco."); return; }
    atualizarCarga(cargaId, "numero", novo);
    renderRomaneio();
  });
};

window.atualizarCarga = function (cargaId, campo, valor) {
  const idx = S.cargas.findIndex((c) => c.id === cargaId);
  if (idx >= 0) S.cargas[idx] = { ...S.cargas[idx], [campo]: valor };

  marcarSalvando("romaneio");
  const chave = cargaId + "__" + campo;
  clearTimeout(_cargaTimers[chave]);
  _cargaTimers[chave] = setTimeout(() => {
    updateDoc(doc(db, "cargas", cargaId), { [campo]: valor })
      .then(() => { if (navigator.onLine) setSaveStatus("romaneio", "saved"); })
      .catch((e) => tratarErroSalvamento("romaneio", e));
  }, 500);
};

// Amostra de água: guarda a lista inteira de leituras (em ml) direto no documento da carga.
// Cada "adicionar" e "remover" já salva a lista atualizada na hora, sem precisar de botão salvar.

// Valor pago por unidade descascada manualmente — fica guardado à parte (não no documento da
// carga), porque é o MESMO valor pra qualquer carga, até alguém trocar. Cada lançamento guarda
// o valor que estava valendo NA HORA (não recalcula pra trás se o valor mudar depois — assim o
// histórico de pagamento fica correto mesmo que o valor por unidade mude no futuro).
function valorDescascaAtual() {
  return Number(S.configPagamento.valorUnidade) || 0.12;
}

window.trocarValorDescasca = function () {
  pedirSenha(() => {
    const atual = valorDescascaAtual();
    const novoStr = prompt(`Valor atual: R$ ${atual.toFixed(2)} por unidade descascada.\nDigite o novo valor:`, atual.toFixed(2).replace(".", ","));
    if (novoStr === null) return;
    const novo = Number(String(novoStr).replace(",", "."));
    if (!novo || novo <= 0) { alert("Valor inválido."); return; }
    setDoc(doc(db, "configuracoes", "pagamentoDescasca"), { valorUnidade: novo })
      .then(() => alert(`Valor atualizado pra R$ ${novo.toFixed(2)} por unidade.`))
      .catch((e) => { console.error(e); alert("Não consegui salvar o valor novo. Tenta de novo."); });
  });
};

window.adicionarDescascaManual = function (cargaId) {
  const nomeInput = document.getElementById("descascaNomeInput-" + cargaId);
  const qtdInput = document.getElementById("descascaQtdInput-" + cargaId);
  const nome = nomeInput ? nomeInput.value.trim() : "";
  const quantidade = Number(qtdInput ? qtdInput.value : 0);
  if (!nome || !quantidade || quantidade <= 0) { alert("Preenche o nome do colaborador e a quantidade descascada."); return; }

  const carga = S.cargas.find((c) => c.id === cargaId);
  if (!carga) return;
  const novaLista = [...(carga.descascaManual || []), { colaborador: nome, quantidade, valorUnidade: valorDescascaAtual(), data: todayISO() }];
  const idx = S.cargas.findIndex((c) => c.id === cargaId);
  S.cargas[idx] = { ...carga, descascaManual: novaLista };
  if (nomeInput) nomeInput.value = "";
  if (qtdInput) qtdInput.value = "";
  renderRomaneio();

  marcarSalvando("romaneio");
  updateDoc(doc(db, "cargas", cargaId), { descascaManual: novaLista })
    .then(() => { if (navigator.onLine) setSaveStatus("romaneio", "saved"); })
    .catch((e) => tratarErroSalvamento("romaneio", e));
};

window.removerDescascaManual = function (cargaId, index) {
  pedirSenha(() => {
    const carga = S.cargas.find((c) => c.id === cargaId);
    if (!carga) return;
    const novaLista = (carga.descascaManual || []).filter((_, i) => i !== index);
    const idx = S.cargas.findIndex((c) => c.id === cargaId);
    S.cargas[idx] = { ...carga, descascaManual: novaLista };
    renderRomaneio();

    marcarSalvando("romaneio");
    updateDoc(doc(db, "cargas", cargaId), { descascaManual: novaLista })
      .then(() => { if (navigator.onLine) setSaveStatus("romaneio", "saved"); })
      .catch((e) => tratarErroSalvamento("romaneio", e));
  });
};

window.atualizarAplic = function (setor, tipo, campo, valor, rowId) {
  const k = chaveAplic(setor, tipo);
  const atual = getRegistroAplic(setor, tipo);
  const novoRegistro = { ...atual, [campo]: valor };
  S.aplicacoesDados = { ...S.aplicacoesDados, [k]: novoRegistro };

  // Atualiza só o selo e a próxima aplicação dessa linha (sem re-renderizar tudo, senão perde o foco do campo)
  const linhaCalc = calcAplicacao(novoRegistro, tipo);
  const pill = document.getElementById(rowId + "-pill");
  if (pill) { pill.className = "status-pill " + linhaCalc.cor; pill.textContent = linhaCalc.status; }
  const prox = document.getElementById(rowId + "-prox");
  if (prox) prox.innerHTML = linhaCalc.proxima ? `Próxima: <b style="color:#292524;">${linhaCalc.proximaFmt}</b>` : "";

  // Cada combinação Setor+Tipo é o SEU PRÓPRIO documento no Firestore — editar o Herbicida do A3A4
  // nunca sobrescreve o Acaricida do B3B4 (mesmo com vários tablets mexendo ao mesmo tempo, offline).
  marcarSalvando("aplicacoes");
  clearTimeout(_aplicTimers[k]);
  _aplicTimers[k] = setTimeout(() => {
    setDoc(doc(db, "aplicacoes", k), novoRegistro)
      .then(() => { if (navigator.onLine) setSaveStatus("aplicacoes", "saved"); })
      .catch((e) => tratarErroSalvamento("aplicacoes", e));
  }, 500);
};

/* =========================================================================
   ABA INDICADORES
   ========================================================================= */
function mesLabel(mesStr) {
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const [y, m] = mesStr.split("-").map(Number);
  return `${meses[m-1]}/${y}`;
}
function mesAnterior(mesStr) {
  let [y, m] = mesStr.split("-").map(Number);
  m -= 1; if (m === 0) { m = 12; y -= 1; }
  return `${y}-${String(m).padStart(2, "0")}`;
}

function calcIndicadoresMes(mes) {
  const bagsProduzidos = S.bags.filter((b) => (b.dataDescasca || "").slice(0, 7) === mes);
  const producaoKg = bagsProduzidos.reduce((s, b) => s + (Number(b.estocado1) || 0), 0);

  const bagsExpedidos = S.bags.filter((b) => (b.dataCarregamento || "").slice(0, 7) === mes);
  const expedidoKg = bagsExpedidos.reduce((s, b) => s + (Number(b.carregado1) || 0), 0);

  const descartesMes = S.registrosDescarte.filter((r) => (r.data || "").slice(0, 7) === mes);
  let descarteKg = 0, brotoKgSoma = 0, totalKgSoma = 0;
  descartesMes.forEach((r) => {
    const c = calcDescarte(r);
    descarteKg += c.totalKgDescarteReal; // só Brotos+Refugos+350-400g — 400-500g e Acima 500g não são descarte
    totalKgSoma += c.totalKg; // esse aqui continua sendo o processado inteiro, pra calcular o % de broto certo
    brotoKgSoma += (Number(r.cats.brotos.kg) || 0);
  });
  const brotoPctMedio = totalKgSoma ? brotoKgSoma / totalKgSoma : null;

  const porArea = {};
  bagsProduzidos.forEach((b) => {
    const t = b.talhao || "—";
    porArea[t] = (porArea[t] || 0) + (Number(b.estocado1) || 0);
  });

  return { producaoKg, expedidoKg, descarteKg, brotoPctMedio, porArea, nBagsProduzidos: bagsProduzidos.length, nBagsExpedidos: bagsExpedidos.length };
}

function calcEstoqueAtual() {
  return S.bags.filter((b) => !calcLinhaRomaneio(b).temCarregado).reduce((s, b) => s + (Number(b.estocado1) || 0), 0);
}

/* =========================================================================
   PAINEL (DASHBOARD)
   Resumo geral + alertas — junta o que já existe nas outras abas (estoque,
   aplicações, programação, ocorrências) num só lugar, pra bater o olho rápido
   no que precisa de atenção sem precisar entrar em cada aba.
   ========================================================================= */
function montarAlertas() {
  const alertas = [];

  // Estoque baixo ou previsto pra acabar logo
  S.insumos.forEach((ins) => {
    const atual = estoqueAtual(ins.nome);
    const minimo = Number(ins.estoqueMinimo) || 0;
    if (minimo > 0 && atual <= minimo) {
      alertas.push({ cor: "vermelho", categoria: "estoque", texto: `${ins.nome} abaixo do estoque mínimo (${fmt(atual,1)} ${ins.unidade})` });
    } else {
      const prev = previsaoConsumo(ins.nome);
      if (prev && prev.diasRestantes > 0 && prev.diasRestantes <= 14) {
        alertas.push({ cor: "amarelo", categoria: "estoque", texto: `${ins.nome}: previsão de acabar em ~${prev.diasRestantes} dia${prev.diasRestantes===1?"":"s"}` });
      }
    }
  });

  // Aplicações/Adubações atrasadas em algum setor
  TALHOES.forEach((talhao) => {
    [...TIPOS_APLICACAO, ...TIPOS_ADUBACAO].forEach(({ tipo }) => {
      const reg = S.aplicacoesDados[chaveAplic(talhao, tipo)];
      const calc = calcAplicacao(reg, tipo);
      if (calc.cor === "vermelho") alertas.push({ cor: "vermelho", categoria: "aplicacao", texto: `${tipo} atrasada no setor ${talhao}` });
    });
  });

  // Programação da semana atual — atividades com dias já passados sem execução completa
  const semanaAtual = segundaDaSemana(todayISO());
  const hojeIdx = (new Date().getDay() + 6) % 7; // segunda=0 ... domingo=6
  S.programacao.filter((p) => p.semana === semanaAtual).forEach((p) => {
    let temPendencia = false;
    DIAS_SEMANA.forEach((d, i) => {
      if (i > hojeIdx) return;
      const planejado = Number(p.prog[d.key]) || 0;
      const executado = Number(p.exec[d.key]) || 0;
      if (planejado > 0 && executado < planejado) temPendencia = true;
    });
    if (temPendencia) alertas.push({ cor: "amarelo", categoria: "programacao", texto: `Programação "${p.atividade || "atividade"}" (${p.setor}) com pendência essa semana` });
  });

  // Ocorrências dos últimos 7 dias — entram como "atenção" (não necessariamente urgente),
  // já que registrar a ocorrência não significa que ainda está sem solução.
  const seteDiasAtras = new Date(); seteDiasAtras.setDate(seteDiasAtras.getDate() - 7);
  const seteDiasISO = seteDiasAtras.toISOString().slice(0, 10);
  S.ocorrencias.filter((o) => (o.data || "") >= seteDiasISO).forEach((o) => {
    alertas.push({ cor: "amarelo", categoria: "ocorrencia", texto: `Ocorrência: ${o.tipo}${o.setor ? " — " + o.setor : ""} (${brDate(o.data)})` });
  });

  return alertas;
}

// Traduz os alertas num resumo em linguagem natural, tipo o que um supervisor diria de cabeça
// ao chegar de manhã — situação geral + contagem por tipo de problema.
function montarResumoSupervisor(alertas) {
  const criticos = alertas.filter((a) => a.cor === "vermelho").length;
  const atencao = alertas.filter((a) => a.cor === "amarelo").length;
  const porCategoria = {};
  alertas.forEach((a) => { porCategoria[a.categoria] = (porCategoria[a.categoria] || 0) + 1; });

  let situacao;
  if (criticos > 0) situacao = { cor: "vermelho", label: "CRÍTICO" };
  else if (atencao > 0) situacao = { cor: "amarelo", label: "ATENÇÃO" };
  else situacao = { cor: "verde", label: "NORMAL" };

  const linhas = [];
  if (alertas.length > 0) linhas.push({ cor: "amarelo", texto: `${alertas.length} pendência${alertas.length>1?"s":""} identificada${alertas.length>1?"s":""}.` });
  if (porCategoria.estoque) linhas.push({ cor: "vermelho", texto: `${porCategoria.estoque} item${porCategoria.estoque>1?"s":""} de estoque em situação crítica ou de atenção.` });
  if (porCategoria.aplicacao) linhas.push({ cor: "vermelho", texto: `${porCategoria.aplicacao} aplicação${porCategoria.aplicacao>1?"ões":""} atrasada${porCategoria.aplicacao>1?"s":""}.` });
  if (porCategoria.programacao) linhas.push({ cor: "amarelo", texto: `${porCategoria.programacao} atividade${porCategoria.programacao>1?"s":""} da programação com pendência essa semana.` });
  if (porCategoria.ocorrencia) linhas.push({ cor: "amarelo", texto: `${porCategoria.ocorrencia} ocorrência${porCategoria.ocorrencia>1?"s":""} recente${porCategoria.ocorrencia>1?"s":""} registrada${porCategoria.ocorrencia>1?"s":""}.` });
  if (alertas.length === 0) linhas.push({ cor: "verde", texto: "Nenhuma pendência identificada — tudo dentro do esperado." });

  return { situacao, linhas };
}

function renderDashboard() {
  const mesAtual = todayISO().slice(0, 7);
  const ind = calcIndicadoresMes(mesAtual);
  const estoqueEmEspera = calcEstoqueAtual();

  const totalPlantasContadas = S.contagemLinhas.reduce((s, l) => s + (l.valores ? l.valores.length : 0), 0);
  const totalFrutasContadas = S.contagemLinhas.reduce((s, l) => s + (Number(l.total) || 0), 0);

  let normais = 0, baixos = 0;
  S.insumos.forEach((ins) => {
    const atual = estoqueAtual(ins.nome);
    const minimo = Number(ins.estoqueMinimo) || 0;
    if (minimo > 0 && atual <= minimo) baixos++; else normais++;
  });

  const alertas = montarAlertas();
  const resumo = montarResumoSupervisor(alertas);
  const alertasOrdenados = alertas.filter((a) => a.cor === "vermelho").concat(alertas.filter((a) => a.cor === "amarelo"));

/* =========================================================================
   ABA PROGRAMAÇÃO SEMANAL

const DIAS_SEMANA = [
  { key: "seg", label: "Seg" }, { key: "ter", label: "Ter" }, { key: "qua", label: "Qua" },
  { key: "qui", label: "Qui" }, { key: "sex", label: "Sex" }, { key: "sab", label: "Sáb" }, { key: "dom", label: "Dom" },
];

function segundaDaSemana(iso) {
  const d = new Date(iso + "T00:00:00");
  const diaSemana = d.getDay(); // 0=domingo
  const diff = diaSemana === 0 ? -6 : 1 - diaSemana;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

function numeroDaSemana(iso) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay() || 7)); // quinta-feira da mesma semana ISO
  const inicioAno = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - inicioAno) / 86400000) + 1) / 7);
}

const PALETA_CORES_ATIVIDADE = [
  { bg: "#dbeafe", fg: "#1e40af" }, { bg: "#dcfce7", fg: "#166534" }, { bg: "#fef9c3", fg: "#854d0e" },
  { bg: "#fce7f3", fg: "#9d174d" }, { bg: "#ede9fe", fg: "#5b21b6" }, { bg: "#ffedd5", fg: "#9a3412" },
  { bg: "#cffafe", fg: "#155e75" }, { bg: "#fee2e2", fg: "#991b1b" }, { bg: "#e0e7ff", fg: "#3730a3" },
  { bg: "#f0fdf4", fg: "#15803d" }, { bg: "#fae8ff", fg: "#86198f" }, { bg: "#ecfccb", fg: "#3f6212" },
  { bg: "#fef3c7", fg: "#92400e" }, { bg: "#e0f2fe", fg: "#075985" },
];
// Antes a cor era sorteada por um "hash" do nome da atividade — o que podia coincidir e duas
// atividades diferentes caírem na mesma cor por acaso (foi o que você viu acontecer). Agora a cor
// é atribuída pela posição da atividade na lista cadastrada em ordem alfabética — assim, enquanto
// você tiver até 14 atividades diferentes, nenhuma repete cor.
function corAtividade(nome) {
  const nomesOrdenados = Object.values(S.atividadesPadrao)
    .map((a) => a.nome)
    .sort((a, b) => a.localeCompare(b, "pt-BR"));
  let idx = nomesOrdenados.indexOf(nome);
  if (idx === -1) {
    // Atividade digitada de um jeito que não bate com nenhuma cadastrada no Rendimento
    // (ex: registro antigo, texto livre) — cai de volta pro hash, só como reserva.
    let hash = 0;
    const s = nome || "";
    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) & 0xffffffff;
    idx = Math.abs(hash);
  }
  return PALETA_CORES_ATIVIDADE[idx % PALETA_CORES_ATIVIDADE.length];
}

function progVazia() {
  const prog = {}, exec = {};
  DIAS_SEMANA.forEach((d) => { prog[d.key] = ""; exec[d.key] = ""; });
  return {
    semana: S._progSemana, atividade: "", area: "", setor: TALHOES[0],
    planejadoQtd: "", planejadoUni: "", diasNec: "", quemVaiFazer: "",
    veiculo: "", implemento: "", produtoTipo: "", produtoQtd: "", produtoUni: "",
    prog, exec,
  };
}

function calcRendimentoProg(item) {
  const somaProg = DIAS_SEMANA.reduce((s, d) => s + (Number(item.prog[d.key]) || 0), 0);
  const somaExec = DIAS_SEMANA.reduce((s, d) => s + (Number(item.exec[d.key]) || 0), 0);
  const rendimento = somaProg ? somaExec / somaProg : null;
  return { somaProg, somaExec, rendimento };
}

// Importação em lote — cola vários nomes de uma vez (um por linha) em vez de cadastrar um
// colaborador de cada vez. Pula quem já está cadastrado, pra não duplicar.
window.importarColaboradores = function () {
  const texto = document.getElementById("importarColaboradoresTexto");
  const nomes = (texto ? texto.value : "").split("\n").map((l) => l.trim()).filter(Boolean);
  if (nomes.length === 0) { alert("Cola pelo menos um nome, um por linha."); return; }

  const jaExistentes = new Set(S.colaboradores.map((c) => c.nome.toLowerCase()));
  let importados = 0, jaExistiam = 0;
  nomes.forEach((nome) => {
    if (jaExistentes.has(nome.toLowerCase())) { jaExistiam++; return; }
    addDoc(collection(db, "colaboradores"), { nome }).catch((e) => console.error(e));
    jaExistentes.add(nome.toLowerCase());
    importados++;
  });

  if (texto) texto.value = "";
  alert(`${importados} colaborador${importados>1?"es":""} importado${importados>1?"s":""}!${jaExistiam ? `\n${jaExistiam} já estava${jaExistiam>1?"m":""} cadastrado${jaExistiam>1?"s":""} (pulado${jaExistiam>1?"s":""}).` : ""}`);
};

// Busca o padrão cadastrado (aba Rendimento) que bate com o NOME da atividade escolhida —
// usado tanto pra mostrar a unidade quanto pra validar o quanto foi planejado.
function padraoDaAtividade(nomeAtividade) {
  return Object.values(S.atividadesPadrao).find((a) => a.nome === nomeAtividade) || null;
}

// Compara o planejado (quantidade × dias necessários seria o total, mas aqui comparamos direto
// a quantidade informada) com o esperado = rendimento padrão × nº de pessoas × dias necessários.
// Não bloqueia o cadastro — só avisa, porque pode ter um motivo legítimo pra fugir do padrão
// (terreno mais difícil, etc.), quem decide é o supervisor.
function validarRendimentoProg(item) {
  const padrao = padraoDaAtividade(item.atividade);
  if (!padrao || !Number(padrao.rendimentoPadrao)) return null;
  const pessoas = pessoasDoItem(item).length;
  const dias = Number(item.diasNec) || 0;
  const planejado = Number(item.planejadoQtd) || 0;
  if (pessoas === 0 || dias === 0 || !planejado) return null;

  const esperado = Number(padrao.rendimentoPadrao) * pessoas * dias;
  const razao = planejado / esperado;
  if (razao >= 0.9 && razao <= 1.1) return { ok: true, esperado, unidade: padrao.unidade };
  return { ok: false, esperado, unidade: padrao.unidade, acima: razao > 1 };
}

window.mudarProgSemana = function (val) {

  S._novaProg = progVazia();

};
window.mudarProgView = function (v) {
